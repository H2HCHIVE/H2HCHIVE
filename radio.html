<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>라디오 | H2HCHIVE</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    min-height:100%;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#f5f6f8;
    color:#222;
}


/* =========================
   콘텐츠
========================= */

.content{
    width:100%;
    min-height:100vh;
}

.content-inner{
    width:100%;
    max-width:900px;

    margin:0 auto;

    padding:24px 16px 60px;
}


/* =========================
   상단 제목
========================= */

.main-title{
    margin-bottom:14px;

    padding-bottom:10px;

    border-bottom:1px solid #ddd;
}

.main-title h1{
    display:inline-block;

    position:relative;

    margin:0;

    padding:0 0 10px;

    font-size:1.1rem;
    font-weight:700;
}

.main-title h1::after{
    content:"";

    position:absolute;

    left:0;
    right:0;
    bottom:-11px;

    height:2px;

    background:#89CFF0;
}


/* =========================
   카테고리
========================= */

.category-list{
    display:flex;
    flex-direction:column;

    max-height:126px;

    overflow-y:auto;

    margin-bottom:14px;

    border:1px solid #e1e1e1;
    border-radius:10px;

    background:#fff;

    scrollbar-width:thin;
    scrollbar-color:#d5d5d5 transparent;
}

.category-list::-webkit-scrollbar{
    width:4px;
}

.category-list::-webkit-scrollbar-track{
    background:transparent;
}

.category-list::-webkit-scrollbar-thumb{
    background:#d5d5d5;
    border-radius:999px;
}


/* =========================
   카테고리 버튼
========================= */

.category{
    flex-shrink:0;

    width:100%;

    min-height:42px;

    padding:10px 12px;

    border:0;
    border-bottom:1px solid #eee;

    background:#fff;

    color:#777;

    font-family:inherit;
    font-size:.82rem;
    font-weight:500;

    text-align:left;

    cursor:pointer;

    transition:.15s;
}

.category:last-child{
    border-bottom:0;
}

.category:hover{
    background:#fafafa;
    color:#222;
}

.category.active{
    background:#f8fcff;

    color:#222;

    font-weight:600;
}

.category.active::before{
    content:"";

    display:inline-block;

    width:4px;
    height:4px;

    margin-right:7px;

    vertical-align:middle;

    border-radius:50%;

    background:#89CFF0;
}


/* =========================
   검색 + 정렬
========================= */

.search-area{
    display:flex;

    gap:8px;

    margin-bottom:16px;
}

.search-area input{
    width:100%;
    min-width:0;

    padding:10px 11px;

    border:1px solid #ddd;
    border-radius:9px;

    background:#fff;

    color:#222;

    font-family:inherit;
    font-size:.8rem;

    outline:none;

    transition:.2s;
}

.search-area input:focus{
    border-color:#b9dff0;
}

.search-area input::placeholder{
    color:#aaa;
}


/* =========================
   정렬
========================= */

.sort-area{
    display:flex;

    justify-content:flex-end;

    margin-top:-6px;
    margin-bottom:12px;
}

.sort-select{
    padding:8px 10px;

    border:1px solid #ddd;
    border-radius:8px;

    background:#fff;

    color:#666;

    font-family:inherit;
    font-size:.72rem;

    outline:none;

    cursor:pointer;
}


/* =========================
   콘텐츠 영역
========================= */

.content-area{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:10px;
}


/* =========================
   콘텐츠 카드
========================= */

.content-card{
    display:block;

    overflow:hidden;

    min-height:120px;

    background:#fff;

    border-radius:13px;

    text-decoration:none;
    color:#222;

    box-shadow:
        0 2px 7px rgba(0,0,0,.05);

    transition:
        transform .15s ease,
        box-shadow .15s ease;
}

.content-card:active{
    transform:scale(.98);
}

.content-card-inner{
    padding:14px;
}


/* =========================
   카테고리 표시
========================= */

.content-category{
    margin-bottom:7px;

    color:#89CFF0;

    font-size:.64rem;
    font-weight:600;
}

.content-title{
    margin-bottom:7px;

    font-size:.8rem;
    font-weight:600;

    line-height:1.4;

    word-break:keep-all;
}

.content-date{
    color:#999;

    font-size:.68rem;
    line-height:1.4;
}


/* =========================
   준비 중
========================= */

.empty{
    grid-column:1 / -1;

    padding:45px 10px;

    color:#999;

    font-size:.8rem;

    text-align:center;
}


/* =========================
   모바일
========================= */

@media(max-width:360px){

    .content-inner{
        padding-left:12px;
        padding-right:12px;
    }

    .content-area{
        gap:8px;
    }

    .content-card-inner{
        padding:12px;
    }

    .content-title{
        font-size:.76rem;
    }

    .content-category{
        font-size:.6rem;
    }

    .content-date{
        font-size:.64rem;
    }

    .sort-select{
        font-size:.68rem;
    }

}
</style>
</head>


<body>

<main class="content">

    <div class="content-inner">


        <!-- =========================
             제목
        ========================= -->

        <div class="main-title">

            <h1>
                라디오
            </h1>

        </div>


        <!-- =========================
             카테고리
        ========================= -->

        <div
            class="category-list"
            id="categoryList"
        >

            <!-- JavaScript에서 자동 생성 -->

        </div>


        <!-- =========================
             검색
        ========================= -->

        <div class="search-area">

            <input
                type="text"
                id="titleSearch"
                placeholder="제목 검색"
            >

            <input
                type="text"
                id="dateSearch"
                placeholder="날짜 검색"
            >

        </div>


        <!-- =========================
             정렬
        ========================= -->

        <div class="sort-area">

            <select
                id="sortSelect"
                class="sort-select"
            >

                <option value="latest">
                    최신순
                </option>

                <option value="oldest">
                    오래된순
                </option>

            </select>

        </div>


        <!-- =========================
             콘텐츠 영역
        ========================= -->

        <div
            class="content-area"
            id="contentArea"
        >

            <div class="empty">
                라디오 콘텐츠를 불러오는 중입니다.
            </div>

        </div>


    </div>

</main>


<script>

/* =========================
   설정
========================= */

const JSON_URL = "radio.json";


/* =========================
   데이터
========================= */

let radioData = [];

let currentCategory = "전체";

let currentSort = "latest";


/* =========================
   요소
========================= */

const categoryList =
    document.getElementById("categoryList");

const contentArea =
    document.getElementById("contentArea");

const titleSearch =
    document.getElementById("titleSearch");

const dateSearch =
    document.getElementById("dateSearch");

const sortSelect =
    document.getElementById("sortSelect");


/* =========================
   JSON 불러오기
========================= */

async function loadRadioData(){

    try{

        const response =
            await fetch(JSON_URL);

        if(!response.ok){
            throw new Error(
                "radio.json을 불러올 수 없습니다."
            );
        }

        radioData =
            await response.json();


        /* =========================
           날짜 기준 최신순 정렬
        ========================= */

        radioData.sort((a,b) => {

            return new Date(b.date) -
                   new Date(a.date);

        });


        createCategories();

        renderContents();

    }catch(error){

        console.error(error);

        contentArea.innerHTML = `
            <div class="empty">
                라디오 콘텐츠를 불러오지 못했습니다.
            </div>
        `;

    }

}


/* =========================
   카테고리 생성
========================= */

function createCategories(){

    categoryList.innerHTML = "";


    /* 전체 */

    const allButton =
        document.createElement("button");

    allButton.type = "button";

    allButton.className =
        "category active";

    allButton.textContent =
        "전체";

    allButton.addEventListener(
        "click",
        () => {

            currentCategory = "전체";

            updateCategoryButtons(
                allButton
            );

            renderContents();

        }
    );

    categoryList.appendChild(
        allButton
    );


    /* =========================
       JSON의 category 추출
    ========================= */

    const categories =
        [...new Set(
            radioData
                .map(item => item.category)
                .filter(category => category)
        )];


    categories.forEach(category => {

        const button =
            document.createElement("button");

        button.type = "button";

        button.className =
            "category";

        button.textContent =
            category;


        button.addEventListener(
            "click",
            () => {

                currentCategory =
                    category;

                updateCategoryButtons(
                    button
                );

                renderContents();

            }
        );


        categoryList.appendChild(
            button
        );

    });

}


/* =========================
   카테고리 활성화
========================= */

function updateCategoryButtons(
    activeButton
){

    const buttons =
        categoryList.querySelectorAll(
            ".category"
        );

    buttons.forEach(button => {

        button.classList.remove(
            "active"
        );

    });

    activeButton.classList.add(
        "active"
    );

}


/* =========================
   콘텐츠 렌더링
========================= */

function renderContents(){

    let filtered =
        [...radioData];


    /* =========================
       카테고리 필터
    ========================= */

    if(currentCategory !== "전체"){

        filtered =
            filtered.filter(item =>
                item.category ===
                currentCategory
            );

    }


    /* =========================
       제목 검색
    ========================= */

    const titleKeyword =
        titleSearch.value
            .trim()
            .toLowerCase();


    if(titleKeyword){

        filtered =
            filtered.filter(item =>
                (item.title || "")
                    .toLowerCase()
                    .includes(titleKeyword)
            );

    }


    /* =========================
       날짜 검색
    ========================= */

    const dateKeyword =
        dateSearch.value
            .trim();


    if(dateKeyword){

        filtered =
            filtered.filter(item =>
                (item.date || "")
                    .includes(dateKeyword)
            );

    }


    /* =========================
       정렬
    ========================= */

    filtered.sort((a,b) => {

        const dateA =
            new Date(a.date);

        const dateB =
            new Date(b.date);


        if(currentSort === "latest"){

            return dateB - dateA;

        }else{

            return dateA - dateB;

        }

    });


    /* =========================
       데이터 없음
    ========================= */

    if(filtered.length === 0){

        contentArea.innerHTML = `
            <div class="empty">
                해당하는 라디오 콘텐츠가 없습니다.
            </div>
        `;

        return;

    }


    /* =========================
       카드 생성
    ========================= */

    contentArea.innerHTML = "";


    filtered.forEach(item => {

        const card =
            document.createElement("a");


        card.className =
            "content-card";


        /*
           유튜브 영상 연결
        */

        if(item.videoId){

            card.href =
                "https://www.youtube.com/watch?v=" +
                item.videoId;

            card.target = "_blank";

            card.rel =
                "noopener noreferrer";

        }else{

            card.href = "#";

            card.addEventListener(
                "click",
                event => {
                    event.preventDefault();
                }
            );

        }


        card.innerHTML = `

            <div class="content-card-inner">

                <div class="content-category">
                    ${escapeHTML(item.category || "")}
                </div>

                <div class="content-title">
                    ${escapeHTML(item.title || "제목 없음")}
                </div>

                <div class="content-date">
                    ${escapeHTML(item.date || "")}
                </div>

            </div>

        `;


        contentArea.appendChild(
            card
        );

    });

}


/* =========================
   HTML 특수문자 처리
========================= */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   검색 이벤트
========================= */

titleSearch.addEventListener(
    "input",
    renderContents
);

dateSearch.addEventListener(
    "input",
    renderContents
);


/* =========================
   정렬 이벤트
========================= */

sortSelect.addEventListener(
    "change",
    () => {

        currentSort =
            sortSelect.value;

        renderContents();

    }
);


/* =========================
   실행
========================= */

loadRadioData();

</script>

</body>
</html>
