<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Chase 응원법 | H2HCHIVE</title>

<style>
body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#f5f6f8;
    color:#222;
}

.container{
    max-width:420px;
    margin:0 auto;
    padding:24px 16px 60px;
}

.back-btn{
    display:inline-block;
    text-decoration:none;
    color:#222;
    font-size:1.5rem;
    margin-bottom:20px;
}

.title{
    font-size:2rem;
    font-weight:700;
    margin-bottom:24px;
}

/* 응원법 영상 */
.cheer-video{
    width:100%;
    aspect-ratio:16 / 9;
    background:#000;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.cheer-video iframe{
    width:100%;
    height:100%;
    border:0;
    display:block;
}

/* 가이드 토글 */
.guide-toggle{
    width:100%;
    margin-top:20px;
    padding:16px 18px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    background:#fff;
    border:0;
    border-radius:14px;

    box-shadow:0 4px 12px rgba(0,0,0,.08);

    color:#222;
    font-family:inherit;
    font-size:1rem;
    font-weight:600;

    cursor:pointer;
    text-align:left;
}

.guide-toggle:active{
    opacity:.7;
}

.guide-arrow{
    color:#999;
    font-size:1rem;
    transition:transform .25s ease;
}

/* 가이드 영역 */
.guide-content{
    display:none;
    margin-top:16px;
}

.guide-content.open{
    display:block;
}

.cheer-image{
    width:100%;
    border-radius:18px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
    display:block;
}
</style>
</head>

<body>

<div class="container">

    <a href="cheer.html" class="back-btn">←</a>

    <div class="title">The Chase</div>

    <!-- 응원법 영상 -->
    <div class="cheer-video">
        <iframe
            src="https://www.youtube.com/embed/3ycS2cJvAN4"
            title="The Chase 응원법 영상"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
        </iframe>
    </div>

    <!-- 응원법 가이드 펼치기 -->
    <button
        type="button"
        class="guide-toggle"
        id="guide-toggle"
        onclick="toggleGuide()"
    >
        <span id="guide-text">응원법 가이드 펼치기</span>
        <span class="guide-arrow" id="guide-arrow">⌄</span>
    </button>

    <!-- 응원법 가이드 이미지 -->
    <div class="guide-content" id="guide-content">

        <img
            src="더체이스 응원법.jpg"
            alt="The Chase 응원법 가이드"
            class="cheer-image"
        >

    </div>

</div>

<script>
function toggleGuide(){

    const content = document.getElementById("guide-content");
    const text = document.getElementById("guide-text");
    const arrow = document.getElementById("guide-arrow");

    const isOpen = content.classList.toggle("open");

    if(isOpen){
        text.textContent = "응원법 가이드 닫기";
        arrow.textContent = "⌃";
    }else{
        text.textContent = "응원법 가이드 펼치기";
        arrow.textContent = "⌄";
    }
}
</script>

</body>
</html>
