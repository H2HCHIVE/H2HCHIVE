
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>자체 콘텐츠 | H2HCHIVE</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    min-height:100%;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#f5f6f8;
    color:#222;
}


/* =========================
   콘텐츠
========================= */

.content{
    width:100%;
    min-height:100vh;
}

.content-inner{
    width:100%;
    max-width:900px;

    margin:0 auto;

    padding:24px 16px 60px;
}


/* =========================
   상단 제목
========================= */

.main-title{
    margin-bottom:14px;

    padding-bottom:10px;

    border-bottom:1px solid #ddd;
}

.main-title h1{
    display:inline-block;

    position:relative;

    margin:0;

    padding:0 0 10px;

    font-size:1.1rem;
    font-weight:700;
}

.main-title h1::after{
    content:"";

    position:absolute;

    left:0;
    right:0;
    bottom:-11px;

    height:2px;

    background:#89CFF0;
}


/* =========================
   카테고리
========================= */

.category-list{
    display:flex;
    flex-direction:column;

    max-height:126px;

    overflow-y:auto;

    margin-bottom:14px;

    border:1px solid #e1e1e1;
    border-radius:10px;

    background:#fff;

    scrollbar-width:thin;
    scrollbar-color:#d5d5d5 transparent;
}

.category-list::-webkit-scrollbar{
    width:4px;
}

.category-list::-webkit-scrollbar-track{
    background:transparent;
}

.category-list::-webkit-scrollbar-thumb{
    background:#d5d5d5;
    border-radius:999px;
}


/* =========================
   카테고리 버튼
========================= */

.category{
    flex-shrink:0;

    width:100%;

    min-height:42px;

    padding:10px 12px;

    border:0;
    border-bottom:1px solid #eee;

    background:#fff;

    color:#777;

    font-family:inherit;
    font-size:.82rem;
    font-weight:500;

    text-align:left;

    cursor:pointer;

    transition:.15s;
}

.category:last-child{
    border-bottom:0;
}

.category:hover{
    background:#fafafa;
    color:#222;
}

.category.active{
    background:#f8fcff;

    color:#222;

    font-weight:600;
}

.category.active::before{
    content:"";

    display:inline-block;

    width:4px;
    height:4px;

    margin-right:7px;

    vertical-align:middle;

    border-radius:50%;

    background:#89CFF0;
}


/* =========================
   검색
========================= */

.search-area{
    display:flex;

    gap:8px;

    margin-bottom:16px;
}

.search-area input{
    width:100%;
    min-width:0;

    padding:10px 11px;

    border:1px solid #ddd;
    border-radius:9px;

    background:#fff;

    color:#222;

    font-family:inherit;
    font-size:.8rem;

    outline:none;

    transition:.2s;
}

.search-area input:focus{
    border-color:#b9dff0;
}

.search-area input::placeholder{
    color:#aaa;
}


/* =========================
   영상 그리드
========================= */

.video-grid{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:10px;
}


/* =========================
   영상 카드
========================= */

.video-card{
    display:block;

    overflow:hidden;

    background:#fff;

    border-radius:13px;

    text-decoration:none;
    color:#222;

    box-shadow:
        0 2px 7px rgba(0,0,0,.05);

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.video-card:hover{
    transform:translateY(-2px);

    box-shadow:
        0 5px 14px rgba(0,0,0,.08);
}

.video-thumbnail{
    width:100%;

    aspect-ratio:16 / 9;

    display:block;

    object-fit:cover;

    background:#eee;
}

.video-info{
    padding:9px 10px 11px;
}

.video-title{
    margin-bottom:4px;

    font-size:.8rem;
    font-weight:600;

    line-height:1.35;

    display:-webkit-box;
    -webkit-box-orient:vertical;
    -webkit-line-clamp:2;

    overflow:hidden;
}

.video-date{
    color:#999;

    font-size:.7rem;
}


/* =========================
   빈 결과
========================= */

.empty{
    grid-column:1 / -1;

    padding:45px 10px;

    color:#999;

    font-size:.8rem;

    text-align:center;
}


/* =========================
   모바일
========================= */

@media(max-width:360px){

    .content-inner{
        padding-left:12px;
        padding-right:12px;
    }

    .video-grid{
        gap:8px;
    }

    .video-info{
        padding:8px 9px 10px;
    }

    .video-title{
        font-size:.76rem;
    }

}
</style>
</head>


<body>


<main class="content">

    <div class="content-inner">


        <!-- =========================
             제목
        ========================= -->

        <div class="main-title">

            <h1>
                자체 콘텐츠
            </h1>

        </div>


        <!-- =========================
             카테고리
        ========================= -->

        <div class="category-list">

            <button
                type="button"
                class="category active"
            >
                전체
            </button>

            <button
                type="button"
                class="category"
            >
                S2cret Diary
            </button>

            <button
                type="button"
                class="category"
            >
                Crunchy Hearts
            </button>

            <button
                type="button"
                class="category"
            >
                Performances & Choreography
            </button>

            <button
                type="button"
                class="category"
            >
                Production BH2ND
            </button>

            <button
                type="button"
                class="category"
            >
                Hearts Chase
            </button>

            <button
                type="button"
                class="category"
            >
                Daily BH2ND
            </button>

            <button
                type="button"
                class="category"
            >
                2025 Holiday Vlogs
            </button>

            <button
                type="button"
                class="category"
            >
                2026 Holiday Vlog
            </button>

            <button
                type="button"
                class="category"
            >
                둘셋하투하
            </button>

        </div>


        <!-- =========================
             검색
        ========================= -->

        <div class="search-area">

            <input
                type="text"
                id="titleSearch"
                placeholder="제목 검색"
            >

            <input
                type="text"
                id="dateSearch"
                placeholder="날짜 검색"
            >

        </div>


        <!-- =========================
             영상
        ========================= -->

        <div
            class="video-grid"
            id="videoGrid"
        >

            <div class="empty">
                등록된 콘텐츠가 없습니다.
            </div>

        </div>

    </div>

</main>


<script>


/* =========================
   영상 데이터
========================= */

const videos = [

    /*
    {
        title: "영상 제목",
        date: "2026-09-16",
        category: "Production BH2ND",
        videoId: "유튜브영상ID"
    }
    */

];


const categoryButtons =
    document.querySelectorAll(".category");

const titleSearch =
    document.getElementById("titleSearch");

const dateSearch =
    document.getElementById("dateSearch");

const videoGrid =
    document.getElementById("videoGrid");


let currentCategory =
    "전체";


/* =========================
   영상 출력
========================= */

function render(){

    const titleKeyword =
        titleSearch.value
            .trim()
            .toLowerCase();


    const dateKeyword =
        dateSearch.value
            .trim()
            .replace(/-/g,"");


    const filtered =
        videos.filter(video => {

            const categoryMatch =
                currentCategory === "전체" ||
                video.category === currentCategory;


            const titleMatch =
                !titleKeyword ||
                (video.title || "")
                    .toLowerCase()
                    .includes(titleKeyword);


            const videoDate =
                (video.date || "")
                    .replace(/-/g,"");


            const dateMatch =
                !dateKeyword ||
                videoDate.includes(dateKeyword);


            return (
                categoryMatch &&
                titleMatch &&
                dateMatch
            );

        });


    /* -------------------------
       결과 없음
    ------------------------- */

    if(filtered.length === 0){

        videoGrid.innerHTML = `
            <div class="empty">
                등록된 콘텐츠가 없습니다.
            </div>
        `;

        return;
    }


    /* -------------------------
       영상 출력
    ------------------------- */

    videoGrid.innerHTML =
        filtered.map(video => `

            <a
                class="video-card"
                href="https://www.youtube.com/watch?v=${video.videoId}"
                target="_blank"
                rel="noopener noreferrer"
            >

                <img
                    class="video-thumbnail"
                    src="https://img.youtube.com/vi/${video.videoId}/hqdefault.jpg"
                    alt=""
                    loading="lazy"
                >

                <div class="video-info">

                    <div class="video-title">
                        ${video.title}
                    </div>

                    <div class="video-date">
                        ${video.date || ""}
                    </div>

                </div>

            </a>

        `).join("");

}


/* =========================
   카테고리
========================= */

categoryButtons.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            categoryButtons.forEach(item => {

                item.classList.remove(
                    "active"
                );

            });


            button.classList.add(
                "active"
            );


            currentCategory =
                button.textContent.trim();


            render();

        }
    );

});


/* =========================
   제목 검색
========================= */

titleSearch.addEventListener(
    "input",
    render
);


/* =========================
   날짜 검색
========================= */

dateSearch.addEventListener(
    "input",
    render
);


/* =========================
   시작
========================= */

render();

</script>


</body>
</html>
