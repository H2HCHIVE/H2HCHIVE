<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>H2HCHIVE 음방 직캠</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f7f7f7;
    color:#111;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}


/* =========================
   HEADER
========================= */

.header{
    position:sticky;
    top:0;
    background:#fff;
    border-bottom:1px solid #e5e5e5;
    padding:20px;
    text-align:center;
    z-index:100;
}

.header h1{
    font-size:24px;
    font-weight:700;
    letter-spacing:1px;
}


/* =========================
   FILTER
========================= */

.filter-bar{
    margin-top:16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
}


/* =========================
   TYPE BUTTON
========================= */

.type-buttons{
    width:100%;
    display:flex;
    justify-content:center;
    gap:8px;
}

.type-buttons button{
    flex:1;
    max-width:120px;
    padding:9px 12px;
    border:1px solid #ddd;
    background:#fff;
    border-radius:999px;
    font-size:13px;
    cursor:pointer;
    transition:.2s;
}

.type-buttons button.active{
    background:#111;
    color:#fff;
    border-color:#111;
}


/* =========================
   SUB FILTER
========================= */

.sub-filter{
    width:100%;
    display:none;
    background:#fafafa;
    border:1px solid #e5e5e5;
    border-radius:14px;
    overflow:hidden;
    text-align:left;
}

.sub-filter-title{
    padding:12px 14px;
    font-size:12px;
    color:#888;
    border-bottom:1px solid #e5e5e5;
}

.sub-filter-list{
    display:flex;
    flex-direction:column;
}

.sub-filter-list button{
    width:100%;
    padding:12px 14px;
    border:0;
    border-bottom:1px solid #eee;
    background:#fff;
    color:#222;
    font-family:inherit;
    font-size:13px;
    text-align:left;
    cursor:pointer;
    transition:.2s;
}

.sub-filter-list button:last-child{
    border-bottom:0;
}

.sub-filter-list button.active{
    background:#f1f1f1;
    font-weight:600;
}

.sub-filter-list button:active{
    opacity:.6;
}


/* =========================
   DATE SEARCH
========================= */

#dateSearch{
    width:180px;
    padding:10px 14px;
    border:1px solid #ddd;
    border-radius:999px;
    font-size:13px;
    outline:none;
    transition:.2s;
}

#dateSearch:focus{
    border-color:#111;
    width:220px;
}


/* =========================
   GUIDE TEXT
========================= */

.filter-guide{
    display:block;
    font-size:12px;
    color:#999;
}


/* =========================
   VIDEO GRID
========================= */

.archive-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
    padding:20px;
    max-width:1200px;
    margin:0 auto;
}


/* =========================
   VIDEO CARD
========================= */

.archive-card{
    display:block;
    text-decoration:none;
    color:inherit;
    background:#fff;
    border-radius:18px;
    overflow:hidden;
    border:1px solid #e5e5e5;
    transition:.2s;
}

.archive-card:hover{
    transform:translateY(-2px);
}

.archive-thumb{
    width:100%;
    aspect-ratio:16/9;
    object-fit:cover;
    display:block;
}

.archive-content{
    padding:12px;
}

.archive-title{
    font-size:14px;
    font-weight:600;
    line-height:1.4;
    margin-bottom:8px;

    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.archive-date{
    font-size:12px;
    color:#777;
}


/* =========================
   EMPTY MESSAGE
========================= */

.empty-message{
    padding:60px 20px;
    text-align:center;
    color:#999;
    font-size:13px;
}


/* =========================
   MOBILE
========================= */

@media (max-width:600px){

    .archive-grid{
        gap:10px;
        padding:10px;
    }

    .archive-content{
        padding:10px;
    }

    .archive-title{
        font-size:13px;
    }

    .archive-date{
        font-size:11px;
    }

}
</style>
</head>


<body>


<header class="header">

    <h1>📺음방 직캠</h1>


    <div class="filter-bar">


        <!-- =========================
             직캠 종류
        ========================= -->

        <div class="type-buttons">

            <button
                id="typeAll"
                onclick="showType('all')"
            >
                전체
            </button>

            <button
                id="typeGroup"
                onclick="showType('group')"
            >
                그룹 직캠
            </button>

            <button
                id="typeMember"
                onclick="showType('member')"
            >
                멤버 직캠
            </button>

        </div>


        <!-- =========================
             그룹 → 앨범
        ========================= -->

        <div
            id="albumFilters"
            class="sub-filter"
        >

            <div class="sub-filter-title">
                앨범 선택
            </div>

            <div class="sub-filter-list">

                <button onclick="showAlbum('The Chase')">
                    The Chase
                </button>

                <button onclick="showAlbum('STYLE')">
                    STYLE
                </button>

                <button onclick="showAlbum('Pretty Please')">
                    Pretty Please
                </button>

                <button onclick="showAlbum('FOCUS')">
                    FOCUS
                </button>

                <button onclick="showAlbum('RUDE')">
                    RUDE
                </button>

                <button onclick="showAlbum('Lemon Tang')">
                    Lemon Tang
                </button>

                <button onclick="showAlbum('15-LOVE')">
                    15-LOVE
                </button>

            </div>

        </div>


        <!-- =========================
             멤버 → 멤버
        ========================= -->

        <div
            id="memberFilters"
            class="sub-filter"
        >

            <div class="sub-filter-title">
                멤버 선택
            </div>

            <div class="sub-filter-list">

                <button onclick="showMember('지우')">
                    지우
                </button>

                <button onclick="showMember('카르멘')">
                    카르멘
                </button>

                <button onclick="showMember('유하')">
                    유하
                </button>

                <button onclick="showMember('스텔라')">
                    스텔라
                </button>

                <button onclick="showMember('주은')">
                    주은
                </button>

                <button onclick="showMember('에이나')">
                    에이나
                </button>

                <button onclick="showMember('이안')">
                    이안
                </button>

                <button onclick="showMember('예온')">
                    예온
                </button>

            </div>

        </div>


        <!-- =========================
             날짜 검색
        ========================= -->

        <input
            id="dateSearch"
            placeholder="예: 250224"
            oninput="searchByDate()"
        >


        <div
            id="filterGuide"
            class="filter-guide"
        >
            원하는 직캠 종류를 선택해주세요.
        </div>

    </div>

</header>



<!-- =========================
     영상 목록
========================= -->

<div
    id="archiveGrid"
    class="archive-grid"
></div>



<script>


/* =========================
   상태값
========================= */

let allVideos = [];

let currentType = "all";

let currentAlbum = "all";

let currentMember = "all";

let currentDate = "";



/* =========================
   영상 출력
========================= */

function renderVideos(videos){

    const grid =
        document.getElementById("archiveGrid");


    grid.innerHTML = "";


    if(videos.length === 0){

        grid.innerHTML = `
            <div class="empty-message">
                선택한 조건에 해당하는 직캠이 없습니다.
            </div>
        `;

        return;

    }


    videos.forEach(video => {

        const card =
            document.createElement("a");


        card.className =
            "archive-card";


        card.href =
            `https://www.youtube.com/watch?v=${video.videoId}`;


        card.target = "_blank";


        card.rel = "noopener noreferrer";


        card.innerHTML = `

            <img
                class="archive-thumb"
                src="https://img.youtube.com/vi/${video.videoId}/hqdefault.jpg"
                alt="${video.title}"
                loading="lazy"
            >


            <div class="archive-content">

                <div class="archive-title">
                    ${video.title}
                </div>


                <div class="archive-date">
                    ${video.date}
                </div>

            </div>

        `;


        grid.appendChild(card);

    });

}



/* =========================
   필터 적용
========================= */

function applyFilters(){

    let filtered =
        allVideos;


    /* -------------------------
       전체
    ------------------------- */

    if(currentType === "all"){

        /*
           전체에서는
           날짜 검색만 적용
        */

    }


    /* -------------------------
       그룹 직캠
    ------------------------- */

    if(currentType === "group"){

        filtered =
            filtered.filter(
                video => !video.member
            );


        /*
           앨범이 선택된 경우
           해당 앨범만 표시
        */

        if(currentAlbum !== "all"){

            filtered =
                filtered.filter(
                    video =>
                        video.album === currentAlbum
                );

        }

    }


    /* -------------------------
       멤버 직캠
    ------------------------- */

    if(currentType === "member"){

        filtered =
            filtered.filter(
                video => video.member
            );


        /*
           멤버가 선택된 경우
           해당 멤버만 표시
        */

        if(currentMember !== "all"){

            filtered =
                filtered.filter(
                    video =>
                        video.member === currentMember
                );

        }

    }


    /* -------------------------
       날짜
    ------------------------- */

    if(currentDate !== ""){

        filtered =
            filtered.filter(video => {

                /*
                   2026-08-30
                   ↓
                   260830
                */

                const compactDate =
                    video.date
                        .replaceAll("-", "")
                        .slice(2);


                return compactDate.includes(
                    currentDate
                );

            });

    }


    /*
       그룹/멤버를 선택했지만
       세부 항목을 아직 선택하지 않았다면
       영상은 보여주지 않음
    */

    if(
        currentType === "group" &&
        currentAlbum === "all"
    ){

        renderVideos([]);

        return;

    }


    if(
        currentType === "member" &&
        currentMember === "all"
    ){

        renderVideos([]);

        return;

    }


    renderVideos(filtered);

}



/* =========================
   버튼 활성화
========================= */

function updateTypeButtons(){

    document
        .getElementById("typeAll")
        .classList.toggle(
            "active",
            currentType === "all"
        );


    document
        .getElementById("typeGroup")
        .classList.toggle(
            "active",
            currentType === "group"
        );


    document
        .getElementById("typeMember")
        .classList.toggle(
            "active",
            currentType === "member"
        );

}



/* =========================
   서브 필터 표시
========================= */

function updateFilterVisibility(){

    const albumFilters =
        document.getElementById(
            "albumFilters"
        );

    const memberFilters =
        document.getElementById(
            "memberFilters"
        );

    const filterGuide =
        document.getElementById(
            "filterGuide"
        );


    /*
       전체
    */

    if(currentType === "all"){

        albumFilters.style.display =
            "none";

        memberFilters.style.display =
            "none";

        filterGuide.textContent =
            "전체 직캠";

        return;

    }


    /*
       그룹 직캠
    */

    if(currentType === "group"){

        albumFilters.style.display =
            "block";

        memberFilters.style.display =
            "none";

        filterGuide.textContent =
            currentAlbum === "all"
                ? "앨범을 선택해주세요."
                : `${currentAlbum} 그룹 직캠`;

        return;

    }


    /*
       멤버 직캠
    */

    if(currentType === "member"){

        albumFilters.style.display =
            "none";

        memberFilters.style.display =
            "block";

        filterGuide.textContent =
            currentMember === "all"
                ? "멤버를 선택해주세요."
                : `${currentMember} 직캠`;

    }

}



/* =========================
   앨범 버튼 활성화
========================= */

function updateAlbumButtons(){

    const buttons =
        document.querySelectorAll(
            "#albumFilters button"
        );


    buttons.forEach(button => {

        button.classList.toggle(
            "active",
            button.textContent.trim() === currentAlbum
        );

    });

}



/* =========================
   멤버 버튼 활성화
========================= */

function updateMemberButtons(){

    const buttons =
        document.querySelectorAll(
            "#memberFilters button"
        );


    buttons.forEach(button => {

        button.classList.toggle(
            "active",
            button.textContent.trim() === currentMember
        );

    });

}



/* =========================
   전체 상태 업데이트
========================= */

function updateUI(){

    updateTypeButtons();

    updateFilterVisibility();

    updateAlbumButtons();

    updateMemberButtons();

}



/* =========================
   직캠 종류 선택
========================= */

function showType(type){

    currentType =
        type;


    /*
       직캠 종류를 변경하면
       기존 세부 선택 초기화
    */

    currentAlbum =
        "all";

    currentMember =
        "all";


    /*
       전체 선택 시
       날짜 검색도 초기화
    */

    if(type === "all"){

        currentDate =
            "";

        document.getElementById(
            "dateSearch"
        ).value =
            "";

    }


    updateUI();

    applyFilters();

}



/* =========================
   앨범 선택
========================= */

function showAlbum(album){

    currentType =
        "group";

    currentAlbum =
        album;

    currentMember =
        "all";


    updateUI();

    applyFilters();

}



/* =========================
   멤버 선택
========================= */

function showMember(member){

    currentType =
        "member";

    currentMember =
        member;

    currentAlbum =
        "all";


    updateUI();

    applyFilters();

}



/* =========================
   날짜 검색
========================= */

function searchByDate(){

    currentDate =
        document
            .getElementById("dateSearch")
            .value
            .trim();


    applyFilters();

}



/* =========================
   video.json 불러오기
========================= */

async function loadVideos(){

    try{

        const response =
            await fetch("video.json");


        allVideos =
            await response.json();


        updateUI();

        applyFilters();

    }

    catch(error){

        console.error(
            "video.json 불러오기 실패:",
            error
        );

    }

}



/* =========================
   시작
========================= */

loadVideos();


</script>


</body>
</html>
