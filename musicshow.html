<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>H2HCHIVE 음방 직캠</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f5f6f8;
    color:#222;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}


/* =========================
   HEADER
========================= */

.header{
    position:sticky;
    top:0;
    background:rgba(255,255,255,.96);
    border-bottom:1px solid #e9e9e9;
    padding:22px 16px 18px;
    z-index:100;

    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
}

.header-inner{
    max-width:720px;
    margin:0 auto;
}

.header h1{
    font-size:21px;
    font-weight:700;
    letter-spacing:-.5px;
    margin-bottom:18px;
}


/* =========================
   직캠 종류
========================= */

.type-filter{
    display:flex;
    gap:22px;
    border-bottom:1px solid #e5e5e5;
}

.type-button{
    position:relative;

    padding:0 1px 11px;

    border:0;
    background:none;

    color:#999;

    font-family:inherit;
    font-size:13px;
    font-weight:500;

    cursor:pointer;
}

.type-button.active{
    color:#222;
    font-weight:700;
}

.type-button.active::after{
    content:"";

    position:absolute;
    left:0;
    right:0;
    bottom:-1px;

    height:2px;

    background:#222;
}


/* =========================
   세부 필터 영역
========================= */

.sub-filter{
    display:none;

    margin-top:14px;

    border:1px solid #e8e8e8;
    border-radius:12px;

    background:#fafafa;

    overflow:hidden;
}

.sub-filter.show{
    display:block;
}


/* =========================
   세부 필터 스크롤
========================= */

.sub-filter-list{
    max-height:126px;

    overflow-y:auto;

    scrollbar-width:thin;
    scrollbar-color:#d5d5d5 transparent;
}

.sub-filter-list::-webkit-scrollbar{
    width:4px;
}

.sub-filter-list::-webkit-scrollbar-track{
    background:transparent;
}

.sub-filter-list::-webkit-scrollbar-thumb{
    background:#d5d5d5;
    border-radius:999px;
}


/* =========================
   세부 필터 항목
========================= */

.sub-filter-button{
    width:100%;

    display:flex;
    align-items:center;

    min-height:42px;

    padding:0 14px;

    border:0;
    border-bottom:1px solid #ededed;

    background:#fff;

    color:#777;

    font-family:inherit;
    font-size:13px;
    font-weight:500;

    text-align:left;

    cursor:pointer;

    transition:.15s;
}

.sub-filter-button:last-child{
    border-bottom:0;
}

.sub-filter-button:hover{
    background:#fafafa;
    color:#222;
}

.sub-filter-button.active{
    background:#f8fcff;
    color:#222;
    font-weight:700;
}

.sub-filter-button.active::before{
    content:"";

    width:4px;
    height:4px;

    margin-right:8px;

    border-radius:50%;

    background:#89CFF0;
}


/* =========================
   날짜 검색
========================= */

.date-search-wrap{
    margin-top:12px;
}

#dateSearch{
    width:100%;

    padding:11px 14px;

    border:1px solid #e3e3e3;
    border-radius:10px;

    background:#fff;

    color:#222;

    font-family:inherit;
    font-size:12px;

    outline:none;

    transition:.2s;
}

#dateSearch::placeholder{
    color:#aaa;
}

#dateSearch:focus{
    border-color:#bbb;
}


/* =========================
   VIDEO GRID
========================= */

.archive-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);

    gap:14px;

    padding:18px 16px 50px;

    max-width:1200px;
    margin:0 auto;
}


/* =========================
   VIDEO CARD
========================= */

.archive-card{
    display:block;

    text-decoration:none;
    color:inherit;

    background:#fff;

    border-radius:16px;

    overflow:hidden;

    box-shadow:0 2px 10px rgba(0,0,0,.045);

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.archive-card:hover{
    transform:translateY(-2px);

    box-shadow:0 5px 16px rgba(0,0,0,.08);
}

.archive-thumb{
    width:100%;
    aspect-ratio:16/9;

    object-fit:cover;

    display:block;

    background:#eee;
}

.archive-content{
    padding:11px 12px 12px;
}

.archive-title{
    font-size:13px;
    font-weight:600;
    line-height:1.4;

    margin-bottom:6px;

    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;

    overflow:hidden;
}

.archive-date{
    font-size:11px;
    color:#999;
}


/* =========================
   결과 없음
========================= */

.empty-message{
    grid-column:1 / -1;

    padding:70px 20px;

    text-align:center;

    color:#999;
    font-size:13px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .header{
        padding:20px 14px 16px;
    }

    .header h1{
        font-size:20px;
    }

    .type-filter{
        gap:20px;
    }

    .archive-grid{
        gap:10px;
        padding:14px 10px 40px;
    }

    .archive-content{
        padding:9px 10px 10px;
    }

    .archive-title{
        font-size:12px;
    }

    .archive-date{
        font-size:10px;
    }

}


/* =========================
   VERY SMALL
========================= */

@media(max-width:360px){

    .header{
        padding-left:12px;
        padding-right:12px;
    }

    .type-filter{
        gap:16px;
    }

    .type-button{
        font-size:12px;
    }

    .sub-filter-list{
        max-height:126px;
    }

}
</style>
</head>


<body>


<header class="header">

    <div class="header-inner">

        <h1>음방 직캠</h1>


        <!-- =========================
             직캠 종류
        ========================= -->

        <div class="type-filter">

            <button
                type="button"
                class="type-button active"
                data-type="all"
                onclick="showType('all')"
            >
                전체
            </button>

            <button
                type="button"
                class="type-button"
                data-type="group"
                onclick="showType('group')"
            >
                그룹 직캠
            </button>

            <button
                type="button"
                class="type-button"
                data-type="member"
                onclick="showType('member')"
            >
                멤버 직캠
            </button>

        </div>


        <!-- =========================
             그룹 → 앨범
        ========================= -->

        <div
            id="albumFilters"
            class="sub-filter"
        >

            <div class="sub-filter-list">

                <button
                    type="button"
                    class="sub-filter-button"
                    data-album="The Chase"
                    onclick="showAlbum('The Chase')"
                >
                    The Chase
                </button>

                <button
                    type="button"
                    class="sub-filter-button"
                    data-album="STYLE"
                    onclick="showAlbum('STYLE')"
                >
                    STYLE
                </button>

                <button
                    type="button"
                    class="sub-filter-button"
                    data-album="Pretty Please"
                    onclick="showAlbum('Pretty Please')"
                >
                    Pretty Please
                </button>

                <button
                    type="button"
                    class="sub-filter-button"
                    data-album="FOCUS"
                    onclick="showAlbum('FOCUS')"
                >
                    FOCUS
                </button>

                <button
                    type="button"
                    class="sub-filter-button"
                    data-album="RUDE"
                    onclick="showAlbum('RUDE')"
                >
                    RUDE!
                </button>

                <button
                    type="button"
                    class="sub-filter-button"
                    data-album="Lemon Tang"
                    onclick="showAlbum('Lemon Tang')"
                >
                    Lemon Tang
                </button>

                <button
                    type="button"
                    class="sub-filter-button"
                    data-album="15-LOVE"
                    onclick="showAlbum('15-LOVE')"
                >
                    15-LOVE
                </button>

            </div>

        </div>


        <!-- =========================
             멤버 → 멤버
        ========================= -->

        <div
            id="memberFilters"
            class="sub-filter"
        >

            <div class="sub-filter-list">

                <button
                    type="button"
                    class="sub-filter-button"
                    data-member="지우"
                    onclick="showMember('지우')"
                >
                    지우
                </button>

                <button
                    type="button"
                    class="sub-filter-button"
                    data-member="카르멘"
                    onclick="showMember('카르멘')"
                >
                    카르멘
                </button>

                <button
                    type="button"
                    class="sub-filter-button"
                    data-member="유하"
                    onclick="showMember('유하')"
                >
                    유하
                </button>

                <button
                    type="button"
                    class="sub-filter-button"
                    data-member="스텔라"
                    onclick="showMember('스텔라')"
                >
                    스텔라
                </button>

                <button
                    type="button"
                    class="sub-filter-button"
                    data-member="주은"
                    onclick="showMember('주은')"
                >
                    주은
                </button>

                <button
                    type="button"
                    class="sub-filter-button"
                    data-member="에이나"
                    onclick="showMember('에이나')"
                >
                    에이나
                </button>

                <button
                    type="button"
                    class="sub-filter-button"
                    data-member="이안"
                    onclick="showMember('이안')"
                >
                    이안
                </button>

                <button
                    type="button"
                    class="sub-filter-button"
                    data-member="예온"
                    onclick="showMember('예온')"
                >
                    예온
                </button>

            </div>

        </div>


        <!-- =========================
             날짜 검색
        ========================= -->

        <div class="date-search-wrap">

            <input
                id="dateSearch"
                type="text"
                placeholder="날짜 검색  ·  예: 250224"
                oninput="searchByDate()"
            >

        </div>

    </div>

</header>



<!-- =========================
     영상 목록
========================= -->

<div
    id="archiveGrid"
    class="archive-grid"
></div>



<script>


/* =========================
   상태값
========================= */

let allVideos = [];

let currentType = "all";

let currentAlbum = "all";

let currentMember = "all";

let currentDate = "";



/* =========================
   영상 출력
========================= */

function renderVideos(videos){

    const grid =
        document.getElementById("archiveGrid");

    grid.innerHTML = "";


    if(videos.length === 0){

        grid.innerHTML = `
            <div class="empty-message">
                해당하는 직캠이 없습니다.
            </div>
        `;

        return;
    }


    videos.forEach(video => {

        const card =
            document.createElement("a");


        card.className =
            "archive-card";


        card.href =
            `https://www.youtube.com/watch?v=${video.videoId}`;


        card.target = "_blank";

        card.rel = "noopener noreferrer";


        card.innerHTML = `

            <img
                class="archive-thumb"
                src="https://img.youtube.com/vi/${video.videoId}/hqdefault.jpg"
                alt="${video.title}"
                loading="lazy"
            >

            <div class="archive-content">

                <div class="archive-title">
                    ${video.title}
                </div>

                <div class="archive-date">
                    ${video.date}
                </div>

            </div>

        `;


        grid.appendChild(card);

    });

}



/* =========================
   필터 적용
========================= */

function applyFilters(){

    let filtered =
        allVideos;


    /* -------------------------
       직캠 종류
    ------------------------- */

    if(currentType === "group"){

        filtered =
            filtered.filter(
                video => !video.member
            );

    }


    if(currentType === "member"){

        filtered =
            filtered.filter(
                video => video.member
            );

    }


    /* -------------------------
       앨범
    ------------------------- */

    if(currentAlbum !== "all"){

        filtered =
            filtered.filter(
                video =>
                    video.album === currentAlbum
            );

    }


    /* -------------------------
       멤버
    ------------------------- */

    if(currentMember !== "all"){

        filtered =
            filtered.filter(
                video =>
                    video.member === currentMember
            );

    }


    /* -------------------------
       날짜
    ------------------------- */

    if(currentDate !== ""){

        filtered =
            filtered.filter(video => {

                const compactDate =
                    video.date
                        .replaceAll("-", "")
                        .slice(2);

                return compactDate.includes(
                    currentDate
                );

            });

    }


    renderVideos(filtered);

}



/* =========================
   상단 직캠 종류 버튼 상태
========================= */

function updateTypeButtons(){

    document
        .querySelectorAll(".type-button")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.type === currentType
            );

        });

}



/* =========================
   세부 필터 표시
========================= */

function updateFilterVisibility(){

    const albumFilters =
        document.getElementById(
            "albumFilters"
        );

    const memberFilters =
        document.getElementById(
            "memberFilters"
        );


    /*
       그룹 직캠
       → 앨범 목록 표시
    */

    albumFilters.classList.toggle(
        "show",
        currentType === "group"
    );


    /*
       멤버 직캠
       → 멤버 목록 표시
    */

    memberFilters.classList.toggle(
        "show",
        currentType === "member"
    );

}



/* =========================
   앨범 선택 상태
========================= */

function updateAlbumButtons(){

    document
        .querySelectorAll(
            "#albumFilters .sub-filter-button"
        )
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.album === currentAlbum
            );

        });

}



/* =========================
   멤버 선택 상태
========================= */

function updateMemberButtons(){

    document
        .querySelectorAll(
            "#memberFilters .sub-filter-button"
        )
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.member === currentMember
            );

        });

}



/* =========================
   직캠 종류 선택
========================= */

function showType(type){

    currentType =
        type;


    /*
       종류 변경 시
       기존 세부 필터 초기화
    */

    currentAlbum =
        "all";

    currentMember =
        "all";


    updateTypeButtons();

    updateFilterVisibility();

    updateAlbumButtons();

    updateMemberButtons();

    applyFilters();

}



/* =========================
   앨범 선택
========================= */

function showAlbum(album){

    currentType =
        "group";

    currentAlbum =
        album;

    currentMember =
        "all";


    updateTypeButtons();

    updateFilterVisibility();

    updateAlbumButtons();

    updateMemberButtons();

    applyFilters();

}



/* =========================
   멤버 선택
========================= */

function showMember(member){

    currentType =
        "member";

    currentMember =
        member;

    currentAlbum =
        "all";


    updateTypeButtons();

    updateFilterVisibility();

    updateAlbumButtons();

    updateMemberButtons();

    applyFilters();

}



/* =========================
   날짜 검색
========================= */

function searchByDate(){

    currentDate =
        document
            .getElementById("dateSearch")
            .value
            .trim();

    applyFilters();

}



/* =========================
   video.json 불러오기
========================= */

async function loadVideos(){

    try{

        const response =
            await fetch("video.json");


        if(!response.ok){

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        allVideos =
            await response.json();


        applyFilters();

    }

    catch(error){

        console.error(
            "video.json 불러오기 실패:",
            error
        );


        document.getElementById(
            "archiveGrid"
        ).innerHTML = `
            <div class="empty-message">
                영상을 불러오지 못했습니다.
            </div>
        `;

    }

}



/* =========================
   시작
========================= */

loadVideos();

</script>


</body>
</html>
