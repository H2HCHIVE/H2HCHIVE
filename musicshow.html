<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>음방 직캠 | H2HCHIVE</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    min-height:100%;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#f5f6f8;
    color:#222;
}


/* =========================
   콘텐츠
========================= */

.content{
    width:100%;
    min-height:100vh;
}

.content-inner{
    width:100%;
    max-width:900px;

    margin:0 auto;

    padding:24px 16px 60px;
}


/* =========================
   상단 제목
========================= */

.main-title{
    margin-bottom:14px;

    padding-bottom:10px;

    border-bottom:1px solid #ddd;
}

.main-title h1{
    display:inline-block;

    position:relative;

    margin:0;

    padding:0 0 10px;

    font-size:1.1rem;
    font-weight:700;
}

.main-title h1::after{
    content:"";

    position:absolute;

    left:0;
    right:0;
    bottom:-11px;

    height:2px;

    background:#89CFF0;
}


/* =========================
   직캠 종류
========================= */

.category-list{
    display:flex;
    flex-direction:column;

    max-height:126px;

    overflow-y:auto;

    margin-bottom:14px;

    border:1px solid #e1e1e1;
    border-radius:10px;

    background:#fff;

    scrollbar-width:thin;
    scrollbar-color:#d5d5d5 transparent;
}

.category-list::-webkit-scrollbar{
    width:4px;
}

.category-list::-webkit-scrollbar-track{
    background:transparent;
}

.category-list::-webkit-scrollbar-thumb{
    background:#d5d5d5;
    border-radius:999px;
}


/* =========================
   카테고리 버튼
========================= */

.category{
    flex-shrink:0;

    width:100%;

    padding:10px 12px;

    border:0;
    border-bottom:1px solid #eee;

    background:none;

    color:#777;

    font-family:inherit;
    font-size:.82rem;
    font-weight:500;

    text-align:left;

    cursor:pointer;
}

.category:last-child{
    border-bottom:0;
}

.category:hover{
    background:#fafafa;
}

.category.active{
    color:#222;
    font-weight:600;
}

.category.active::before{
    content:"";

    display:inline-block;

    width:4px;
    height:4px;

    margin-right:7px;

    vertical-align:middle;

    border-radius:50%;

    background:#89CFF0;
}


/* =========================
   세부 카테고리
========================= */

.sub-category-list{
    display:none;

    flex-direction:column;

    max-height:126px;

    overflow-y:auto;

    margin-bottom:14px;

    border:1px solid #e1e1e1;
    border-radius:10px;

    background:#fff;

    scrollbar-width:thin;
    scrollbar-color:#d5d5d5 transparent;
}

.sub-category-list.show{
    display:flex;
}

.sub-category-list::-webkit-scrollbar{
    width:4px;
}

.sub-category-list::-webkit-scrollbar-track{
    background:transparent;
}

.sub-category-list::-webkit-scrollbar-thumb{
    background:#d5d5d5;
    border-radius:999px;
}


/* =========================
   세부 카테고리 버튼
========================= */

.sub-category-button{
    flex-shrink:0;

    width:100%;

    padding:10px 12px;

    border:0;
    border-bottom:1px solid #eee;

    background:none;

    color:#777;

    font-family:inherit;
    font-size:.82rem;
    font-weight:500;

    text-align:left;

    cursor:pointer;
}

.sub-category-button:last-child{
    border-bottom:0;
}

.sub-category-button:hover{
    background:#fafafa;
}

.sub-category-button.active{
    color:#222;
    font-weight:600;
}

.sub-category-button.active::before{
    content:"";

    display:inline-block;

    width:4px;
    height:4px;

    margin-right:7px;

    vertical-align:middle;

    border-radius:50%;

    background:#89CFF0;
}


/* =========================
   검색
========================= */

.control-area{
    display:flex;

    gap:8px;

    margin-bottom:16px;
}

.search-area{
    display:flex;

    flex:1;

    gap:8px;

    min-width:0;
}

.search-input{
    width:100%;
    min-width:0;

    padding:10px 11px;

    border:1px solid #ddd;
    border-radius:9px;

    background:#fff;

    color:#222;

    font-family:inherit;
    font-size:.8rem;

    outline:none;
}

.search-input:focus{
    border-color:#b9dff0;
}

.search-input::placeholder{
    color:#aaa;
}


/* =========================
   정렬
========================= */

.sort-select{
    flex-shrink:0;

    padding:10px 10px;

    border:1px solid #ddd;
    border-radius:9px;

    background:#fff;

    color:#555;

    font-family:inherit;
    font-size:.75rem;

    outline:none;

    cursor:pointer;
}


/* =========================
   영상 그리드
========================= */

.video-area{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:10px;
}


/* =========================
   영상 카드
========================= */

.video-card{
    display:block;

    overflow:hidden;

    background:#fff;

    border-radius:13px;

    text-decoration:none;
    color:#222;

    box-shadow:
        0 2px 7px rgba(0,0,0,.05);

    transition:.15s;
}

.video-card:hover{
    transform:translateY(-1px);

    box-shadow:
        0 4px 10px rgba(0,0,0,.07);
}


/* =========================
   썸네일
========================= */

.thumbnail{
    position:relative;

    width:100%;

    aspect-ratio:16 / 9;

    overflow:hidden;

    background:#eee;
}

.thumbnail img{
    display:block;

    width:100%;
    height:100%;

    object-fit:cover;
}


/* =========================
   영상 정보
========================= */

.video-info{
    padding:12px 13px 13px;
}

.video-title{
    margin-bottom:5px;

    font-size:.78rem;
    font-weight:600;

    line-height:1.4;

    display:-webkit-box;

    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;

    overflow:hidden;
}

.video-date{
    color:#999;

    font-size:.68rem;
}


/* =========================
   빈 결과
========================= */

.empty{
    grid-column:1 / -1;

    padding:45px 10px;

    color:#999;

    font-size:.8rem;

    text-align:center;
}


/* =========================
   모바일
========================= */

@media(max-width:600px){

    .control-area{
        flex-direction:column;
    }

    .search-area{
        width:100%;
    }

    .sort-select{
        width:100%;
    }

}


/* =========================
   작은 화면
========================= */

@media(max-width:360px){

    .content-inner{
        padding-left:12px;
        padding-right:12px;
    }

    .category-list,
    .sub-category-list{
        max-height:240px;
    }

    .video-area{
        gap:8px;
    }

    .video-info{
        padding:11px 12px 12px;
    }

    .video-title{
        font-size:.74rem;
    }

}
</style>
</head>


<body>


<main class="content">

    <div class="content-inner">


        <!-- =========================
             제목
        ========================= -->

        <div class="main-title">

            <h1>
                음방 직캠
            </h1>

        </div>


        <!-- =========================
             직캠 종류
        ========================= -->

        <div class="category-list">

            <button
                type="button"
                class="category active"
                data-type="all"
                onclick="showType('all')"
            >
                전체
            </button>

            <button
                type="button"
                class="category"
                data-type="group"
                onclick="showType('group')"
            >
                그룹 직캠
            </button>

            <button
                type="button"
                class="category"
                data-type="member"
                onclick="showType('member')"
            >
                멤버 직캠
            </button>

        </div>


        <!-- =========================
             그룹 → 앨범
        ========================= -->

        <div
            id="albumFilters"
            class="sub-category-list"
        >

            <button
                type="button"
                class="sub-category-button"
                data-album="The Chase"
                onclick="showAlbum('The Chase')"
            >
                The Chase
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-album="STYLE"
                onclick="showAlbum('STYLE')"
            >
                STYLE
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-album="Pretty Please"
                onclick="showAlbum('Pretty Please')"
            >
                Pretty Please
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-album="FOCUS"
                onclick="showAlbum('FOCUS')"
            >
                FOCUS
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-album="RUDE"
                onclick="showAlbum('RUDE')
            >
                RUDE!
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-album="Lemon Tang"
                onclick="showAlbum('Lemon Tang')"
            >
                Lemon Tang
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-album="15-LOVE"
                onclick="showAlbum('15-LOVE')"
            >
                15-LOVE
            </button>

        </div>


        <!-- =========================
             멤버
        ========================= -->

        <div
            id="memberFilters"
            class="sub-category-list"
        >

            <button
                type="button"
                class="sub-category-button"
                data-member="지우"
                onclick="showMember('지우')"
            >
                지우
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-member="카르멘"
                onclick="showMember('카르멘')"
            >
                카르멘
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-member="유하"
                onclick="showMember('유하')"
            >
                유하
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-member="스텔라"
                onclick="showMember('스텔라')"
            >
                스텔라
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-member="주은"
                onclick="showMember('주은')"
            >
                주은
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-member="에이나"
                onclick="showMember('에이나')"
            >
                에이나
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-member="이안"
                onclick="showMember('이안')"
            >
                이안
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-member="예온"
                onclick="showMember('예온')"
            >
                예온
            </button>

        </div>


        <!-- =========================
             검색 + 정렬
        ========================= -->

        <div class="control-area">

            <div class="search-area">

                <input
                    id="titleSearch"
                    class="search-input"
                    type="text"
                    placeholder="제목 검색"
                    oninput="applyFilters()"
                >

                <input
                    id="dateSearch"
                    class="search-input"
                    type="text"
                    placeholder="날짜 검색"
                    oninput="applyFilters()"
                >

            </div>


            <select
                id="sortSelect"
                class="sort-select"
                onchange="applyFilters()"
            >

                <option value="newest">
                    최신순
                </option>

                <option value="oldest">
                    오래된순
                </option>

            </select>

        </div>


        <!-- =========================
             영상
        ========================= -->

        <div
            class="video-area"
            id="videoArea"
        >

            <div class="empty">
                영상을 불러오는 중입니다.
            </div>

        </div>


    </div>

</main>


<script>


/* =========================
   상태값
========================= */

let allVideos = [];

let currentType = "all";

let currentAlbum = "all";

let currentMember = "all";



/* =========================
   HTML 이스케이프
========================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}



/* =========================
   영상 출력
========================= */

function renderVideos(videos){

    const area =
        document.getElementById("videoArea");

    area.innerHTML = "";


    if(videos.length === 0){

        area.innerHTML = `
            <div class="empty">
                해당하는 직캠이 없습니다.
            </div>
        `;

        return;
    }


    videos.forEach(video => {

        const videoId =
            String(
                video.videoId ||
                video.id ||
                ""
            ).trim();


        const title =
            escapeHtml(video.title);


        const date =
            escapeHtml(video.date);


        if(!videoId){

            return;
        }


        const card =
            document.createElement("a");


        card.className =
            "video-card";


        card.href =
            `https://www.youtube.com/watch?v=${encodeURIComponent(videoId)}`;


        card.target =
            "_blank";


        card.rel =
            "noopener noreferrer";


        card.innerHTML = `

            <div class="thumbnail">

                <img
                    src="https://img.youtube.com/vi/${encodeURIComponent(videoId)}/hqdefault.jpg"
                    alt="${title}"
                    loading="lazy"
                >

            </div>

            <div class="video-info">

                <div class="video-title">
                    ${title}
                </div>

                <div class="video-date">
                    ${date}
                </div>

            </div>

        `;


        area.appendChild(card);

    });

}



/* =========================
   필터 적용
========================= */

function applyFilters(){

    let filtered =
        [...allVideos];


    /* -------------------------
       종류
    ------------------------- */

    if(currentType === "group"){

        filtered =
            filtered.filter(
                video => !video.member
            );

    }


    if(currentType === "member"){

        filtered =
            filtered.filter(
                video => !!video.member
            );

    }


    /* -------------------------
       앨범
    ------------------------- */

    if(currentAlbum !== "all"){

        filtered =
            filtered.filter(
                video =>
                    video.album === currentAlbum
            );

    }


    /* -------------------------
       멤버
    ------------------------- */

    if(currentMember !== "all"){

        filtered =
            filtered.filter(
                video =>
                    video.member === currentMember
            );

    }


    /* -------------------------
       제목 검색
    ------------------------- */

    const titleSearch =
        document
            .getElementById("titleSearch")
            .value
            .trim()
            .toLowerCase();


    if(titleSearch !== ""){

        filtered =
            filtered.filter(video =>
                String(video.title || "")
                    .toLowerCase()
                    .includes(titleSearch)
            );

    }


    /* -------------------------
       날짜 검색
    ------------------------- */

    const dateSearch =
        document
            .getElementById("dateSearch")
            .value
            .trim()
            .replace(/-/g,"");


    if(dateSearch !== ""){

        filtered =
            filtered.filter(video => {

                const compactDate =
                    String(video.date || "")
                        .replace(/-/g,"");

                return compactDate.includes(
                    dateSearch
                );

            });

    }


    /* -------------------------
       정렬
    ------------------------- */

    const sort =
        document
            .getElementById("sortSelect")
            .value;


    filtered.sort((a,b) => {

        const dateA =
            String(a.date || "");

        const dateB =
            String(b.date || "");


        if(sort === "oldest"){

            return dateA.localeCompare(
                dateB
            );

        }


        return dateB.localeCompare(
            dateA
        );

    });


    renderVideos(filtered);

}



/* =========================
   종류 버튼 상태
========================= */

function updateTypeButtons(){

    document
        .querySelectorAll(".category")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.type === currentType
            );

        });

}



/* =========================
   세부 필터 표시
========================= */

function updateFilterVisibility(){

    const albumFilters =
        document.getElementById(
            "albumFilters"
        );

    const memberFilters =
        document.getElementById(
            "memberFilters"
        );


    albumFilters.classList.toggle(
        "show",
        currentType === "group"
    );


    memberFilters.classList.toggle(
        "show",
        currentType === "member"
    );

}



/* =========================
   앨범 버튼 상태
========================= */

function updateAlbumButtons(){

    document
        .querySelectorAll(
            "#albumFilters .sub-category-button"
        )
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.album === currentAlbum
            );

        });

}



/* =========================
   멤버 버튼 상태
========================= */

function updateMemberButtons(){

    document
        .querySelectorAll(
            "#memberFilters .sub-category-button"
        )
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.member === currentMember
            );

        });

}



/* =========================
   직캠 종류 선택
========================= */

function showType(type){

    currentType =
        type;


    currentAlbum =
        "all";


    currentMember =
        "all";


    updateTypeButtons();

    updateFilterVisibility();

    updateAlbumButtons();

    updateMemberButtons();

    applyFilters();

}



/* =========================
   앨범 선택
========================= */

function showAlbum(album){

    currentType =
        "group";


    currentAlbum =
        album;


    currentMember =
        "all";


    updateTypeButtons();

    updateFilterVisibility();

    updateAlbumButtons();

    updateMemberButtons();

    applyFilters();

}



/* =========================
   멤버 선택
========================= */

function showMember(member){

    currentType =
        "member";


    currentMember =
        member;


    currentAlbum =
        "all";


    updateTypeButtons();

    updateFilterVisibility();

    updateAlbumButtons();

    updateMemberButtons();

    applyFilters();

}



/* =========================
   video.json 불러오기
========================= */

async function loadVideos(){

    try{

        const response =
            await fetch("video.json");


        if(!response.ok){

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const data =
            await response.json();


        if(!Array.isArray(data)){

            throw new Error(
                "video.json은 배열 형식이어야 합니다."
            );

        }


        allVideos =
            data;


        applyFilters();

    }

    catch(error){

        console.error(
            "video.json 불러오기 실패:",
            error
        );


        document.getElementById(
            "videoArea"
        ).innerHTML = `
            <div class="empty">
                영상을 불러오지 못했습니다.
            </div>
        `;

    }

}



/* =========================
   시작
========================= */

loadVideos();

</script>


</body>
</html>
