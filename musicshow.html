<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>음악방송 | H2HCHIVE</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    min-height:100%;
}

body{
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:#f5f6f8;
    color:#222;
}


/* ==========================================
   전체 컨테이너
========================================== */

.container{

    width:100%;
    max-width:420px;

    margin:0 auto;

    padding:16px 12px 30px;
}


/* ==========================================
   상단 제목
========================================== */

.page-title{

    margin:4px 4px 16px;

    font-size:22px;
    font-weight:800;

    letter-spacing:-0.5px;
}


/* ==========================================
   필터 영역
========================================== */

.filter-card{

    background:#fff;

    border-radius:18px;

    padding:14px;

    margin-bottom:14px;

    box-shadow:
        0 3px 12px rgba(0,0,0,0.05);
}


/* ==========================================
   필터 제목
========================================== */

.filter-title{

    margin:0 0 9px;

    font-size:13px;

    font-weight:700;

    color:#777;
}


/* ==========================================
   버튼 영역
========================================== */

.button-list{

    display:flex;

    flex-wrap:wrap;

    gap:7px;
}


/* ==========================================
   필터 버튼
========================================== */

.sub-category-button{

    border:0;

    background:#f1f2f5;

    color:#555;

    border-radius:10px;

    padding:8px 11px;

    font-size:12px;

    font-weight:600;

    cursor:pointer;

    transition:
        background 0.15s ease,
        color 0.15s ease,
        transform 0.1s ease;
}

.sub-category-button:active{
    transform:scale(0.96);
}

.sub-category-button.active{

    background:#89CFF0;

    color:#fff;

}


/* ==========================================
   멤버 버튼
========================================== */

.member-list{

    display:flex;

    flex-wrap:wrap;

    gap:7px;
}


/* ==========================================
   날짜 검색
========================================== */

.date-search{

    display:flex;

    gap:7px;

    align-items:center;
}

.date-search input{

    flex:1;

    min-width:0;

    height:38px;

    border:1px solid #e5e6e9;

    border-radius:10px;

    padding:0 11px;

    font-size:13px;

    outline:none;

    background:#fafafa;
}

.date-search input:focus{

    border-color:#89CFF0;

    background:#fff;
}

.date-search button{

    height:38px;

    border:0;

    border-radius:10px;

    padding:0 13px;

    background:#89CFF0;

    color:#fff;

    font-size:12px;

    font-weight:700;

    cursor:pointer;
}


/* ==========================================
   영상 개수 / 정렬
========================================== */

.result-row{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin:5px 4px 11px;
}

.result-count{

    font-size:12px;

    color:#888;

    font-weight:600;
}


/* ==========================================
   영상 그리드
========================================== */

.video-grid{

    display:grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap:10px;
}


/* ==========================================
   영상 카드
========================================== */

.video-card{

    display:block;

    overflow:hidden;

    background:#fff;

    border-radius:16px;

    text-decoration:none;

    color:#222;

    box-shadow:
        0 3px 12px rgba(0,0,0,0.05);

    transition:
        transform 0.15s ease;
}

.video-card:active{

    transform:scale(0.98);
}


/* ==========================================
   썸네일
========================================== */

.thumbnail-wrap{

    position:relative;

    width:100%;

    aspect-ratio:16 / 9;

    background:#eee;

    overflow:hidden;
}

.video-thumbnail{

    width:100%;

    height:100%;

    display:block;

    object-fit:cover;
}


/* ==========================================
   영상 정보
========================================== */

.video-info{

    padding:10px 10px 11px;
}

.video-title{

    margin:0 0 6px;

    font-size:12px;

    font-weight:700;

    line-height:1.4;

    color:#222;

    display:-webkit-box;

    -webkit-line-clamp:2;

    -webkit-box-orient:vertical;

    overflow:hidden;
}

.video-meta{

    margin:0;

    font-size:10px;

    line-height:1.45;

    color:#999;
}


/* ==========================================
   빈 결과
========================================== */

.empty{

    grid-column:1 / -1;

    padding:40px 10px;

    text-align:center;

    color:#999;

    font-size:13px;

    background:#fff;

    border-radius:16px;
}


/* ==========================================
   모바일
========================================== */

@media(max-width:360px){

    .container{
        padding-left:10px;
        padding-right:10px;
    }

    .video-grid{
        gap:8px;
    }

    .video-info{
        padding:9px;
    }

}

</style>

</head>


<body>


<div class="container">


    <!-- =====================================
         제목
    ====================================== -->

    <h1 class="page-title">
        음악방송
    </h1>


    <!-- =====================================
         타입
    ====================================== -->

    <div class="filter-card">

        <p class="filter-title">
            구분
        </p>

        <div class="button-list">

            <button
                type="button"
                class="sub-category-button active"
                data-type="all"
                onclick="showType('all')"
            >
                전체
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-type="group"
                onclick="showType('group')"
            >
                그룹 직캠
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-type="member"
                onclick="showType('member')"
            >
                멤버 직캠
            </button>

        </div>

    </div>


    <!-- =====================================
         앨범
    ====================================== -->

    <div class="filter-card">

        <p class="filter-title">
            앨범
        </p>

        <div class="button-list">

            <button
                type="button"
                class="sub-category-button active"
                data-album="all"
                onclick="showAlbum('all')"
            >
                전체
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-album="The Chase"
                onclick="showAlbum('The Chase')"
            >
                The Chase
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-album="STYLE"
                onclick="showAlbum('STYLE')"
            >
                STYLE
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-album="Pretty Please"
                onclick="showAlbum('Pretty Please')"
            >
                Pretty Please
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-album="FOCUS"
                onclick="showAlbum('FOCUS')"
            >
                FOCUS
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-album="RUDE"
                onclick="showAlbum('RUDE')"
            >
                RUDE!
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-album="Lemon Tang"
                onclick="showAlbum('Lemon Tang')"
            >
                Lemon Tang
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-album="15-LOVE"
                onclick="showAlbum('15-LOVE')"
            >
                15-LOVE
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-album="기타"
                onclick="showAlbum('기타')"
            >
                기타
            </button>

        </div>

    </div>


    <!-- =====================================
         멤버
    ====================================== -->

    <div class="filter-card">

        <p class="filter-title">
            멤버
        </p>

        <div class="member-list">

            <button
                type="button"
                class="sub-category-button active"
                data-member="all"
                onclick="showMember('all')"
            >
                전체
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-member="지우"
                onclick="showMember('지우')"
            >
                지우
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-member="카르멘"
                onclick="showMember('카르멘')"
            >
                카르멘
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-member="유하"
                onclick="showMember('유하')"
            >
                유하
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-member="스텔라"
                onclick="showMember('스텔라')"
            >
                스텔라
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-member="주은"
                onclick="showMember('주은')"
            >
                주은
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-member="에이나"
                onclick="showMember('에이나')"
            >
                에이나
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-member="이안"
                onclick="showMember('이안')"
            >
                이안
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-member="연"
                onclick="showMember('연')"
            >
                연
            </button>

        </div>

    </div>


    <!-- =====================================
         날짜 검색
    ====================================== -->

    <div class="filter-card">

        <p class="filter-title">
            날짜 검색
        </p>

        <div class="date-search">

            <input
                type="text"
                id="dateInput"
                placeholder="예: 2609"
                maxlength="6"
                inputmode="numeric"
            >

            <button
                type="button"
                onclick="searchByDate()"
            >
                검색
            </button>

        </div>

    </div>


    <!-- =====================================
         결과
    ====================================== -->

    <div class="result-row">

        <div
            class="result-count"
            id="resultCount"
        >
            영상 0개
        </div>

    </div>


    <!-- =====================================
         영상
    ====================================== -->

    <div
        class="video-grid"
        id="videoGrid"
    >

        <div class="empty">
            영상을 불러오는 중입니다.
        </div>

    </div>


</div>


<script>


/* ==========================================
   전역 데이터
========================================== */

let allVideos = [];

let currentType = "all";

let currentAlbum = "all";

let currentMember = "all";

let currentDate = "";


/* ==========================================
   HTML escape
========================================== */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ==========================================
   영상 출력
========================================== */

function renderVideos(videos){

    const grid =
        document.getElementById("videoGrid");

    const count =
        document.getElementById("resultCount");


    count.textContent =
        `영상 ${videos.length}개`;


    if(!videos.length){

        grid.innerHTML = `
            <div class="empty">
                해당 조건의 영상이 없습니다.
            </div>
        `;

        return;
    }


    grid.innerHTML = "";


    videos.forEach(video => {

        const card =
            document.createElement("a");


        card.className =
            "video-card";


        card.href =
            `https://www.youtube.com/watch?v=${encodeURIComponent(
                video.videoId
            )}`;


        card.target = "_blank";

        card.rel =
            "noopener noreferrer";


        const title =
            escapeHtml(video.title);


        const broadcaster =
            escapeHtml(video.broadcaster);


        const program =
            escapeHtml(video.program);


        const date =
            escapeHtml(video.date);


        const type =
            escapeHtml(video.type);


        card.innerHTML = `

            <div class="thumbnail-wrap">

                <img
                    class="video-thumbnail"
                    src="https://img.youtube.com/vi/${encodeURIComponent(video.videoId)}/hqdefault.jpg"
                    alt="${title}"
                    loading="lazy"
                >

            </div>


            <div class="video-info">

                <p class="video-title">
                    ${title}
                </p>

                <p class="video-meta">
                    ${date}
                    ${broadcaster ? ` · ${broadcaster}` : ""}
                    ${program ? ` · ${program}` : ""}
                </p>

                ${
                    type
                    ? `
                        <p class="video-meta">
                            ${type}
                        </p>
                    `
                    : ""
                }

            </div>

        `;


        grid.appendChild(card);

    });

}


/* ==========================================
   필터 적용
========================================== */

function applyFilters(){

    let filtered =
        [...allVideos];


    /* ------------------------------
       타입
    ------------------------------ */

    if(currentType === "group"){

        filtered =
            filtered.filter(video =>
                !video.member
            );

    }


    if(currentType === "member"){

        filtered =
            filtered.filter(video =>
                video.member
            );

    }


    /* ------------------------------
       앨범
    ------------------------------ */

    if(currentAlbum !== "all"){

        filtered =
            filtered.filter(video =>
                video.album === currentAlbum
            );

    }


    /* ------------------------------
       멤버
    ------------------------------ */

    if(currentMember !== "all"){

        filtered =
            filtered.filter(video =>
                video.member === currentMember
            );

    }


    /* ------------------------------
       날짜
    ------------------------------ */

    if(currentDate !== ""){

        filtered =
            filtered.filter(video => {

                const compactDate =
                    String(video.date || "")
                        .replaceAll("-", "")
                        .slice(2);

                return compactDate
                    .includes(currentDate);

            });

    }


    renderVideos(filtered);

}


/* ==========================================
   타입 선택
========================================== */

function showType(type){

    currentType = type;

    currentAlbum = "all";

    currentMember = "all";

    currentDate = "";


    document
        .getElementById("dateInput")
        .value = "";


    document
        .querySelectorAll("[data-type]")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.type === type
            );

        });


    document
        .querySelectorAll("[data-album]")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.album === "all"
            );

        });


    document
        .querySelectorAll("[data-member]")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.member === "all"
            );

        });


    applyFilters();

}


/* ==========================================
   앨범 선택
========================================== */

function showAlbum(album){

    currentAlbum = album;

    currentType = "group";

    currentMember = "all";

    currentDate = "";


    document
        .getElementById("dateInput")
        .value = "";


    document
        .querySelectorAll("[data-album]")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.album === album
            );

        });


    document
        .querySelectorAll("[data-type]")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.type === "group"
            );

        });


    document
        .querySelectorAll("[data-member]")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.member === "all"
            );

        });


    applyFilters();

}


/* ==========================================
   멤버 선택
========================================== */

function showMember(member){

    currentMember = member;

    currentAlbum = "all";

    currentDate = "";


    document
        .getElementById("dateInput")
        .value = "";


    if(member === "all"){

        currentType = "all";

    }else{

        currentType = "member";

    }


    document
        .querySelectorAll("[data-member]")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.member === member
            );

        });


    document
        .querySelectorAll("[data-album]")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.album === "all"
            );

        });


    document
        .querySelectorAll("[data-type]")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.type === currentType
            );

        });


    applyFilters();

}


/* ==========================================
   날짜 검색
========================================== */

function searchByDate(){

    const input =
        document
            .getElementById("dateInput")
            .value
            .trim();


    currentDate =
        input.replace(/\D/g, "");


    currentType = "all";

    currentAlbum = "all";

    currentMember = "all";


    document
        .querySelectorAll("[data-type]")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.type === "all"
            );

        });


    document
        .querySelectorAll("[data-album]")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.album === "all"
            );

        });


    document
        .querySelectorAll("[data-member]")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.member === "all"
            );

        });


    applyFilters();

}


/* ==========================================
   엔터키 날짜 검색
========================================== */

document
    .getElementById("dateInput")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                searchByDate();

            }

        }
    );


/* ==========================================
   JSON 로딩
========================================== */

async function loadVideos(){

    try{

        /*
         * ------------------------------------
         * musicshow.json
         * ------------------------------------
         */

        const musicshowResponse =
            await fetch(
                "./musicshow.json?ver=" + Date.now(),
                {
                    cache:"no-store"
                }
            );


        if(!musicshowResponse.ok){

            throw new Error(
                `musicshow.json HTTP ${musicshowResponse.status}`
            );

        }


        const musicshowText =
            await musicshowResponse.text();


        let musicshowVideos;


        try{

            musicshowVideos =
                JSON.parse(musicshowText);

        }catch(error){

            console.error(
                "musicshow.json 원문:",
                musicshowText
            );

            throw new Error(
                "musicshow.json JSON 파싱 실패: " +
                error.message
            );

        }


        /*
         * ------------------------------------
         * etc.json
         * ------------------------------------
         */

        const etcResponse =
            await fetch(
                "./etc.json?ver=" + Date.now(),
                {
                    cache:"no-store"
                }
            );


        if(!etcResponse.ok){

            throw new Error(
                `etc.json HTTP ${etcResponse.status}`
            );

        }


        const etcText =
            await etcResponse.text();


        let etcVideos;


        try{

            etcVideos =
                JSON.parse(etcText);

        }catch(error){

            console.error(
                "etc.json 원문:",
                etcText
            );

            throw new Error(
                "etc.json JSON 파싱 실패: " +
                error.message
            );

        }


        /*
         * ------------------------------------
         * 배열 검사
         * ------------------------------------
         */

        if(!Array.isArray(musicshowVideos)){

            throw new Error(
                "musicshow.json의 최상위 구조가 배열이 아닙니다."
            );

        }


        if(!Array.isArray(etcVideos)){

            throw new Error(
                "etc.json의 최상위 구조가 배열이 아닙니다."
            );

        }


        /*
         * ------------------------------------
         * 두 JSON 합치기
         * ------------------------------------
         */

        allVideos = [

            ...musicshowVideos,

            ...etcVideos

        ];


        /*
         * ------------------------------------
         * 최신순 정렬
         * ------------------------------------
         */

        allVideos.sort((a,b) => {

            return String(b.date || "")
                .localeCompare(
                    String(a.date || "")
                );

        });


        /*
         * ------------------------------------
         * 화면 출력
         * ------------------------------------
         */

        applyFilters();


        console.log(
            "musicshow.json:",
            musicshowVideos.length,
            "개"
        );


        console.log(
            "etc.json:",
            etcVideos.length,
            "개"
        );


        console.log(
            "전체:",
            allVideos.length,
            "개"
        );

    }


    catch(error){

        console.error(
            "영상 데이터 로딩 실패:",
            error
        );


        document
            .getElementById("videoGrid")
            .innerHTML = `

                <div class="empty">

                    영상을 불러오지 못했습니다.<br>

                    <small style="
                        display:block;
                        margin-top:8px;
                        color:#bbb;
                        word-break:break-word;
                    ">
                        ${escapeHtml(error.message)}
                    </small>

                </div>

            `;

    }

}


/* ==========================================
   시작
========================================== */

loadVideos();


</script>


</body>

</html>
