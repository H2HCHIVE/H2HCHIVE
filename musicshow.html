<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>음악방송 | H2HCHIVE</title>

<style>
body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#f5f6f8;
    color:#222;
}

.container{
    max-width:420px;
    margin:0 auto;
    padding:18px 14px 30px;
}

/* =========================
   HEADER
========================= */

.header{
    margin-bottom:16px;
}

.header-title{
    font-size:1.25rem;
    font-weight:700;
    margin-bottom:4px;
}

.header-sub{
    color:#999;
    font-size:.7rem;
}

/* =========================
   FILTER
========================= */

.filter-card{
    background:#fff;
    border-radius:18px;
    padding:12px;
    margin-bottom:14px;
    box-shadow:0 3px 12px rgba(0,0,0,.04);
}

.filter-title{
    font-size:.72rem;
    font-weight:700;
    margin-bottom:8px;
}

.filter-list{
    display:flex;
    gap:6px;
    overflow-x:auto;
    scrollbar-width:none;
    padding-bottom:2px;
}

.filter-list::-webkit-scrollbar{
    display:none;
}

.filter-btn{
    flex:0 0 auto;
    border:0;
    background:#f1f2f4;
    color:#777;
    border-radius:999px;
    padding:7px 11px;
    font-size:.68rem;
    cursor:pointer;
}

.filter-btn.active{
    background:#89CFF0;
    color:#fff;
    font-weight:700;
}

/* =========================
   DATE SEARCH
========================= */

.search-wrap{
    margin-top:10px;
}

.search-input{
    width:100%;
    box-sizing:border-box;
    border:0;
    outline:none;
    background:#f5f6f8;
    border-radius:11px;
    padding:9px 11px;
    font-size:.7rem;
    color:#333;
}

.search-input::placeholder{
    color:#aaa;
}

/* =========================
   SORT
========================= */

.sort-wrap{
    display:flex;
    justify-content:flex-end;
    margin:10px 2px 12px;
}

.sort-btn{
    border:0;
    background:transparent;
    color:#999;
    font-size:.68rem;
    padding:3px 0;
    cursor:pointer;
}

.sort-btn.active{
    color:#70b9d8;
    font-weight:700;
}

/* =========================
   VIDEO GRID
========================= */

.video-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:11px;
}

.video-card{
    background:#fff;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 3px 12px rgba(0,0,0,.04);
    cursor:pointer;
}

.video-thumbnail{
    width:100%;
    aspect-ratio:16/9;
    object-fit:cover;
    display:block;
    background:#eee;
}

.video-info{
    padding:9px 10px 11px;
    min-width:0;
}

/* =========================
   TEXT
========================= */

/* 방송사 / 멤버 */
.video-broadcaster{
    margin-bottom:5px;
    color:#70b9d8;
    font-size:.65rem;
    font-weight:700;
    line-height:1.3;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* 앨범 / 원본 정보 */
.video-album{
    margin-bottom:4px;
    color:#777;
    font-size:.68rem;
    font-weight:400;
    line-height:1.3;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* 프로그램 / 콘텐츠 / 제목 */
.video-title{
    margin-bottom:4px;
    font-size:.8rem;
    font-weight:700;
    line-height:1.35;
    display:-webkit-box;
    -webkit-box-orient:vertical;
    -webkit-line-clamp:2;
    overflow:hidden;
}

/* 날짜 */
.video-date{
    color:#999;
    font-size:.7rem;
    font-weight:400;
}

/* =========================
   EMPTY
========================= */

.empty{
    grid-column:1 / -1;
    text-align:center;
    padding:50px 10px;
    color:#aaa;
    font-size:.75rem;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:15px;
    box-sizing:border-box;
}

.modal.active{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:420px;
    background:#fff;
    border-radius:18px;
    overflow:hidden;
    position:relative;
}

.modal-video{
    width:100%;
    aspect-ratio:16/9;
    border:0;
    display:block;
}

.modal-close{
    position:absolute;
    top:8px;
    right:8px;
    width:30px;
    height:30px;
    border:0;
    border-radius:50%;
    background:rgba(0,0,0,.6);
    color:#fff;
    font-size:17px;
    cursor:pointer;
    z-index:2;
}

.modal-info{
    padding:12px 14px 14px;
}

.modal-member{
    color:#70b9d8;
    font-size:.7rem;
    font-weight:700;
    margin-bottom:5px;
}

.modal-title{
    font-size:.9rem;
    font-weight:700;
    line-height:1.4;
}

.modal-date{
    color:#999;
    font-size:.7rem;
    margin-top:5px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="header-title">음악방송</div>
        <div class="header-sub">H2HCHIVE MUSIC SHOW ARCHIVE</div>
    </div>

    <div class="filter-card">

        <div class="filter-title">앨범</div>

        <div class="filter-list" id="albumFilters">

            <button class="filter-btn active" data-album="전체">
                전체
            </button>

            <button class="filter-btn" data-album="The Chase">
                The Chase
            </button>

            <button class="filter-btn" data-album="STYLE">
                STYLE
            </button>

            <button class="filter-btn" data-album="Pretty Please">
                Pretty Please
            </button>

            <button class="filter-btn" data-album="FOCUS">
                FOCUS
            </button>

            <button class="filter-btn" data-album="RUDE!">
                RUDE!
            </button>

            <button class="filter-btn" data-album="Lemon Tang">
                Lemon Tang
            </button>

            <button class="filter-btn" data-album="15-LOVE">
                15-LOVE
            </button>

        </div>

        <div class="filter-title" style="margin-top:12px;">
            멤버
        </div>

        <div class="filter-list" id="memberFilters">

            <button class="filter-btn active" data-member="전체">
                전체
            </button>

            <button class="filter-btn" data-member="지우">
                지우
            </button>

            <button class="filter-btn" data-member="카르멘">
                카르멘
            </button>

            <button class="filter-btn" data-member="유하">
                유하
            </button>

            <button class="filter-btn" data-member="스텔라">
                스텔라
            </button>

            <button class="filter-btn" data-member="주은">
                주은
            </button>

            <button class="filter-btn" data-member="에이나">
                에이나
            </button>

            <button class="filter-btn" data-member="이안">
                이안
            </button>

            <button class="filter-btn" data-member="예온">
                예온
            </button>

        </div>

        <div class="search-wrap">
            <input
                type="text"
                id="dateSearch"
                class="search-input"
                placeholder="날짜 검색 · 예: 250224"
            >
        </div>

    </div>

    <div class="sort-wrap">

        <button
            class="sort-btn active"
            id="latestBtn"
        >
            최신순
        </button>

        <span style="color:#ddd;font-size:.65rem;margin:0 6px;">|</span>

        <button
            class="sort-btn"
            id="oldestBtn"
        >
            오래된순
        </button>

    </div>

    <div class="video-grid" id="videoGrid"></div>

</div>


<!-- =========================
     MODAL
========================= -->

<div class="modal" id="modal">

    <div class="modal-box">

        <button
            class="modal-close"
            id="modalClose"
        >
            ×
        </button>

        <iframe
            id="modalVideo"
            class="modal-video"
            allow="autoplay; encrypted-media"
            allowfullscreen
        ></iframe>

        <div class="modal-info">

            <div
                class="modal-member"
                id="modalMember"
            ></div>

            <div
                class="modal-title"
                id="modalTitle"
            ></div>

            <div
                class="modal-date"
                id="modalDate"
            ></div>

        </div>

    </div>

</div>


<script>

/* =========================
   DATA FILES
========================= */

const DATA_FILES = {

    group: "video.json",

    members: {

        "지우": "jiwoo.json",
        "카르멘": "carmen.json",
        "유하": "yuha.json",
        "스텔라": "stella.json",
        "주은": "jueun.json",
        "에이나": "aina.json",
        "이안": "ian.json",
        "예온": "yeon.json"

    },

    etc: "etc.json"

};


/* =========================
   STATE
========================= */

let allVideos = [];

let currentAlbum = "전체";
let currentMember = "전체";
let currentSearch = "";
let currentSort = "latest";


/* =========================
   ALBUM BY DATE
========================= */

function getAlbumByDate(date){

    const groupVideo = allVideos.find(video =>
        video.dataType === "group" &&
        video.date === date
    );

    return groupVideo ? groupVideo.album : "";

}


/* =========================
   LOAD JSON
========================= */

async function loadJSON(url){

    try{

        const response = await fetch(url);

        if(!response.ok){
            throw new Error(url);
        }

        return await response.json();

    }catch(error){

        console.error("JSON 로드 실패:", url, error);

        return [];

    }

}


/* =========================
   LOAD VIDEOS
========================= */

async function loadVideos(){

    /* 그룹 데이터를 먼저 로드 */
    const groupData =
        await loadJSON(DATA_FILES.group);

    const groupVideos =
        groupData.map(video => ({

            ...video,

            dataType:"group"

        }));


    /* 앨범 자동 매칭을 위해 그룹 데이터를 먼저 저장 */
    allVideos = [
        ...groupVideos
    ];


    /* 기타 데이터 */
    const etcData =
        await loadJSON(DATA_FILES.etc);

    const etcVideos =
        etcData.map(video => ({

            ...video,

            dataType:"etc"

        }));


    /* 멤버 데이터 */
    const memberEntries =
        Object.entries(DATA_FILES.members);


    const memberData =
        await Promise.all(

            memberEntries.map(
                async ([member,file]) => {

                    const data =
                        await loadJSON(file);


                    return data.map(video => ({

                        ...video,

                        /*
                         * album이 JSON에 있으면 그대로 사용.
                         * 없으면 날짜를 기준으로 그룹 영상의
                         * album을 자동으로 가져옴.
                         */
                        album:
                            video.album ||
                            getAlbumByDate(video.date),

                        member:member,

                        dataType:"member"

                    }));

                }
            )

        );


    /* 최종 데이터 */
    allVideos = [

        ...groupVideos,

        ...memberData.flat(),

        ...etcVideos

    ];


    renderVideos();

}


/* =========================
   FILTER
========================= */

function filterVideos(){

    let filtered =
        [...allVideos];


    /* =========================
       ALBUM FILTER
    ========================= */

    if(currentAlbum !== "전체"){

        filtered =
            filtered.filter(video => {

                if(video.dataType === "member"){

                    const album =
                        video.album ||
                        getAlbumByDate(video.date);

                    return album === currentAlbum;

                }

                return video.album === currentAlbum;

            });

    }


    /* =========================
       MEMBER FILTER
    ========================= */

    if(currentMember !== "전체"){

        filtered =
            filtered.filter(video =>
                video.member === currentMember
            );

    }


    /* =========================
       DATE SEARCH
    ========================= */

    if(currentSearch){

        filtered =
            filtered.filter(video => {

                const date =
                    String(video.date || "")
                    .replaceAll("-","");

                return date.includes(
                    currentSearch
                );

            });

    }


    /* =========================
       SORT
    ========================= */

    filtered.sort((a,b) => {

        const dateA =
            new Date(
                a.date || "1900-01-01"
            );

        const dateB =
            new Date(
                b.date || "1900-01-01"
            );


        if(currentSort === "latest"){

            return dateB - dateA;

        }

        return dateA - dateB;

    });


    return filtered;

}


/* =========================
   RENDER
========================= */

function renderVideos(){

    const grid =
        document.getElementById(
            "videoGrid"
        );


    const filtered =
        filterVideos();


    grid.innerHTML = "";


    if(!filtered.length){

        grid.innerHTML = `
            <div class="empty">
                해당하는 영상이 없습니다.
            </div>
        `;

        return;

    }


    filtered.forEach(video => {

        const card =
            document.createElement(
                "div"
            );


        card.className =
            "video-card";


        /* ==================================================
           ① GROUP VIDEO

           SBS       → 굵게
           15-LOVE   → 얇게
           인기가요 직캠 → 굵게
           날짜       → 얇게
        ================================================== */

        if(video.dataType === "group"){

            card.innerHTML = `

                <img
                    class="video-thumbnail"
                    src="https://img.youtube.com/vi/${video.videoId}/hqdefault.jpg"
                    alt="${video.title || ""}"
                    loading="lazy"
                >

                <div class="video-info">

                    <div class="video-broadcaster">
                        ${video.broadcaster || ""}
                    </div>

                    <div class="video-album">
                        ${video.album || ""}
                    </div>

                    <div class="video-title">
                        ${[
                            video.program,
                            video.type
                        ]
                        .filter(Boolean)
                        .join(" ")}
                    </div>

                    <div class="video-date">
                        ${video.date || ""}
                    </div>

                </div>

            `;

        }


        /* ==================================================
           ② MEMBER VIDEO + ALBUM

           지우          → 굵게
           15-LOVE       → 얇게
           인기가요 페이스캠 → 굵게
           날짜          → 얇게
        ================================================== */

        else if(video.dataType === "member"){

            card.innerHTML = `

                <img
                    class="video-thumbnail"
                    src="https://img.youtube.com/vi/${video.videoId}/hqdefault.jpg"
                    alt="${video.title || ""}"
                    loading="lazy"
                >

                <div class="video-info">

                    <div class="video-broadcaster">
                        ${video.member || ""}
                    </div>

                    ${
                        video.content

                            ? `

                                <!-- ③ MEMBER + CONTENT -->

                                <div class="video-album">
                                    ${video.title || ""}
                                </div>

                                <div class="video-title">
                                    ${video.content || ""}
                                </div>

                              `

                            : `

                                <!-- ② MEMBER + ALBUM -->

                                <div class="video-album">
                                    ${video.album || ""}
                                </div>

                                <div class="video-title">
                                    ${video.title || ""}
                                </div>

                              `
                    }

                    <div class="video-date">
                        ${video.date || ""}
                    </div>

                </div>

            `;

        }


        /* =========================
           ETC VIDEO
        ========================= */

        else{

            card.innerHTML = `

                <img
                    class="video-thumbnail"
                    src="https://img.youtube.com/vi/${video.videoId}/hqdefault.jpg"
                    alt="${video.title || ""}"
                    loading="lazy"
                >

                <div class="video-info">

                    <div class="video-broadcaster">
                        ${video.broadcaster || ""}
                    </div>

                    ${
                        video.album
                            ? `
                                <div class="video-album">
                                    ${video.album}
                                </div>
                              `
                            : ""
                    }

                    <div class="video-title">
                        ${video.title || ""}
                    </div>

                    <div class="video-date">
                        ${video.date || ""}
                    </div>

                </div>

            `;

        }


        /* =========================
           CARD CLICK
        ========================= */

        card.addEventListener(
            "click",
            () => {

                openModal(video);

            }
        );


        grid.appendChild(card);

    });

}


/* =========================
   MODAL
========================= */

function openModal(video){

    const modal =
        document.getElementById(
            "modal"
        );

    const modalVideo =
        document.getElementById(
            "modalVideo"
        );

    const modalMember =
        document.getElementById(
            "modalMember"
        );

    const modalTitle =
        document.getElementById(
            "modalTitle"
        );

    const modalDate =
        document.getElementById(
            "modalDate"
        );


    modalVideo.src =
        `https://www.youtube.com/embed/${video.videoId}?autoplay=1`;


    modalMember.textContent =
        video.member ||
        video.broadcaster ||
        "";


    modalTitle.textContent =
        video.title ||
        "";


    modalDate.textContent =
        video.date ||
        "";


    modal.classList.add(
        "active"
    );

}


/* =========================
   CLOSE MODAL
========================= */

function closeModal(){

    const modal =
        document.getElementById(
            "modal"
        );

    const modalVideo =
        document.getElementById(
            "modalVideo"
        );


    modal.classList.remove(
        "active"
    );

    modalVideo.src = "";

}


document
    .getElementById("modalClose")
    .addEventListener(
        "click",
        closeModal
    );


document
    .getElementById("modal")
    .addEventListener(
        "click",
        event => {

            if(
                event.target.id === "modal"
            ){

                closeModal();

            }

        }
    );


/* =========================
   ALBUM FILTER
========================= */

document
    .getElementById("albumFilters")
    .addEventListener(
        "click",
        event => {

            const button =
                event.target.closest(
                    ".filter-btn"
                );

            if(!button) return;


            document
                .querySelectorAll(
                    "#albumFilters .filter-btn"
                )
                .forEach(btn =>
                    btn.classList.remove(
                        "active"
                    )
                );


            button.classList.add(
                "active"
            );


            currentAlbum =
                button.dataset.album;


            renderVideos();

        }
    );


/* =========================
   MEMBER FILTER
========================= */

document
    .getElementById("memberFilters")
    .addEventListener(
        "click",
        event => {

            const button =
                event.target.closest(
                    ".filter-btn"
                );

            if(!button) return;


            document
                .querySelectorAll(
                    "#memberFilters .filter-btn"
                )
                .forEach(btn =>
                    btn.classList.remove(
                        "active"
                    )
                );


            button.classList.add(
                "active"
            );


            currentMember =
                button.dataset.member;


            renderVideos();

        }
    );


/* =========================
   DATE SEARCH
========================= */

document
    .getElementById("dateSearch")
    .addEventListener(
        "input",
        event => {

            currentSearch =
                event.target.value
                    .replace(/\D/g,"")
                    .slice(0,8);


            renderVideos();

        }
    );


/* =========================
   SORT
========================= */

document
    .getElementById("latestBtn")
    .addEventListener(
        "click",
        () => {

            currentSort =
                "latest";


            document
                .getElementById("latestBtn")
                .classList.add(
                    "active"
                );


            document
                .getElementById("oldestBtn")
                .classList.remove(
                    "active"
                );


            renderVideos();

        }
    );


document
    .getElementById("oldestBtn")
    .addEventListener(
        "click",
        () => {

            currentSort =
                "oldest";


            document
                .getElementById("oldestBtn")
                .classList.add(
                    "active"
                );


            document
                .getElementById("latestBtn")
                .classList.remove(
                    "active"
                );


            renderVideos();

        }
    );


/* =========================
   START
========================= */

loadVideos();

</script>

</body>
</html>
