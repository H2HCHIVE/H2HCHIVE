<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>음방 직캠 | H2HCHIVE</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    min-height:100%;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#f5f6f8;
    color:#222;
}


/* =========================
   콘텐츠
========================= */

.content{
    width:100%;
    min-height:100vh;
}

.content-inner{
    width:100%;
    max-width:900px;

    margin:0 auto;

    padding:24px 16px 60px;
}


/* =========================
   상단 제목
========================= */

.main-title{
    margin-bottom:14px;

    padding-bottom:10px;

    border-bottom:1px solid #ddd;
}

.main-title h1{
    display:inline-block;

    position:relative;

    margin:0;

    padding:0 0 10px;

    font-size:1.1rem;
    font-weight:700;
}

.main-title h1::after{
    content:"";

    position:absolute;

    left:0;
    right:0;
    bottom:-11px;

    height:2px;

    background:#89CFF0;
}


/* =========================
   직캠 종류
   external.html과 동일한 디자인
========================= */

.type-list{
    display:flex;
    flex-direction:column;

    gap:6px;

    max-height:126px;

    overflow-y:auto;

    margin-bottom:16px;

    padding:8px;

    background:#fff;

    border:1px solid #e5e5e5;

    border-radius:10px;

    box-sizing:border-box;
}

.type-list::-webkit-scrollbar{
    width:4px;
}

.type-list::-webkit-scrollbar-track{
    background:transparent;
}

.type-list::-webkit-scrollbar-thumb{
    background:#d5d5d5;
    border-radius:999px;
}

.type-list{
    scrollbar-width:thin;
    scrollbar-color:#d5d5d5 transparent;
}


/* =========================
   직캠 종류 버튼
   external.html .category와 동일
========================= */

.type-button{
    flex-shrink:0;

    padding:8px 10px;

    border:0;

    border-radius:8px;

    background:#fff;

    color:#666;

    font-family:inherit;

    font-size:.75rem;

    text-align:left;

    cursor:pointer;
}

.type-button:hover{
    background:#f5f6f8;
}

.type-button.active{
    background:#eaf7fd;

    color:#4aa8d5;

    font-weight:600;
}


/* =========================
   세부 카테고리
   external.html과 동일한 디자인
========================= */

.sub-category-list{
    display:none;

    flex-direction:column;

    gap:6px;

    max-height:126px;

    overflow-y:auto;

    margin-bottom:16px;

    padding:8px;

    background:#fff;

    border:1px solid #e5e5e5;

    border-radius:10px;

    box-sizing:border-box;

    scrollbar-width:thin;

    scrollbar-color:#d5d5d5 transparent;
}

.sub-category-list.show{
    display:flex;
}

.sub-category-list::-webkit-scrollbar{
    width:4px;
}

.sub-category-list::-webkit-scrollbar-track{
    background:transparent;
}

.sub-category-list::-webkit-scrollbar-thumb{
    background:#d5d5d5;

    border-radius:999px;
}


/* =========================
   세부 카테고리 버튼
   external.html .category와 동일
========================= */

.sub-category-button{
    flex-shrink:0;

    padding:8px 10px;

    border:0;

    border-radius:8px;

    background:#fff;

    color:#666;

    font-family:inherit;

    font-size:.75rem;

    text-align:left;

    cursor:pointer;
}

.sub-category-button:hover{
    background:#f5f6f8;
}

.sub-category-button.active{
    background:#eaf7fd;

    color:#4aa8d5;

    font-weight:600;
}


/* =========================
   날짜 검색
========================= */

.search-area{
    margin-bottom:16px;
}

#dateSearch{
    width:100%;
    min-width:0;

    padding:10px 11px;

    border:1px solid #ddd;
    border-radius:9px;

    background:#fff;

    color:#222;

    font-family:inherit;
    font-size:.8rem;

    outline:none;
}

#dateSearch:focus{
    border-color:#b9dff0;
}

#dateSearch::placeholder{
    color:#aaa;
}


/* =========================
   영상 그리드
========================= */

.video-grid{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:10px;
}


/* =========================
   영상 카드
========================= */

.video-card{
    display:block;

    overflow:hidden;

    background:#fff;

    border-radius:13px;

    text-decoration:none;
    color:#222;

    box-shadow:
        0 2px 7px rgba(0,0,0,.05);
}

.video-thumbnail{
    width:100%;

    aspect-ratio:16 / 9;

    display:block;

    object-fit:cover;

    background:#eee;
}

.video-info{
    padding:9px 10px 11px;
}

.video-title{
    margin-bottom:4px;

    font-size:.8rem;
    font-weight:600;

    line-height:1.35;

    display:-webkit-box;
    -webkit-box-orient:vertical;
    -webkit-line-clamp:2;

    overflow:hidden;
}

.video-date{
    color:#999;

    font-size:.7rem;
}


/* =========================
   빈 결과
========================= */

.empty{
    grid-column:1 / -1;

    padding:45px 10px;

    color:#999;

    font-size:.8rem;

    text-align:center;
}


/* =========================
   모바일
========================= */

@media(max-width:360px){

    .content-inner{
        padding-left:12px;
        padding-right:12px;
    }

    .video-grid{
        gap:8px;
    }

    .video-info{
        padding:8px 9px 10px;
    }

    .video-title{
        font-size:.76rem;
    }

}
</style>
</head>


<body>


<main class="content">

    <div class="content-inner">


        <!-- =========================
             제목
        ========================= -->

        <div class="main-title">

            <h1>
                음방 직캠
            </h1>

        </div>


        <!-- =========================
             직캠 종류
        ========================= -->

        <div class="type-list">

            <button
                type="button"
                class="type-button active"
                data-type="all"
                onclick="showType('all')"
            >
                전체
            </button>

            <button
                type="button"
                class="type-button"
                data-type="group"
                onclick="showType('group')"
            >
                그룹 직캠
            </button>

            <button
                type="button"
                class="type-button"
                data-type="member"
                onclick="showType('member')"
            >
                멤버 직캠
            </button>

        </div>


        <!-- =========================
             그룹 → 앨범
        ========================= -->

        <div
            id="albumFilters"
            class="sub-category-list"
        >

            <button
                type="button"
                class="sub-category-button"
                data-album="The Chase"
                onclick="showAlbum('The Chase')"
            >
                The Chase
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-album="STYLE"
                onclick="showAlbum('STYLE')"
            >
                STYLE
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-album="Pretty Please"
                onclick="showAlbum('Pretty Please')"
            >
                Pretty Please
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-album="FOCUS"
                onclick="showAlbum('FOCUS')"
            >
                FOCUS
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-album="RUDE"
                onclick="showAlbum('RUDE')"
            >
                RUDE!
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-album="Lemon Tang"
                onclick="showAlbum('Lemon Tang')"
            >
                Lemon Tang
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-album="15-LOVE"
                onclick="showAlbum('15-LOVE')"
            >
                15-LOVE
            </button>

        </div>


        <!-- =========================
             멤버
        ========================= -->

        <div
            id="memberFilters"
            class="sub-category-list"
        >

            <button
                type="button"
                class="sub-category-button"
                data-member="지우"
                onclick="showMember('지우')"
            >
                지우
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-member="카르멘"
                onclick="showMember('카르멘')"
            >
                카르멘
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-member="유하"
                onclick="showMember('유하')"
            >
                유하
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-member="스텔라"
                onclick="showMember('스텔라')"
            >
                스텔라
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-member="주은"
                onclick="showMember('주은')"
            >
                주은
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-member="에이나"
                onclick="showMember('에이나')"
            >
                에이나
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-member="이안"
                onclick="showMember('이안')"
            >
                이안
            </button>

            <button
                type="button"
                class="sub-category-button"
                data-member="예온"
                onclick="showMember('예온')"
            >
                예온
            </button>

        </div>


        <!-- =========================
             날짜 검색
        ========================= -->

        <div class="search-area">

            <input
                id="dateSearch"
                type="text"
                placeholder="날짜 검색  ·  예: 250224"
                oninput="searchByDate()"
            >

        </div>


        <!-- =========================
             영상
        ========================= -->

        <div
            class="video-grid"
            id="videoGrid"
        >

            <div class="empty">
                영상을 불러오는 중입니다.
            </div>

        </div>


    </div>

</main>


<script>


/* =========================
   상태값
========================= */

let allVideos = [];

let currentType = "all";

let currentAlbum = "all";

let currentMember = "all";

let currentDate = "";



/* =========================
   영상 출력
========================= */

function renderVideos(videos){

    const grid =
        document.getElementById("videoGrid");

    grid.innerHTML = "";


    if(videos.length === 0){

        grid.innerHTML = `
            <div class="empty">
                해당하는 직캠이 없습니다.
            </div>
        `;

        return;
    }


    videos.forEach(video => {

        const card =
            document.createElement("a");


        card.className =
            "video-card";


        card.href =
            `https://www.youtube.com/watch?v=${video.videoId}`;


        card.target =
            "_blank";


        card.rel =
            "noopener noreferrer";


        card.innerHTML = `

            <img
                class="video-thumbnail"
                src="https://img.youtube.com/vi/${video.videoId}/hqdefault.jpg"
                alt="${video.title}"
                loading="lazy"
            >

            <div class="video-info">

                <div class="video-title">
                    ${video.title}
                </div>

                <div class="video-date">
                    ${video.date}
                </div>

            </div>

        `;


        grid.appendChild(card);

    });

}



/* =========================
   필터 적용
========================= */

function applyFilters(){

    let filtered =
        allVideos;


    /* -------------------------
       직캠 종류
    ------------------------- */

    if(currentType === "group"){

        filtered =
            filtered.filter(
                video => !video.member
            );

    }


    if(currentType === "member"){

        filtered =
            filtered.filter(
                video => video.member
            );

    }


    /* -------------------------
       앨범
    ------------------------- */

    if(currentAlbum !== "all"){

        filtered =
            filtered.filter(
                video =>
                    video.album === currentAlbum
            );

    }


    /* -------------------------
       멤버
    ------------------------- */

    if(currentMember !== "all"){

        filtered =
            filtered.filter(
                video =>
                    video.member === currentMember
            );

    }


    /* -------------------------
       날짜
    ------------------------- */

    if(currentDate !== ""){

        filtered =
            filtered.filter(video => {

                const compactDate =
                    (video.date || "")
                        .replaceAll("-", "")
                        .slice(2);

                return compactDate.includes(
                    currentDate
                );

            });

    }


    renderVideos(filtered);

}



/* =========================
   종류 버튼 상태
========================= */

function updateTypeButtons(){

    document
        .querySelectorAll(".type-button")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.type === currentType
            );

        });

}



/* =========================
   세부 필터 표시
========================= */

function updateFilterVisibility(){

    const albumFilters =
        document.getElementById(
            "albumFilters"
        );

    const memberFilters =
        document.getElementById(
            "memberFilters"
        );


    albumFilters.classList.toggle(
        "show",
        currentType === "group"
    );


    memberFilters.classList.toggle(
        "show",
        currentType === "member"
    );

}



/* =========================
   앨범 버튼 상태
========================= */

function updateAlbumButtons(){

    document
        .querySelectorAll(
            "#albumFilters .sub-category-button"
        )
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.album === currentAlbum
            );

        });

}



/* =========================
   멤버 버튼 상태
========================= */

function updateMemberButtons(){

    document
        .querySelectorAll(
            "#memberFilters .sub-category-button"
        )
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.member === currentMember
            );

        });

}



/* =========================
   직캠 종류 선택
========================= */

function showType(type){

    currentType =
        type;


    currentAlbum =
        "all";


    currentMember =
        "all";


    updateTypeButtons();

    updateFilterVisibility();

    updateAlbumButtons();

    updateMemberButtons();

    applyFilters();

}



/* =========================
   앨범 선택
========================= */

function showAlbum(album){

    currentType =
        "group";


    currentAlbum =
        album;


    currentMember =
        "all";


    updateTypeButtons();

    updateFilterVisibility();

    updateAlbumButtons();

    updateMemberButtons();

    applyFilters();

}



/* =========================
   멤버 선택
========================= */

function showMember(member){

    currentType =
        "member";


    currentMember =
        member;


    currentAlbum =
        "all";


    updateTypeButtons();

    updateFilterVisibility();

    updateAlbumButtons();

    updateMemberButtons();

    applyFilters();

}



/* =========================
   날짜 검색
========================= */

function searchByDate(){

    currentDate =
        document
            .getElementById("dateSearch")
            .value
            .trim()
            .replace(/-/g,"");


    applyFilters();

}



/* =========================
   video.json 불러오기
========================= */

async function loadVideos(){

    try{

        const response =
            await fetch("video.json");


        if(!response.ok){

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        allVideos =
            await response.json();


        applyFilters();

    }

    catch(error){

        console.error(
            "video.json 불러오기 실패:",
            error
        );


        document.getElementById(
            "videoGrid"
        ).innerHTML = `
            <div class="empty">
                영상을 불러오지 못했습니다.
            </div>
        `;

    }

}



/* =========================
   시작
========================= */

loadVideos();

</script>


</body>
</html>
