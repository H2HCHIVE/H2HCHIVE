<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>H2HCHIVE 음방 직캠</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f7f7f7;
    color:#111;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}


/* =========================
   HEADER
========================= */

.header{
    position:sticky;
    top:0;

    background:#fff;

    border-bottom:1px solid #e5e5e5;

    padding:20px;

    text-align:center;

    z-index:100;
}

.header h1{
    font-size:24px;
    font-weight:700;
    letter-spacing:1px;
}


/* =========================
   FILTER
========================= */

.filter-bar{
    margin-top:12px;

    display:flex;
    flex-direction:column;

    align-items:center;

    gap:10px;
}


/* =========================
   기본 필터
========================= */

.filter-buttons{
    display:flex;

    gap:8px;

    flex-wrap:wrap;

    justify-content:center;
}

.filter-buttons button{
    padding:8px 14px;

    border:1px solid #ddd;

    background:#fff;

    border-radius:999px;

    font-size:13px;

    cursor:pointer;

    transition:.2s;
}

.filter-buttons button:hover{
    background:#111;

    color:#fff;

    border-color:#111;
}


/* =========================
   앨범 필터
========================= */

#albumFilters{

    width:260px;

    height:118px;

    display:none;

    flex-direction:column;

    flex-wrap:nowrap;

    gap:6px;

    overflow-y:auto;

    overflow-x:hidden;

    padding:4px;

    border:1px solid #e5e5e5;

    border-radius:12px;

    background:#f9f9f9;

    justify-content:flex-start;

    align-items:stretch;

    scrollbar-width:thin;

    scrollbar-color:#ccc transparent;
}


/* Chrome / Safari */

#albumFilters::-webkit-scrollbar{
    width:5px;
}

#albumFilters::-webkit-scrollbar-track{
    background:transparent;
}

#albumFilters::-webkit-scrollbar-thumb{
    background:#ccc;

    border-radius:999px;
}


/* 앨범 버튼 */

#albumFilters button{

    width:100%;

    min-height:32px;

    flex-shrink:0;

    padding:7px 12px;

    border:1px solid #ddd;

    background:#fff;

    border-radius:8px;

    font-size:13px;

    cursor:pointer;

    text-align:center;
}

#albumFilters button:hover{
    background:#111;

    color:#fff;

    border-color:#111;
}


/* =========================
   DATE SEARCH
========================= */

#dateSearch{

    padding:10px 14px;

    border:1px solid #ddd;

    border-radius:999px;

    font-size:13px;

    width:180px;

    outline:none;

    transition:.2s;
}

#dateSearch:focus{
    border-color:#111;

    width:220px;
}


/* =========================
   VIDEO GRID
========================= */

.archive-grid{

    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:16px;

    padding:20px;

    max-width:1200px;

    margin:0 auto;
}


/* =========================
   VIDEO CARD
========================= */

.archive-card{

    display:block;

    text-decoration:none;

    color:inherit;

    background:#fff;

    border-radius:18px;

    overflow:hidden;

    border:1px solid #e5e5e5;

    transition:.2s;
}

.archive-card:hover{
    transform:translateY(-2px);
}

.archive-thumb{

    width:100%;

    aspect-ratio:16/9;

    object-fit:cover;

    display:block;
}

.archive-content{
    padding:12px;
}

.archive-title{

    font-size:14px;

    font-weight:600;

    line-height:1.4;

    margin-bottom:8px;

    display:-webkit-box;

    -webkit-line-clamp:2;

    -webkit-box-orient:vertical;

    overflow:hidden;
}

.archive-date{

    font-size:12px;

    color:#777;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .archive-grid{

        gap:10px;

        padding:10px;
    }

    .archive-content{
        padding:10px;
    }

    .archive-title{
        font-size:13px;
    }

    .archive-date{
        font-size:11px;
    }

    #albumFilters{

        width:240px;

        height:118px;
    }

}

</style>
</head>


<body>


<header class="header">


    <h1>📺음방 직캠</h1>


    <div class="filter-bar">


        <!-- =========================
             직캠 종류
        ========================= -->

        <div class="filter-buttons">

            <button onclick="showType('all')">
                전체
            </button>

            <button onclick="showType('group')">
                그룹 직캠
            </button>

            <button onclick="showType('member')">
                멤버 직캠
            </button>

        </div>


        <!-- =========================
             앨범 필터
        ========================= -->

        <div id="albumFilters">


            <button onclick="showAlbum('The Chase')">
                The Chase
            </button>


            <button onclick="showAlbum('STYLE')">
                STYLE
            </button>


            <button onclick="showAlbum('Pretty Please')">
                Pretty Please
            </button>


            <button onclick="showAlbum('FOCUS')">
                FOCUS
            </button>


            <button onclick="showAlbum('RUDE')">
                RUDE
            </button>


            <button onclick="showAlbum('Lemon Tang')">
                Lemon Tang
            </button>


            <button onclick="showAlbum('15-LOVE')">
                15-LOVE
            </button>


        </div>


        <!-- =========================
             멤버 필터
        ========================= -->

        <div
            id="memberFilters"
            class="filter-buttons"
            style="display:none;"
        >

            <button onclick="showMember('지우')">
                지우
            </button>


            <button onclick="showMember('카르멘')">
                카르멘
            </button>


            <button onclick="showMember('유하')">
                유하
            </button>


            <button onclick="showMember('스텔라')">
                스텔라
            </button>


            <button onclick="showMember('주은')">
                주은
            </button>


            <button onclick="showMember('에이나')">
                에이나
            </button>


            <button onclick="showMember('이안')">
                이안
            </button>


            <button onclick="showMember('예온')">
                예온
            </button>

        </div>


        <!-- =========================
             날짜 검색
        ========================= -->

        <input
            id="dateSearch"
            placeholder="예: 250224"
            oninput="searchByDate()"
        >


    </div>


</header>



<!-- =========================
     VIDEO LIST
========================= -->

<div
    id="archiveGrid"
    class="archive-grid"
></div>



<script>


/* =========================
   상태값
========================= */

let allVideos = [];

let currentType = "all";

let currentAlbum = "all";

let currentMember = "all";

let currentDate = "";



/* =========================
   영상 출력
========================= */

function renderVideos(videos){

    const grid =
        document.getElementById("archiveGrid");


    grid.innerHTML = "";


    videos.forEach(video => {


        const card =
            document.createElement("a");


        card.className =
            "archive-card";


        card.href =
            `https://www.youtube.com/watch?v=${video.videoId}`;


        card.target =
            "_blank";


        card.innerHTML = `

            <img
                class="archive-thumb"
                src="https://img.youtube.com/vi/${video.videoId}/hqdefault.jpg"
                alt="${video.title}"
            >


            <div class="archive-content">

                <div class="archive-title">
                    ${video.title}
                </div>


                <div class="archive-date">
                    ${video.date}
                </div>

            </div>

        `;


        grid.appendChild(card);

    });

}



/* =========================
   필터 적용
========================= */

function applyFilters(){

    let filtered =
        allVideos;


    /* 직캠 종류 */

    if(currentType === "group"){

        filtered =
            filtered.filter(
                video => !video.member
            );

    }


    if(currentType === "member"){

        filtered =
            filtered.filter(
                video => video.member
            );

    }


    /* 앨범 */

    if(currentAlbum !== "all"){

        filtered =
            filtered.filter(
                video =>
                    video.album === currentAlbum
            );

    }


    /* 멤버 */

    if(currentMember !== "all"){

        filtered =
            filtered.filter(
                video =>
                    video.member === currentMember
            );

    }


    /* 날짜 */

    if(currentDate !== ""){

        filtered =
            filtered.filter(video => {


                const compactDate =
                    video.date
                        .replaceAll("-", "")
                        .slice(2);


                return compactDate.includes(
                    currentDate
                );

            });

    }


    renderVideos(filtered);

}



/* =========================
   필터 표시
========================= */

function updateFilterVisibility(){

    const albumFilters =
        document.getElementById(
            "albumFilters"
        );

    const memberFilters =
        document.getElementById(
            "memberFilters"
        );


    /* 그룹 직캠 */

    if(currentType === "group"){

        albumFilters.style.display =
            "flex";

    }
    else{

        albumFilters.style.display =
            "none";

    }


    /* 멤버 직캠 */

    if(currentType === "member"){

        memberFilters.style.display =
            "flex";

    }
    else{

        memberFilters.style.display =
            "none";

    }

}



/* =========================
   직캠 종류
========================= */

function showType(type){

    currentType =
        type;


    currentAlbum =
        "all";


    currentMember =
        "all";


    updateFilterVisibility();


    if(type === "all"){

        currentDate =
            "";

        document.getElementById(
            "dateSearch"
        ).value =
            "";

    }


    applyFilters();

}



/* =========================
   앨범 선택
========================= */

function showAlbum(album){

    currentType =
        "group";


    currentAlbum =
        album;


    currentMember =
        "all";


    /*
       앨범 필터는 계속 표시.
       내부에서 세로 스크롤.
    */

    updateFilterVisibility();


    applyFilters();

}



/* =========================
   멤버 선택
========================= */

function showMember(member){

    currentType =
        "member";


    currentMember =
        member;


    currentAlbum =
        "all";


    updateFilterVisibility();


    applyFilters();

}



/* =========================
   날짜 검색
========================= */

function searchByDate(){

    currentDate =
        document
            .getElementById("dateSearch")
            .value
            .trim();


    applyFilters();

}



/* =========================
   video.json
========================= */

async function loadVideos(){

    try{

        const response =
            await fetch("video.json");


        allVideos =
            await response.json();


        applyFilters();

    }

    catch(error){

        console.error(
            "video.json 불러오기 실패:",
            error
        );

    }

}



/* =========================
   시작
========================= */

loadVideos();


</script>


</body>
</html>
