<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>콘텐츠 | H2HCHIVE</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    min-height:100%;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#f5f6f8;
    color:#222;
}

.page{
    width:100%;
    min-height:100vh;
    display:flex;
}


/* =========================
   사이드바
========================= */

.sidebar{
    width:100px;
    min-height:100vh;
    flex-shrink:0;

    padding:24px 6px;

    background:#f5f6f8;
    border-right:1px solid #e5e5e5;
}


/* =========================
   뒤로가기
========================= */

.back-btn{
    display:inline-block;

    margin:0 0 20px 2px;

    text-decoration:none;

    color:#222;

    font-size:1.5rem;
    line-height:1;
}


/* =========================
   사이드바 제목
========================= */

.sidebar-title{
    padding:0 2px 20px;

    text-align:center;

    font-size:1.1rem;
    font-weight:700;
}


/* =========================
   메뉴
========================= */

.menu-list{
    display:flex;
    flex-direction:column;
    gap:3px;
}

.menu-link{
    display:flex;

    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:5px;

    min-height:62px;

    padding:8px 3px;

    border-radius:10px;

    color:#666;

    text-decoration:none;

    font-size:10px;
    font-weight:500;

    text-align:center;

    transition:.2s;
}

.menu-link:hover{
    background:#fff;
    color:#222;
}

.menu-link.active{
    background:#fff;

    color:#222;

    font-weight:600;

    box-shadow:
        0 2px 7px rgba(0,0,0,.05);
}

.menu-icon{
    width:auto;

    text-align:center;

    font-size:18px;

    line-height:1;
}

.menu-name{
    white-space:nowrap;
}


/* =========================
   콘텐츠
========================= */

.content{
    flex:1;

    min-width:0;
    min-height:100vh;
}

.content-frame{
    display:block;

    width:100%;
    height:100vh;

    border:0;
}


/* =========================
   모바일
========================= */

@media(max-width:360px){

    .sidebar{
        width:88px;

        padding:22px 4px;
    }

    .back-btn{
        margin-left:2px;
        margin-bottom:18px;

        font-size:1.4rem;
    }

    .sidebar-title{
        font-size:1rem;
        padding-bottom:18px;
    }

    .menu-link{
        min-height:58px;
        font-size:9px;
    }

    .menu-icon{
        font-size:17px;
    }

}
</style>
</head>


<body>

<div class="page">


    <!-- =========================
         사이드바
    ========================= -->

    <aside class="sidebar">


        <!-- 뒤로가기 -->

        <a
            href="index.html"
            class="back-btn"
            aria-label="홈으로 돌아가기"
        >
            ←
        </a>


        <!-- 제목 -->

        <div class="sidebar-title">
            콘텐츠
        </div>


        <!-- 메뉴 -->

        <nav class="menu-list">


            <a
                href="musicshow.html"
                target="content-frame"
                class="menu-link active"
            >
                <span class="menu-icon">📺</span>
                <span class="menu-name">음악방송</span>
            </a>


            <a
                href="selfcontent.html"
                target="content-frame"
                class="menu-link"
            >
                <span class="menu-icon">▶️</span>
                <span class="menu-name">자체 콘텐츠</span>
            </a>


            <a
                href="external.html"
                target="content-frame"
                class="menu-link"
            >
                <span class="menu-icon">📹</span>
                <span class="menu-name">외부 콘텐츠</span>
            </a>


            <a
                href="radio.html"
                target="content-frame"
                class="menu-link"
            >
                <span class="menu-icon">📻</span>
                <span class="menu-name">라디오</span>
            </a>


            <a
                href="weverse.html"
                target="content-frame"
                class="menu-link"
            >
                <span class="menu-icon">📶</span>
                <span class="menu-name">위버스 라이브</span>
            </a>


        </nav>

    </aside>


    <!-- =========================
         콘텐츠 영역
    ========================= -->

    <main class="content">

        <iframe
            name="content-frame"
            src="musicshow.html"
            class="content-frame"
            title="콘텐츠"
        ></iframe>

    </main>


</div>


<script>

const menuLinks =
    document.querySelectorAll(".menu-link");

menuLinks.forEach(link => {

    link.addEventListener("click", () => {

        menuLinks.forEach(item => {
            item.classList.remove("active");
        });

        link.classList.add("active");

    });

});

</script>


</body>
</html>
