<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>콘텐츠 | H2HCHIVE</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    min-height:100%;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#f5f6f8;
    color:#222;
}

.page{
    width:100%;
    min-height:100vh;
    display:flex;
}


/* =========================
   사이드바
========================= */

.sidebar{
    width:100px;
    min-height:100vh;
    flex-shrink:0;

    padding:24px 6px;

    background:#f5f6f8;
    border-right:1px solid #e5e5e5;

    transition:
        width .25s ease,
        padding .25s ease;
}


/* =========================
   축소된 사이드바
========================= */

.sidebar.collapsed{
    width:58px;

    padding:24px 5px;
}


/* =========================
   뒤로가기
========================= */

.back-btn{
    display:block;

    width:100%;

    margin:0 0 20px;

    text-align:center;

    text-decoration:none;

    color:#222;

    font-size:1.5rem;
    line-height:1;

    transition:
        font-size .25s ease,
        margin .25s ease;
}


/* 축소 상태 */

.sidebar.collapsed .back-btn{
    font-size:1.25rem;

    margin-bottom:20px;
}


/* =========================
   사이드바 제목
========================= */

.sidebar-title{
    padding:0 2px 20px;

    text-align:center;

    font-size:1.1rem;
    font-weight:700;

    white-space:nowrap;

    overflow:hidden;

    transition:
        opacity .15s ease,
        height .25s ease,
        padding .25s ease;
}


/* 축소 상태 */

.sidebar.collapsed .sidebar-title{
    height:0;

    padding:0;

    opacity:0;
}


/* =========================
   메뉴
========================= */

.menu-list{
    display:flex;

    flex-direction:column;

    gap:3px;
}

.menu-link{
    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:5px;

    min-height:62px;

    padding:8px 3px;

    border-radius:10px;

    color:#666;

    text-decoration:none;

    font-size:10px;
    font-weight:500;

    text-align:center;

    transition:
        min-height .25s ease,
        padding .25s ease,
        gap .25s ease,
        background .2s ease,
        color .2s ease,
        box-shadow .2s ease;
}

.menu-link:hover{
    background:#fff;
    color:#222;
}

.menu-link.active{
    background:#fff;

    color:#222;

    font-weight:600;

    box-shadow:
        0 2px 7px rgba(0,0,0,.05);
}


/* =========================
   아이콘
========================= */

.menu-icon{
    width:auto;

    text-align:center;

    font-size:18px;

    line-height:1;

    transition:
        font-size .25s ease;
}


/* =========================
   선택된 메뉴
========================= */

.menu-link.active{
    min-height:38px;

    padding:5px 3px;

    gap:0;
}

.menu-link.active .menu-icon{
    font-size:14px;
}


/* =========================
   메뉴 글자
========================= */

.menu-name{
    white-space:nowrap;

    transition:
        opacity .15s ease,
        height .25s ease;
}

.menu-link.active .menu-name{
    height:0;

    opacity:0;

    overflow:hidden;
}


/* =========================
   사이드바가 좁아졌을 때
========================= */

/*
   선택된 메뉴가 하나라도 있으면
   JS가 sidebar에 collapsed를 추가함
*/

.sidebar.collapsed .menu-link{
    min-height:52px;

    padding:7px 2px;

    gap:4px;
}

.sidebar.collapsed .menu-link.active{
    min-height:36px;

    padding:5px 2px;

    gap:0;
}

.sidebar.collapsed .menu-icon{
    font-size:17px;
}

.sidebar.collapsed .menu-link.active .menu-icon{
    font-size:13px;
}


/* =========================
   콘텐츠
========================= */

.content{
    flex:1;

    min-width:0;
    min-height:100vh;
}

.content-frame{
    display:block;

    width:100%;
    height:100vh;

    border:0;
}


/* =========================
   모바일
========================= */

@media(max-width:360px){

    .sidebar{
        width:88px;

        padding:22px 4px;
    }

    .sidebar.collapsed{
        width:52px;

        padding:22px 4px;
    }

    .back-btn{
        margin-left:2px;
        margin-bottom:18px;

        font-size:1.4rem;
    }

    .sidebar.collapsed .back-btn{
        font-size:1.2rem;

        margin-bottom:18px;
    }

    .sidebar-title{
        font-size:1rem;

        padding-bottom:18px;
    }

    .menu-link{
        min-height:58px;

        font-size:9px;
    }

    .menu-icon{
        font-size:17px;
    }

    .menu-link.active{
        min-height:36px;
    }

    .sidebar.collapsed .menu-link{
        min-height:50px;
    }

    .sidebar.collapsed .menu-link.active{
        min-height:34px;
    }

}
</style>
</head>


<body>

<div class="page">


    <!-- =========================
         사이드바
    ========================= -->

    <aside class="sidebar" id="sidebar">


        <!-- 뒤로가기 -->

        <a
            href="index.html"
            class="back-btn"
            aria-label="홈으로 돌아가기"
        >
            ←
        </a>


        <!-- 제목 -->

        <div class="sidebar-title">
            콘텐츠
        </div>


        <!-- 메뉴 -->

        <nav class="menu-list">


            <a
                href="musicshow.html"
                target="content-frame"
                class="menu-link active"
            >
                <span class="menu-icon">📺</span>
                <span class="menu-name">음악방송</span>
            </a>


            <a
                href="selfcontent.html"
                target="content-frame"
                class="menu-link"
            >
                <span class="menu-icon">▶️</span>
                <span class="menu-name">자체 콘텐츠</span>
            </a>


            <a
                href="external.html"
                target="content-frame"
                class="menu-link"
            >
                <span class="menu-icon">📹</span>
                <span class="menu-name">외부 콘텐츠</span>
            </a>


            <a
                href="radio.html"
                target="content-frame"
                class="menu-link"
            >
                <span class="menu-icon">📻</span>
                <span class="menu-name">라디오</span>
            </a>


            <a
                href="weverse.html"
                target="content-frame"
                class="menu-link"
            >
                <span class="menu-icon">📶</span>
                <span class="menu-name">위버스 라이브</span>
            </a>


        </nav>

    </aside>


    <!-- =========================
         콘텐츠 영역
    ========================= -->

    <main class="content">

        <iframe
            name="content-frame"
            src="musicshow.html"
            class="content-frame"
            title="콘텐츠"
        ></iframe>

    </main>


</div>


<script>

const sidebar =
    document.getElementById("sidebar");

const menuLinks =
    document.querySelectorAll(".menu-link");


/* =========================
   메뉴 클릭
========================= */

menuLinks.forEach(link => {

    link.addEventListener("click", () => {


        /* 모든 메뉴 비활성화 */

        menuLinks.forEach(item => {
            item.classList.remove("active");
        });


        /* 클릭한 메뉴 활성화 */

        link.classList.add("active");


        /* 사이드바 축소 */

        sidebar.classList.add("collapsed");

    });

});


</script>


</body>
</html>
