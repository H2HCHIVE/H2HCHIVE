<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>콘텐츠 | H2HCHIVE</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f7f7f7;
    color:#111;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}


/* =========================
   전체 레이아웃
========================= */

.page{
    display:flex;
    width:100%;
    min-height:100vh;
}


/* =========================
   LEFT MENU
========================= */

.sidebar{
    position:sticky;
    top:0;

    width:190px;
    height:100vh;

    flex-shrink:0;

    padding:28px 16px;

    background:#f7f7f7;
    border-right:1px solid #e5e5e5;
}

.sidebar-title{
    padding:0 8px 24px;

    font-size:1.45rem;
    font-weight:700;
}

.menu-list{
    display:flex;
    flex-direction:column;
    gap:4px;
}

.menu-link{
    display:flex;
    align-items:center;

    gap:10px;

    padding:12px 10px;

    border-radius:12px;

    text-decoration:none;

    color:#555;

    font-size:.9rem;
    font-weight:500;

    transition:.2s;
}

.menu-link:hover{
    background:#fff;
    color:#111;
}

.menu-link.active{
    background:#fff;
    color:#111;
    font-weight:600;

    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.menu-icon{
    width:24px;

    text-align:center;

    font-size:1rem;
}

.menu-name{
    white-space:nowrap;
}


/* =========================
   RIGHT CONTENT
========================= */

.main-content{
    flex:1;
    min-width:0;

    padding-bottom:50px;
}


/* =========================
   MUSIC SHOW HEADER
========================= */

.music-header{
    position:sticky;
    top:0;

    background:#fff;

    border-bottom:1px solid #e5e5e5;

    padding:20px;

    text-align:center;

    z-index:100;
}

.music-header h1{
    font-size:24px;
    font-weight:700;
    letter-spacing:1px;
}


/* =========================
   FILTER
========================= */

.filter-bar{
    margin-top:12px;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    gap:10px;
}

.filter-buttons{
    display:flex;

    gap:8px;

    flex-wrap:wrap;

    justify-content:center;
}

.filter-buttons button{
    padding:8px 14px;

    border:1px solid #ddd;

    background:#fff;

    border-radius:999px;

    font-size:13px;

    cursor:pointer;

    transition:.2s;
}

.filter-buttons button:hover{
    background:#111;
    color:#fff;
    border-color:#111;
}

.filter-buttons button.active{
    background:#111;
    color:#fff;
    border-color:#111;
}


/* =========================
   DATE SEARCH
========================= */

#dateSearch{
    padding:10px 14px;

    border:1px solid #ddd;

    border-radius:999px;

    font-size:13px;

    width:180px;

    outline:none;

    transition:.2s;
}

#dateSearch:focus{
    border-color:#111;
    width:220px;
}


/* =========================
   VIDEO GRID
========================= */

.archive-grid{
    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:16px;

    padding:20px;

    max-width:1200px;

    margin:0 auto;
}


/* =========================
   VIDEO CARD
========================= */

.archive-card{
    display:block;

    text-decoration:none;

    color:inherit;

    background:#fff;

    border-radius:18px;

    overflow:hidden;

    border:1px solid #e5e5e5;

    transition:.2s;
}

.archive-card:hover{
    transform:translateY(-2px);
}

.archive-thumb{
    width:100%;

    aspect-ratio:16/9;

    object-fit:cover;

    display:block;
}

.archive-content{
    padding:12px;
}

.archive-title{
    font-size:14px;

    font-weight:600;

    line-height:1.4;

    margin-bottom:8px;

    display:-webkit-box;

    -webkit-line-clamp:2;

    -webkit-box-orient:vertical;

    overflow:hidden;
}

.archive-date{
    font-size:12px;

    color:#777;
}


/* =========================
   EMPTY MESSAGE
========================= */

.empty-message{
    padding:60px 20px;

    text-align:center;

    color:#888;

    font-size:14px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .sidebar{
        width:120px;

        padding:24px 8px;
    }

    .sidebar-title{
        padding:0 6px 22px;

        font-size:1.2rem;
    }

    .menu-link{
        padding:11px 6px;

        gap:6px;

        font-size:11px;
    }

    .menu-icon{
        width:21px;

        font-size:14px;
    }

    .music-header{
        padding:16px 10px;
    }

    .music-header h1{
        font-size:18px;
    }

    .filter-bar{
        margin-top:10px;
        gap:8px;
    }

    .filter-buttons{
        gap:5px;
    }

    .filter-buttons button{
        padding:7px 10px;

        font-size:11px;
    }

    #dateSearch{
        width:150px;

        padding:8px 12px;

        font-size:11px;
    }

    #dateSearch:focus{
        width:170px;
    }

    .archive-grid{
        gap:8px;

        padding:10px 8px;
    }

    .archive-content{
        padding:8px;
    }

    .archive-title{
        font-size:11px;

        margin-bottom:5px;
    }

    .archive-date{
        font-size:10px;
    }

}


/* =========================
   VERY SMALL SCREEN
========================= */

@media(max-width:360px){

    .sidebar{
        width:105px;
    }

    .menu-link{
        font-size:10px;
    }

    .archive-title{
        font-size:10px;
    }

}
</style>

</head>


<body>


<div class="page">


    <!-- =========================
         LEFT MENU
    ========================= -->

    <aside class="sidebar">

        <div class="sidebar-title">
            콘텐츠
        </div>


        <nav class="menu-list">


            <a
                href="content.html"
                class="menu-link active"
            >
                <span class="menu-icon">📺</span>
                <span class="menu-name">음악방송</span>
            </a>


            <a
                href="selfcontent.html"
                class="menu-link"
            >
                <span class="menu-icon">▶️</span>
                <span class="menu-name">자체 콘텐츠</span>
            </a>


            <a
                href="external.html"
                class="menu-link"
            >
                <span class="menu-icon">📹</span>
                <span class="menu-name">외부 콘텐츠</span>
            </a>


            <a
                href="radio.html"
                class="menu-link"
            >
                <span class="menu-icon">📻</span>
                <span class="menu-name">라디오</span>
            </a>


            <a
                href="weverse.html"
                class="menu-link"
            >
                <span class="menu-icon">📶</span>
                <span class="menu-name">위버스 라이브</span>
            </a>


        </nav>

    </aside>



    <!-- =========================
         RIGHT CONTENT
    ========================= -->

    <main class="main-content">


        <!-- =========================
             MUSIC SHOW HEADER
        ========================= -->

        <header class="music-header">

            <h1>
                📺 음방 직캠
            </h1>


            <div class="filter-bar">


                <!-- 직캠 종류 -->

                <div class="filter-buttons">

                    <button
                        id="typeAll"
                        onclick="showType('all')"
                    >
                        전체
                    </button>

                    <button
                        id="typeGroup"
                        onclick="showType('group')"
                    >
                        그룹 직캠
                    </button>

                    <button
                        id="typeMember"
                        onclick="showType('member')"
                    >
                        멤버 직캠
                    </button>

                </div>


                <!-- 앨범 필터 -->

                <div
                    id="albumFilters"
                    class="filter-buttons"
                    style="display:none;"
                >

                    <button onclick="showAlbum('The Chase')">
                        The Chase
                    </button>

                    <button onclick="showAlbum('STYLE')">
                        STYLE
                    </button>

                    <button onclick="showAlbum('Pretty Please')">
                        Pretty Please
                    </button>

                    <button onclick="showAlbum('FOCUS')">
                        FOCUS
                    </button>

                    <button onclick="showAlbum('RUDE')">
                        RUDE
                    </button>

                    <button onclick="showAlbum('Lemon Tang')">
                        Lemon Tang
                    </button>

                    <button onclick="showAlbum('15-LOVE')">
                        15-LOVE
                    </button>

                </div>


                <!-- 멤버 필터 -->

                <div
                    id="memberFilters"
                    class="filter-buttons"
                    style="display:none;"
                >

                    <button onclick="showMember('지우')">
                        지우
                    </button>

                    <button onclick="showMember('카르멘')">
                        카르멘
                    </button>

                    <button onclick="showMember('유하')">
                        유하
                    </button>

                    <button onclick="showMember('스텔라')">
                        스텔라
                    </button>

                    <button onclick="showMember('주은')">
                        주은
                    </button>

                    <button onclick="showMember('에이나')">
                        에이나
                    </button>

                    <button onclick="showMember('이안')">
                        이안
                    </button>

                    <button onclick="showMember('예온')">
                        예온
                    </button>

                </div>


                <!-- 날짜 검색 -->

                <input
                    id="dateSearch"
                    placeholder="예: 250224"
                    oninput="searchByDate()"
                >

            </div>

        </header>



        <!-- =========================
             VIDEO LIST
        ========================= -->

        <div
            id="archiveGrid"
            class="archive-grid"
        ></div>


    </main>


</div>



<script>


/* =========================
   상태값
========================= */

let allVideos = [];

let currentType = "all";

let currentAlbum = "all";

let currentMember = "all";

let currentDate = "";


/* =========================
   영상 출력
========================= */

function renderVideos(videos){

    const grid =
        document.getElementById("archiveGrid");


    grid.innerHTML = "";


    if(videos.length === 0){

        grid.innerHTML = `
            <div class="empty-message">
                선택한 조건에 해당하는 직캠이 없습니다.
            </div>
        `;

        return;
    }


    videos.forEach(video => {

        const card =
            document.createElement("a");


        card.className =
            "archive-card";


        card.href =
            `https://www.youtube.com/watch?v=${video.videoId}`;


        card.target = "_blank";


        card.rel = "noopener noreferrer";


        card.innerHTML = `

            <img
                class="archive-thumb"
                src="https://img.youtube.com/vi/${video.videoId}/hqdefault.jpg"
                alt="${video.title}"
                loading="lazy"
            >


            <div class="archive-content">

                <div class="archive-title">
                    ${video.title}
                </div>


                <div class="archive-date">
                    ${video.date}
                </div>

            </div>

        `;


        grid.appendChild(card);

    });

}


/* =========================
   필터 적용
========================= */

function applyFilters(){

    let filtered =
        allVideos;


    /* -------------------------
       직캠 종류
    ------------------------- */

    if(currentType === "group"){

        filtered =
            filtered.filter(
                video => !video.member
            );

    }


    if(currentType === "member"){

        filtered =
            filtered.filter(
                video => video.member
            );

    }


    /* -------------------------
       앨범
    ------------------------- */

    if(currentAlbum !== "all"){

        filtered =
            filtered.filter(
                video =>
                    video.album === currentAlbum
            );

    }


    /* -------------------------
       멤버
    ------------------------- */

    if(currentMember !== "all"){

        filtered =
            filtered.filter(
                video =>
                    video.member === currentMember
            );

    }


    /* -------------------------
       날짜
    ------------------------- */

    if(currentDate !== ""){

        filtered =
            filtered.filter(video => {

                const compactDate =
                    video.date
                        .replaceAll("-", "")
                        .slice(2);


                return compactDate.includes(
                    currentDate
                );

            });

    }


    renderVideos(filtered);

}


/* =========================
   필터 표시 상태
========================= */

function updateFilterVisibility(){

    const albumFilters =
        document.getElementById(
            "albumFilters"
        );

    const memberFilters =
        document.getElementById(
            "memberFilters"
        );


    albumFilters.style.display =
        currentType === "member"
            ? "none"
            : "flex";


    memberFilters.style.display =
        currentType === "group"
            ? "none"
            : "flex";

}


/* =========================
   상단 버튼 상태
========================= */

function updateTypeButtons(){

    document
        .getElementById("typeAll")
        .classList.toggle(
            "active",
            currentType === "all"
        );


    document
        .getElementById("typeGroup")
        .classList.toggle(
            "active",
            currentType === "group"
        );


    document
        .getElementById("typeMember")
        .classList.toggle(
            "active",
            currentType === "member"
        );

}


/* =========================
   직캠 종류 선택
========================= */

function showType(type){

    currentType =
        type;


    currentAlbum =
        "all";


    currentMember =
        "all";


    /*
       전체 선택 시 날짜 검색 초기화
    */

    if(type === "all"){

        currentDate =
            "";

        document.getElementById(
            "dateSearch"
        ).value =
            "";

    }


    updateFilterVisibility();

    updateTypeButtons();

    applyFilters();

}


/* =========================
   앨범 선택
========================= */

function showAlbum(album){

    currentType =
        "group";


    currentAlbum =
        album;


    currentMember =
        "all";


    updateFilterVisibility();

    updateTypeButtons();

    applyFilters();

}


/* =========================
   멤버 선택
========================= */

function showMember(member){

    currentType =
        "member";


    currentMember =
        member;


    currentAlbum =
        "all";


    updateFilterVisibility();

    updateTypeButtons();

    applyFilters();

}


/* =========================
   날짜 검색
========================= */

function searchByDate(){

    currentDate =
        document
            .getElementById("dateSearch")
            .value
            .trim();


    applyFilters();

}


/* =========================
   video.json 불러오기
========================= */

async function loadVideos(){

    try{

        const response =
            await fetch("video.json");


        if(!response.ok){
            throw new Error(
                `HTTP ${response.status}`
            );
        }


        allVideos =
            await response.json();


        updateFilterVisibility();

        updateTypeButtons();

        applyFilters();

    }

    catch(error){

        console.error(
            "video.json 불러오기 실패:",
            error
        );


        document.getElementById(
            "archiveGrid"
        ).innerHTML = `

            <div class="empty-message">

                영상 데이터를 불러오지 못했습니다.

            </div>

        `;

    }

}


/* =========================
   시작
========================= */

loadVideos();


</script>


</body>
</html>
