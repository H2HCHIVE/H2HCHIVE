<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>콘텐츠 | H2HCHIVE</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#f5f6f8;
    color:#222;
}


/* =========================
   LAYOUT
========================= */

.page{
    max-width:900px;
    min-height:100vh;
    margin:0 auto;

    display:flex;
}


/* =========================
   LEFT MENU
========================= */

.sidebar{
    width:190px;
    flex-shrink:0;

    padding:28px 16px;

    border-right:1px solid #e5e5e5;

    background:#f5f6f8;
}

.sidebar-title{
    padding:0 8px 24px;

    font-size:1.45rem;
    font-weight:700;
}

.menu-list{
    display:flex;
    flex-direction:column;
    gap:4px;
}

.menu-link{
    display:flex;
    align-items:center;

    gap:10px;

    padding:12px 10px;

    border-radius:12px;

    color:#555;
    text-decoration:none;

    font-size:.9rem;
    font-weight:500;

    transition:.2s;
}

.menu-link:hover{
    background:#fff;
    color:#222;
}

.menu-link.active{
    background:#fff;
    color:#222;
    font-weight:600;

    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.menu-icon{
    width:24px;

    text-align:center;

    font-size:1rem;
}

.menu-name{
    white-space:nowrap;
}


/* =========================
   CONTENT
========================= */

.content{
    flex:1;
    min-width:0;

    padding:28px 24px 60px;
}

.content-header{
    margin-bottom:28px;
}

.content-title{
    font-size:1.8rem;
    font-weight:700;
}


/* =========================
   CONTENT AREA
========================= */

.content-empty{
    padding:28px 0;

    color:#888;

    font-size:.9rem;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .page{
        max-width:100%;
    }

    .sidebar{
        width:145px;

        padding:24px 10px;
    }

    .sidebar-title{
        padding:0 8px 22px;

        font-size:1.25rem;
    }

    .menu-link{
        padding:11px 7px;

        gap:7px;

        font-size:.82rem;
    }

    .menu-icon{
        width:22px;
        font-size:.95rem;
    }

    .content{
        padding:24px 16px 50px;
    }

    .content-title{
        font-size:1.5rem;
    }

}
</style>

</head>


<body>


<div class="page">


    <!-- =========================
         LEFT MENU
    ========================= -->

    <aside class="sidebar">

        <div class="sidebar-title">
            콘텐츠
        </div>


        <nav class="menu-list">


            <a
                href="musicshow.html"
                class="menu-link active"
            >
                <span class="menu-icon">📺</span>
                <span class="menu-name">음악방송</span>
            </a>


            <a
                href="selfcontent.html"
                class="menu-link"
            >
                <span class="menu-icon">▶️</span>
                <span class="menu-name">자체 콘텐츠</span>
            </a>


            <a
                href="external.html"
                class="menu-link"
            >
                <span class="menu-icon">📹</span>
                <span class="menu-name">외부 콘텐츠</span>
            </a>


            <a
                href="radio.html"
                class="menu-link"
            >
                <span class="menu-icon">📻</span>
                <span class="menu-name">라디오</span>
            </a>


            <a
                href="weverse.html"
                class="menu-link"
            >
                <span class="menu-icon">📶</span>
                <span class="menu-name">위버스 라이브</span>
            </a>


        </nav>

    </aside>



    <!-- =========================
         CONTENT
    ========================= -->

    <main class="content">

        <header class="content-header">

            <div class="content-title">
                음악방송
            </div>

        </header>


        <div class="content-empty">
            음악방송 콘텐츠를 준비 중입니다.
        </div>


    </main>


</div>


</body>
</html>
