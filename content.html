<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>콘텐츠 | H2HCHIVE</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#f5f6f8;
    color:#222;
}


/* =========================
   CONTAINER
========================= */

.container{
    max-width:420px;
    min-height:100vh;
    margin:0 auto;
    padding:24px 16px 60px;
}


/* =========================
   HEADER
========================= */

.header{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:28px;
}

.menu-btn{
    width:42px;
    height:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:0;
    border-radius:12px;

    background:#fff;
    color:#222;

    font-size:21px;
    cursor:pointer;

    box-shadow:0 3px 10px rgba(0,0,0,.07);
}

.menu-btn:active{
    opacity:.6;
}

.title{
    font-size:2rem;
    font-weight:700;
}


/* =========================
   CONTENT
========================= */

.content-box{
    background:#fff;
    border-radius:18px;
    padding:22px 18px;

    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.content-title{
    font-size:1.15rem;
    font-weight:700;
    margin-bottom:8px;
}

.content-description{
    font-size:.9rem;
    line-height:1.6;
    color:#888;
}


/* =========================
   OVERLAY
========================= */

.menu-overlay{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.28);

    opacity:0;
    visibility:hidden;

    transition:
        opacity .25s ease,
        visibility .25s ease;

    z-index:9998;
}

.menu-overlay.open{
    opacity:1;
    visibility:visible;
}


/* =========================
   SIDE MENU
========================= */

.side-menu{
    position:fixed;
    top:0;
    left:0;

    width:min(300px, 82vw);
    height:100vh;

    background:#fff;

    transform:translateX(-100%);
    transition:transform .28s ease;

    z-index:9999;

    box-shadow:4px 0 18px rgba(0,0,0,.12);

    padding:24px 18px;
}

.side-menu.open{
    transform:translateX(0);
}


/* =========================
   MENU HEADER
========================= */

.side-menu-header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 2px 22px;

    border-bottom:1px solid #eee;
}

.side-menu-title{
    font-size:1.3rem;
    font-weight:700;
}

.close-btn{
    width:38px;
    height:38px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:0;
    background:none;

    color:#555;
    font-size:24px;

    cursor:pointer;
}

.close-btn:active{
    opacity:.5;
}


/* =========================
   MENU LIST
========================= */

.menu-list{
    display:flex;
    flex-direction:column;

    padding-top:10px;
}

.menu-link{
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:17px 4px;

    border-bottom:1px solid #eee;

    text-decoration:none;
    color:#222;

    font-size:1rem;
    font-weight:500;

    transition:.2s;
}

.menu-link:last-child{
    border-bottom:none;
}

.menu-link:active{
    opacity:.6;
    padding-left:8px;
}

.menu-name{
    display:flex;
    align-items:center;
    gap:11px;
}

.menu-icon{
    width:26px;
    text-align:center;
    font-size:1.1rem;
}

.menu-arrow{
    color:#aaa;
    font-size:1rem;
}


/* =========================
   BACKGROUND SCROLL LOCK
========================= */

body.menu-open{
    overflow:hidden;
}
</style>

</head>


<body>


<!-- =========================
     SIDE MENU
========================= -->

<div
    class="menu-overlay"
    id="menu-overlay"
    onclick="closeMenu()"
></div>


<nav
    class="side-menu"
    id="side-menu"
>

    <div class="side-menu-header">

        <div class="side-menu-title">
            콘텐츠
        </div>

        <button
            type="button"
            class="close-btn"
            onclick="closeMenu()"
            aria-label="메뉴 닫기"
        >
            ×
        </button>

    </div>


    <div class="menu-list">


        <!-- 음악방송 -->

        <a
            href="musicshow.html"
            class="menu-link"
        >

            <div class="menu-name">

                <span class="menu-icon">
                    📺
                </span>

                <span>
                    음악방송
                </span>

            </div>

            <span class="menu-arrow">
                →
            </span>

        </a>


        <!-- 자체 콘텐츠 -->

        <a
            href="selfcontent.html"
            class="menu-link"
        >

            <div class="menu-name">

                <span class="menu-icon">
                    🎬
                </span>

                <span>
                    자체 콘텐츠
                </span>

            </div>

            <span class="menu-arrow">
                →
            </span>

        </a>


        <!-- 외부 콘텐츠 -->

        <a
            href="external.html"
            class="menu-link"
        >

            <div class="menu-name">

                <span class="menu-icon">
                    📡
                </span>

                <span>
                    외부 콘텐츠
                </span>

            </div>

            <span class="menu-arrow">
                →
            </span>

        </a>


        <!-- 라디오 -->

        <a
            href="radio.html"
            class="menu-link"
        >

            <div class="menu-name">

                <span class="menu-icon">
                    🎙️
                </span>

                <span>
                    라디오
                </span>

            </div>

            <span class="menu-arrow">
                →
            </span>

        </a>


        <!-- 위버스 라이브 -->

        <a
            href="weverse.html"
            class="menu-link"
        >

            <div class="menu-name">

                <span class="menu-icon">
                    🔴
                </span>

                <span>
                    위버스 라이브
                </span>

            </div>

            <span class="menu-arrow">
                →
            </span>

        </a>


    </div>

</nav>



<!-- =========================
     MAIN
========================= -->

<div class="container">


    <header class="header">

        <button
            type="button"
            class="menu-btn"
            onclick="openMenu()"
            aria-label="콘텐츠 메뉴 열기"
        >
            ☰
        </button>

        <div class="title">
            콘텐츠
        </div>

    </header>


    <div class="content-box">

        <div class="content-title">
            H2H 콘텐츠
        </div>

        <div class="content-description">
            음악방송, 자체 콘텐츠, 외부 콘텐츠,
            라디오, 위버스 라이브를 한곳에서 확인할 수 있습니다.
        </div>

    </div>

</div>



<script>

/* =========================
   MENU
========================= */

function openMenu(){

    document
        .getElementById("side-menu")
        .classList.add("open");

    document
        .getElementById("menu-overlay")
        .classList.add("open");

    document.body.classList.add("menu-open");

}


function closeMenu(){

    document
        .getElementById("side-menu")
        .classList.remove("open");

    document
        .getElementById("menu-overlay")
        .classList.remove("open");

    document.body.classList.remove("menu-open");

}


/* =========================
   ESC로 닫기
========================= */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Escape"){
            closeMenu();
        }

    }
);

</script>


</body>
</html>
