<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>콘텐츠 | H2HCHIVE</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    min-height:100%;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#f5f6f8;
    color:#222;
}


/* =========================
   전체 레이아웃
========================= */

.page{
    width:100%;
    min-height:100vh;

    display:flex;
}


/* =========================
   왼쪽 메뉴
========================= */

.sidebar{
    width:190px;
    min-height:100vh;

    flex-shrink:0;

    padding:28px 16px;

    background:#f5f6f8;
    border-right:1px solid #e5e5e5;
}

.sidebar-title{
    padding:0 8px 24px;

    font-size:1.45rem;
    font-weight:700;
}

.menu-list{
    display:flex;
    flex-direction:column;
    gap:4px;
}

.menu-link{
    display:flex;
    align-items:center;

    gap:10px;

    padding:12px 10px;

    border-radius:12px;

    color:#555;
    text-decoration:none;

    font-size:.9rem;
    font-weight:500;

    transition:.2s;
}

.menu-link:hover{
    background:#fff;
    color:#222;
}

.menu-link.active{
    background:#fff;
    color:#222;
    font-weight:600;

    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.menu-icon{
    width:24px;

    text-align:center;

    font-size:1rem;
}

.menu-name{
    white-space:nowrap;
}


/* =========================
   오른쪽 콘텐츠
========================= */

.content{
    flex:1;
    min-width:0;
    min-height:100vh;
}


/* =========================
   음악방송
========================= */

.content-frame{
    display:block;

    width:100%;
    height:100vh;

    border:0;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .sidebar{
        width:145px;

        padding:24px 10px;
    }

    .sidebar-title{
        padding:0 8px 22px;

        font-size:1.25rem;
    }

    .menu-link{
        padding:11px 7px;

        gap:7px;

        font-size:.82rem;
    }

    .menu-icon{
        width:22px;
        font-size:.95rem;
    }

    .content-frame{
        height:100vh;
    }

}
</style>

</head>


<body>


<div class="page">


    <!-- =========================
         LEFT MENU
    ========================= -->

    <aside class="sidebar">

        <div class="sidebar-title">
            콘텐츠
        </div>


        <nav class="menu-list">


            <a
                href="content.html"
                class="menu-link active"
            >
                <span class="menu-icon">📺</span>
                <span class="menu-name">음악방송</span>
            </a>


            <a
                href="selfcontent.html"
                class="menu-link"
            >
                <span class="menu-icon">▶️</span>
                <span class="menu-name">자체 콘텐츠</span>
            </a>


            <a
                href="external.html"
                class="menu-link"
            >
                <span class="menu-icon">📹</span>
                <span class="menu-name">외부 콘텐츠</span>
            </a>


            <a
                href="radio.html"
                class="menu-link"
            >
                <span class="menu-icon">📻</span>
                <span class="menu-name">라디오</span>
            </a>


            <a
                href="weverse.html"
                class="menu-link"
            >
                <span class="menu-icon">📶</span>
                <span class="menu-name">위버스 라이브</span>
            </a>


        </nav>

    </aside>



    <!-- =========================
         RIGHT CONTENT
========================= -->

    <main class="content">

        <iframe
            src="musicshow.html"
            class="content-frame"
            title="음악방송"
        ></iframe>

    </main>


</div>


</body>
</html>
