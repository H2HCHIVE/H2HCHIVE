<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>콘텐츠 | H2HCHIVE</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#f5f6f8;
    color:#222;
}

.container{
    max-width:420px;
    min-height:100vh;
    margin:0 auto;
    padding:24px 16px 60px;
}


/* =========================
   HEADER
========================= */

.header{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:30px;
}

.menu-btn{
    width:36px;
    height:36px;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:0;
    border:0;
    background:none;

    color:#222;
    font-size:21px;
    cursor:pointer;
}

.menu-btn:active{
    opacity:.5;
}

.title{
    font-size:1.8rem;
    font-weight:700;
}


/* =========================
   SIDE MENU
========================= */

.overlay{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.15);

    opacity:0;
    visibility:hidden;

    transition:.25s;

    z-index:9998;
}

.overlay.open{
    opacity:1;
    visibility:visible;
}

.side-menu{
    position:fixed;
    top:0;
    left:0;

    width:280px;
    max-width:80vw;
    height:100vh;

    padding:28px 22px;

    background:#fff;

    transform:translateX(-100%);
    transition:transform .28s ease;

    box-shadow:4px 0 16px rgba(0,0,0,.08);

    z-index:9999;
}

.side-menu.open{
    transform:translateX(0);
}


/* =========================
   MENU HEADER
========================= */

.menu-header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:26px;
}

.menu-title{
    font-size:1.25rem;
    font-weight:700;
}

.close-btn{
    padding:4px;

    border:0;
    background:none;

    color:#777;
    font-size:22px;

    cursor:pointer;
}

.close-btn:active{
    opacity:.5;
}


/* =========================
   MENU LIST
========================= */

.menu-list{
    display:flex;
    flex-direction:column;
}

.menu-link{
    display:flex;
    align-items:center;

    gap:12px;

    padding:15px 2px;

    color:#222;
    text-decoration:none;

    font-size:1rem;
    font-weight:500;

    border-bottom:1px solid #eee;
}

.menu-link:last-child{
    border-bottom:none;
}

.menu-link:active{
    opacity:.5;
}

.menu-icon{
    width:26px;
    text-align:center;
    font-size:1.1rem;
}

.menu-name{
    flex:1;
}


/* =========================
   MAIN CONTENT
========================= */

.content-card{
    background:#fff;

    border-radius:18px;

    padding:22px 20px;

    box-shadow:0 4px 12px rgba(0,0,0,.07);
}

.content-card-title{
    font-size:1.05rem;
    font-weight:600;
    margin-bottom:7px;
}

.content-card-text{
    color:#888;
    font-size:.88rem;
    line-height:1.5;
}

</style>
</head>


<body>


<!-- =========================
     OVERLAY
========================= -->

<div
    class="overlay"
    id="overlay"
    onclick="closeMenu()"
></div>


<!-- =========================
     SIDE MENU
========================= -->

<nav
    class="side-menu"
    id="sideMenu"
>

    <div class="menu-header">

        <div class="menu-title">
            콘텐츠
        </div>

        <button
            type="button"
            class="close-btn"
            onclick="closeMenu()"
        >
            ×
        </button>

    </div>


    <div class="menu-list">


        <a
            href="musicshow.html"
            class="menu-link"
        >
            <span class="menu-icon">📺</span>
            <span class="menu-name">음악방송</span>
        </a>


        <a
            href="selfcontent.html"
            class="menu-link"
        >
            <span class="menu-icon">▶️</span>
            <span class="menu-name">자체 콘텐츠</span>
        </a>


        <a
            href="external.html"
            class="menu-link"
        >
            <span class="menu-icon">📹</span>
            <span class="menu-name">외부 콘텐츠</span>
        </a>


        <a
            href="radio.html"
            class="menu-link"
        >
            <span class="menu-icon">📻</span>
            <span class="menu-name">라디오</span>
        </a>


        <a
            href="weverse.html"
            class="menu-link"
        >
            <span class="menu-icon">📶</span>
            <span class="menu-name">위버스 라이브</span>
        </a>


    </div>

</nav>



<!-- =========================
     MAIN
========================= -->

<div class="container">


    <header class="header">

        <button
            type="button"
            class="menu-btn"
            onclick="openMenu()"
            aria-label="콘텐츠 메뉴"
        >
            ☰
        </button>

        <div class="title">
            콘텐츠
        </div>

    </header>


    <div class="content-card">

        <div class="content-card-title">
            H2H 콘텐츠
        </div>

        <div class="content-card-text">
            왼쪽 메뉴에서 원하는 콘텐츠를 선택해주세요.
        </div>

    </div>


</div>



<script>

function openMenu(){

    document
        .getElementById("sideMenu")
        .classList.add("open");

    document
        .getElementById("overlay")
        .classList.add("open");

    document.body.style.overflow="hidden";
}


function closeMenu(){

    document
        .getElementById("sideMenu")
        .classList.remove("open");

    document
        .getElementById("overlay")
        .classList.remove("open");

    document.body.style.overflow="";
}


document.addEventListener(
    "keydown",
    function(event){

        if(event.key==="Escape"){
            closeMenu();
        }

    }
);

</script>


</body>
</html>
