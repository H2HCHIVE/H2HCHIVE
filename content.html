<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>콘텐츠 | H2HCHIVE</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#f5f6f8;
    color:#222;
}


/* =========================
   HEADER
========================= */

.header{
    display:flex;
    align-items:center;

    height:72px;

    padding:0 16px;

    background:#f5f6f8;
}

.menu-btn{
    width:36px;
    height:36px;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:0;

    border:0;
    background:none;

    color:#222;
    font-size:21px;

    cursor:pointer;
}

.menu-btn:active{
    opacity:.5;
}

.title{
    margin-left:8px;

    font-size:1.8rem;
    font-weight:700;
}


/* =========================
   OVERLAY
========================= */

.overlay{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.18);

    opacity:0;
    visibility:hidden;

    transition:
        opacity .25s ease,
        visibility .25s ease;

    z-index:9998;
}

.overlay.open{
    opacity:1;
    visibility:visible;
}


/* =========================
   SIDE MENU
========================= */

.side-menu{
    position:fixed;

    top:0;
    left:0;

    width:280px;
    max-width:82vw;
    height:100vh;

    padding:24px 20px;

    background:#fff;

    transform:translateX(-100%);

    transition:transform .28s ease;

    z-index:9999;

    box-shadow:4px 0 18px rgba(0,0,0,.08);
}

.side-menu.open{
    transform:translateX(0);
}


/* =========================
   MENU HEADER
========================= */

.menu-header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    height:40px;

    margin-bottom:20px;
}

.menu-title{
    font-size:1.25rem;
    font-weight:700;
}

.close-btn{
    width:36px;
    height:36px;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:0;

    border:0;
    background:none;

    color:#555;
    font-size:22px;

    cursor:pointer;
}

.close-btn:active{
    opacity:.5;
}


/* =========================
   MENU LIST
========================= */

.menu-list{
    display:flex;
    flex-direction:column;
}

.menu-link{
    display:flex;
    align-items:center;

    gap:12px;

    padding:16px 2px;

    color:#222;
    text-decoration:none;

    font-size:1rem;
    font-weight:500;

    border-bottom:1px solid #eee;
}

.menu-link:last-child{
    border-bottom:none;
}

.menu-link:active{
    opacity:.5;
}

.menu-icon{
    width:28px;

    text-align:center;

    font-size:1.1rem;
}

.menu-name{
    flex:1;
}


/* =========================
   MOBILE
========================= */

@media(max-width:420px){

    .header{
        height:68px;
    }

    .title{
        font-size:1.7rem;
    }

    .side-menu{
        width:270px;
    }

}
</style>

</head>


<body>


<!-- =========================
     SIDE MENU
========================= -->

<div
    class="overlay"
    id="overlay"
    onclick="closeMenu()"
></div>


<nav
    class="side-menu"
    id="sideMenu"
>

    <div class="menu-header">

        <div class="menu-title">
            콘텐츠
        </div>

        <button
            type="button"
            class="close-btn"
            onclick="closeMenu()"
            aria-label="메뉴 닫기"
        >
            ×
        </button>

    </div>


    <div class="menu-list">


        <a
            href="musicshow.html"
            class="menu-link"
        >
            <span class="menu-icon">📺</span>
            <span class="menu-name">음악방송</span>
        </a>


        <a
            href="selfcontent.html"
            class="menu-link"
        >
            <span class="menu-icon">▶️</span>
            <span class="menu-name">자체 콘텐츠</span>
        </a>


        <a
            href="external.html"
            class="menu-link"
        >
            <span class="menu-icon">📹</span>
            <span class="menu-name">외부 콘텐츠</span>
        </a>


        <a
            href="radio.html"
            class="menu-link"
        >
            <span class="menu-icon">📻</span>
            <span class="menu-name">라디오</span>
        </a>


        <a
            href="weverse.html"
            class="menu-link"
        >
            <span class="menu-icon">📶</span>
            <span class="menu-name">위버스 라이브</span>
        </a>


    </div>

</nav>



<!-- =========================
     HEADER
========================= -->

<header class="header">

    <button
        type="button"
        class="menu-btn"
        onclick="openMenu()"
        aria-label="콘텐츠 메뉴 열기"
    >
        ☰
    </button>

    <div class="title">
        콘텐츠
    </div>

</header>



<script>

function openMenu(){

    document
        .getElementById("sideMenu")
        .classList.add("open");

    document
        .getElementById("overlay")
        .classList.add("open");

    document.body.style.overflow="hidden";

}


function closeMenu(){

    document
        .getElementById("sideMenu")
        .classList.remove("open");

    document
        .getElementById("overlay")
        .classList.remove("open");

    document.body.style.overflow="";

}


/* ESC로 닫기 */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Escape"){
            closeMenu();
        }

    }
);

</script>


</body>
</html>
