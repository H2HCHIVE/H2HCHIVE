<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MV | H2HCHIVE</title>

<style>
body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#f5f6f8;
    color:#222;
}

.container{
    max-width:420px;
    margin:0 auto;
    padding:24px 16px 60px;
}


/* 뒤로가기 */

.back-btn{
    display:inline-block;
    text-decoration:none;
    color:#222;
    font-size:1.5rem;
    margin-bottom:20px;
}


/* 제목 */

.title{
    font-size:2rem;
    font-weight:700;
    margin-bottom:24px;
}


/* =========================
   MV CARD
   ========================= */

.mv-list{
    display:flex;
    flex-direction:column;
    gap:24px;
}

.mv-card{
    background:#fff;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}


/* 영상 */

.mv-video{
    width:100%;
    aspect-ratio:16 / 9;
    background:#000;
}

.mv-video iframe{
    width:100%;
    height:100%;
    border:0;
    display:block;
}


/* 곡 제목 */

.mv-name{
    padding:14px 16px 16px;

    font-size:1rem;
    font-weight:700;

    color:#222;
}


/* 발매일 */

.mv-date{
    margin-left:5px;

    font-size:.8rem;
    font-weight:500;

    color:#888;
}


/* 모바일 */

@media(max-width:360px){

    .container{
        padding-left:12px;
        padding-right:12px;
    }

    .mv-list{
        gap:20px;
    }

    .mv-card{
        border-radius:16px;
    }

}
</style>
</head>

<body>
