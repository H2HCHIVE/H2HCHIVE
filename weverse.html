<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>위버스 라이브 | H2HCHIVE</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    min-height:100%;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#f5f6f8;
    color:#222;
}


/* =========================
   콘텐츠
========================= */

.content{
    width:100%;
    min-height:100vh;
}

.content-inner{
    width:100%;
    max-width:900px;

    margin:0 auto;

    padding:24px 16px 60px;
}


/* =========================
   상단 제목
========================= */

.main-title{
    margin-bottom:14px;

    padding-bottom:10px;

    border-bottom:1px solid #ddd;
}

.main-title h1{
    display:inline-block;

    position:relative;

    margin:0;

    padding:0 0 10px;

    font-size:1.1rem;
    font-weight:700;
}

.main-title h1::after{
    content:"";

    position:absolute;

    left:0;
    right:0;
    bottom:-11px;

    height:2px;

    background:#89CFF0;
}


/* =========================
   카테고리
========================= */

.category-list{
    display:flex;
    flex-direction:column;

    max-height:126px;

    overflow-y:auto;

    margin-bottom:14px;

    border:1px solid #e1e1e1;
    border-radius:10px;

    background:#fff;

    scrollbar-width:thin;
    scrollbar-color:#d5d5d5 transparent;
}

.category-list::-webkit-scrollbar{
    width:4px;
}

.category-list::-webkit-scrollbar-track{
    background:transparent;
}

.category-list::-webkit-scrollbar-thumb{
    background:#d5d5d5;
    border-radius:999px;
}


/* =========================
   카테고리 버튼
========================= */

.category{
    flex-shrink:0;

    width:100%;

    min-height:42px;

    padding:10px 12px;

    border:0;
    border-bottom:1px solid #eee;

    background:#fff;

    color:#777;

    font-family:inherit;
    font-size:.82rem;
    font-weight:500;

    text-align:left;

    cursor:pointer;

    transition:.15s;
}

.category:last-child{
    border-bottom:0;
}

.category:hover{
    background:#fafafa;
    color:#222;
}

.category.active{
    background:#f8fcff;

    color:#222;

    font-weight:600;
}

.category.active::before{
    content:"";

    display:inline-block;

    width:4px;
    height:4px;

    margin-right:7px;

    vertical-align:middle;

    border-radius:50%;

    background:#89CFF0;
}


/* =========================
   검색 / 정렬
========================= */

.control-area{
    display:flex;

    gap:8px;

    margin-bottom:16px;
}

.search-area{
    display:flex;

    flex:1;

    gap:8px;

    min-width:0;
}

.search-area input{
    width:100%;
    min-width:0;

    padding:10px 11px;

    border:1px solid #ddd;
    border-radius:9px;

    background:#fff;

    color:#222;

    font-family:inherit;
    font-size:.8rem;

    outline:none;

    transition:.2s;
}

.search-area input:focus{
    border-color:#b9dff0;
}

.search-area input::placeholder{
    color:#aaa;
}


/* =========================
   정렬
========================= */

.sort-select{
    flex-shrink:0;

    padding:10px 10px;

    border:1px solid #ddd;
    border-radius:9px;

    background:#fff;

    color:#555;

    font-family:inherit;
    font-size:.75rem;

    outline:none;

    cursor:pointer;
}


/* =========================
   콘텐츠 영역
========================= */

.content-area{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:10px;
}


/* =========================
   콘텐츠 카드
========================= */

.content-card{
    display:block;

    overflow:hidden;

    background:#fff;

    border-radius:13px;

    text-decoration:none;
    color:#222;

    box-shadow:
        0 2px 7px rgba(0,0,0,.05);

    transition:.15s;
}

.content-card:hover{
    transform:translateY(-1px);

    box-shadow:
        0 4px 10px rgba(0,0,0,.07);
}


/* =========================
   썸네일
========================= */

.thumbnail{
    position:relative;

    width:100%;

    aspect-ratio:16 / 9;

    overflow:hidden;

    background:#eee;
}

.thumbnail img{
    display:block;

    width:100%;
    height:100%;

    object-fit:cover;
}


/* =========================
   카드 정보
========================= */

.content-card-inner{
    padding:12px 13px 13px;
}

.content-title{
    margin-bottom:5px;

    font-size:.78rem;
    font-weight:600;

    line-height:1.4;

    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;

    overflow:hidden;
}

.content-date{
    color:#999;

    font-size:.68rem;
}


/* =========================
   결과 없음
========================= */

.empty{
    grid-column:1 / -1;

    padding:45px 10px;

    color:#999;

    font-size:.8rem;

    text-align:center;
}


/* =========================
   모바일
========================= */

@media(max-width:600px){

    .control-area{
        flex-direction:column;
    }

    .search-area{
        width:100%;
    }

    .sort-select{
        width:100%;
    }

}


/* =========================
   작은 모바일
========================= */

@media(max-width:360px){

    .content-inner{
        padding-left:12px;
        padding-right:12px;
    }

    .category-list{
        max-height:240px;
    }

    .content-area{
        gap:8px;
    }

    .content-card-inner{
        padding:11px 12px 12px;
    }

    .content-title{
        font-size:.74rem;
    }

    .content-date{
        font-size:.65rem;
    }

}
</style>
</head>


<body>

<main class="content">

    <div class="content-inner">


        <!-- =========================
             제목
        ========================= -->

        <div class="main-title">

            <h1>
                위버스 라이브
            </h1>

        </div>


        <!-- =========================
             카테고리
        ========================= -->

        <div class="category-list">

            <button class="category active" data-category="전체">
                전체
            </button>

            <button class="category" data-category="단체">
                단체
            </button>

            <button class="category" data-category="지우">
                지우
            </button>

            <button class="category" data-category="카르멘">
                카르멘
            </button>

            <button class="category" data-category="유하">
                유하
            </button>

            <button class="category" data-category="스텔라">
                스텔라
            </button>

            <button class="category" data-category="주은">
                주은
            </button>

            <button class="category" data-category="에이나">
                에이나
            </button>

            <button class="category" data-category="이안">
                이안
            </button>

            <button class="category" data-category="예온">
                예온
            </button>

        </div>


        <!-- =========================
             검색 / 정렬
        ========================= -->

        <div class="control-area">

            <div class="search-area">

                <input
                    type="text"
                    id="titleSearch"
                    placeholder="제목 검색"
                >

                <input
                    type="text"
                    id="dateSearch"
                    placeholder="날짜 검색"
                >

            </div>


            <select id="sortSelect" class="sort-select">

                <option value="newest">
                    최신순
                </option>

                <option value="oldest">
                    오래된순
                </option>

            </select>

        </div>


        <!-- =========================
             콘텐츠
        ========================= -->

        <div class="content-area" id="contentArea">

            <div class="empty">
                콘텐츠를 불러오는 중입니다.
            </div>

        </div>

    </div>

</main>


<script>

/* =========================
   설정
========================= */

const JSON_URL = "weverse.json";


/* =========================
   DOM
========================= */

const contentArea = document.getElementById("contentArea");

const titleSearch = document.getElementById("titleSearch");

const dateSearch = document.getElementById("dateSearch");

const sortSelect = document.getElementById("sortSelect");

const categoryButtons =
    document.querySelectorAll(".category");


/* =========================
   상태
========================= */

let contentData = [];

let currentCategory = "전체";


/* =========================
   JSON 불러오기
========================= */

fetch(JSON_URL)

    .then(response => {

        if(!response.ok){
            throw new Error("JSON 불러오기 실패");
        }

        return response.json();

    })

    .then(data => {

        if(!Array.isArray(data)){
            throw new Error("JSON 형식이 올바르지 않습니다.");
        }

        contentData = data;

        render();

    })

    .catch(error => {

        console.error(error);

        contentArea.innerHTML = `
            <div class="empty">
                콘텐츠를 불러오지 못했습니다.
            </div>
        `;

    });


/* =========================
   카테고리 클릭
========================= */

categoryButtons.forEach(button => {

    button.addEventListener("click", () => {

        categoryButtons.forEach(item => {
            item.classList.remove("active");
        });

        button.classList.add("active");

        currentCategory =
            button.dataset.category;

        render();

    });

});


/* =========================
   검색
========================= */

titleSearch.addEventListener("input", render);

dateSearch.addEventListener("input", render);


/* =========================
   정렬
========================= */

sortSelect.addEventListener("change", render);


/* =========================
   렌더링
========================= */

function render(){

    let filtered =
        [...contentData];


    /* =========================
       카테고리 필터
    ========================= */

    if(currentCategory !== "전체"){

        filtered = filtered.filter(item => {

            if(!Array.isArray(item.category)){
                return false;
            }

            return item.category.includes(
                currentCategory
            );

        });

    }


    /* =========================
       제목 검색
    ========================= */

    const titleKeyword =
        titleSearch.value
            .trim()
            .toLowerCase();

    if(titleKeyword){

        filtered = filtered.filter(item => {

            const title =
                String(item.title || "")
                    .toLowerCase();

            return title.includes(titleKeyword);

        });

    }


    /* =========================
       날짜 검색
    ========================= */

    const dateKeyword =
        dateSearch.value
            .trim()
            .toLowerCase();

    if(dateKeyword){

        filtered = filtered.filter(item => {

            const date =
                String(item.date || "")
                    .toLowerCase();

            return date.includes(dateKeyword);

        });

    }


    /* =========================
       정렬
    ========================= */

    filtered.sort((a,b) => {

        const dateA =
            new Date(a.date);

        const dateB =
            new Date(b.date);

        if(sortSelect.value === "oldest"){

            return dateA - dateB;

        }

        return dateB - dateA;

    });


    /* =========================
       결과 없음
    ========================= */

    if(filtered.length === 0){

        contentArea.innerHTML = `
            <div class="empty">
                해당 콘텐츠가 없습니다.
            </div>
        `;

        return;

    }


    /* =========================
       카드 생성
    ========================= */

    contentArea.innerHTML =
        filtered.map(item => {

            const title =
                escapeHtml(item.title || "");

            const date =
                escapeHtml(item.date || "");

            const url =
                escapeHtml(item.url || "#");

            const thumbnail =
                escapeHtml(item.thumbnail || "");

            return `

                <a
                    class="content-card"
                    href="${url}"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    <div class="thumbnail">

                        <img
                            src="${thumbnail}"
                            alt=""
                            loading="lazy"
                            onerror="this.style.display='none';"
                        >

                    </div>


                    <div class="content-card-inner">

                        <div class="content-title">
                            ${title}
                        </div>

                        <div class="content-date">
                            ${date}
                        </div>

                    </div>

                </a>

            `;

        }).join("");

}


/* =========================
   HTML 이스케이프
========================= */

function escapeHtml(value){

    return String(value)

        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
