<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lemon Tang 응원법 | H2HCHIVE</title>

<style>
body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#f5f6f8;
    color:#222;
}

.container{
    max-width:420px;
    margin:0 auto;
    padding:24px 16px 60px;
}

.back-btn{
    display:inline-block;
    text-decoration:none;
    color:#222;
    font-size:1.5rem;
    margin-bottom:20px;
}

.title{
    font-size:2rem;
    font-weight:700;
    margin-bottom:24px;
}

/* 응원법 영상 */
.cheer-video{
    width:100%;
    aspect-ratio:16 / 9;
    background:#000;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.cheer-video iframe{
    width:100%;
    height:100%;
    border:0;
    display:block;
}

/* 응원법 가이드 */
.guide-toggle{
    width:100%;
    margin-top:24px;
    padding:14px 0;

    display:block;

    background:none;
    border:0;
    border-top:1px solid #ddd;
    border-bottom:1px solid #ddd;

    color:#222;
    font-family:inherit;
    font-size:.95rem;
    font-weight:500;

    cursor:pointer;
    text-align:left;
}

.guide-toggle:active{
    opacity:.6;
}

/* 가이드 이미지 */
.guide-content{
    display:none;
    padding-top:16px;
}

.guide-content.open{
    display:block;
}

.cheer-image{
    width:100%;
    border-radius:18px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
    display:block;
}
</style>
</head>

<body>

<div class="container">

    <a href="cheer.html" class="back-btn">←</a>

    <div class="title">Lemon Tang</div>

    <!-- 응원법 영상 -->
    <div class="cheer-video">
        <iframe
            src="https://www.youtube.com/embed/vzJnOHBAtCo"
            title="Lemon Tang 응원법 영상"
            loading="lazy"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
        </iframe>
    </div>

    <!-- 응원법 가이드 -->
    <button
        type="button"
        class="guide-toggle"
        onclick="toggleGuide()"
        id="guide-toggle"
    >
        ▼ 응원법 가이드
    </button>

    <div class="guide-content" id="guide-content">

        <img
            src="레몬탱 응원법.jpg"
            alt="Lemon Tang 응원법 가이드"
            class="cheer-image"
        >

    </div>

</div>

<script>
function toggleGuide(){

    const content = document.getElementById("guide-content");
    const button = document.getElementById("guide-toggle");

    content.classList.toggle("open");

    if(content.classList.contains("open")){
        button.textContent = "▲ 응원법 가이드";
    }else{
        button.textContent = "▼ 응원법 가이드";
    }
}
</script>

</body>
</html>
