<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스케줄 | H2HCHIVE</title>

<style>
body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#f5f6f8;
    color:#222;
    display:flex;
    justify-content:center;
}

.container{
    width:100%;
    max-width:420px;
    padding:14px 12px 30px;
}

/* 탭 */
.tabs{
    display:flex;
    gap:6px;
    margin-bottom:14px;
}

.tab{
    flex:1;
    text-align:center;
    padding:9px 0;
    background:white;
    border-radius:10px;
    font-size:0.85rem;
    cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,0.08);
    transition:.2s;
}

.tab.active{
    background:#89CFF0;
    color:white;
}

/* 헤더 */
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.month{
    font-size:1.3rem;
    font-weight:700;
}

.btn{
    font-size:1.6rem;
    border:none;
    background:none;
    cursor:pointer;
}

/* 필터 */
.filters{
    margin-bottom:12px;
}

.filter-group{
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:7px;
    overflow-x:auto;
    scrollbar-width:none;
}

.filter-group::-webkit-scrollbar{
    display:none;
}

.filter-label{
    flex-shrink:0;
    font-size:0.72rem;
    font-weight:600;
    color:#999;
    width:34px;
}

.filter-buttons{
    display:flex;
    gap:6px;
    flex-shrink:0;
}

.filter-buttons button{
    border:none;
    background:white;
    padding:6px 10px;
    border-radius:8px;
    font-size:0.8rem;
    cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,0.08);
    flex-shrink:0;
}

.filter-buttons button.active{
    background:#222;
    color:white;
}

/* 요일 */
.weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    text-align:center;
    font-size:0.85rem;
    font-weight:600;
    margin-bottom:6px;
}

.weekdays div:nth-child(1){ color:red; }
.weekdays div:nth-child(7){ color:blue; }

/* 캘린더 */
.calendar{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:8px;
}

.day{
    background:white;
    border-radius:12px;
    padding:12px 0;
    text-align:center;
    font-size:0.95rem;
    cursor:pointer;
    position:relative;
}

.dim{
    opacity:0.25;
}

.today{
    border:2px solid red;
    font-weight:700;
}

.dot{
    width:6px;
    height:6px;
    background:#999;
    border-radius:50%;
    margin:4px auto 0;
}

.today-dot{
    background:red;
}

/* 일정 박스 */
.event-box{
    margin-top:12px;
    background:white;
    border-radius:14px;
    padding:14px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
    min-height:50px;
}

/* 줄 강조 */
.line{
    display:block;
    margin-bottom:6px;
}

.highlight{
    font-weight:800;
    background:#fff3b0;
    padding:2px 4px;
    border-radius:6px;
}

.dim-line{
    opacity:0.25;
}

/* 리스트 / 하이라이트 카드 */
.list{
    background:white;
    border-radius:12px;
    padding:12px;
    margin-bottom:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
    white-space:pre-line;
}
</style>
</head>

<body>

<div class="container">

    <!-- 탭 -->
    <div class="tabs">
        <div class="tab active" onclick="setTab('calendar', this)">📅 캘린더</div>
        <div class="tab" onclick="setTab('list', this)">📋 전체 일정</div>
        <div class="tab" onclick="setTab('highlight', this)">🔥 하이라이트</div>
    </div>

    <div id="calendarView">

        <div class="header">
            <button class="btn" onclick="prev()">←</button>
            <div class="month" id="month"></div>
            <button class="btn" onclick="next()">→</button>
        </div>

        <!-- 필터 -->
        <div class="filters">

            <!-- 일정 종류 -->
            <div class="filter-group">
                <div class="filter-label">종류</div>

                <div class="filter-buttons">
                    <button onclick="setTypeFilter('all', this)" class="active">전체</button>
                    <button onclick="setTypeFilter('📺', this)">📺</button>
                    <button onclick="setTypeFilter('📻', this)">📻</button>
                    <button onclick="setTypeFilter('✒️', this)">✒️</button>
                    <button onclick="setTypeFilter('🎤', this)">🎤</button>
                    <button onclick="setTypeFilter('💿', this)">💿</button>
                    <button onclick="setTypeFilter('▶️', this)">▶️</button>
                    <button onclick="setTypeFilter('🗓', this)">🗓</button>
                </div>
            </div>

            <!-- 멤버 -->
            <div class="filter-group">
                <div class="filter-label">멤버</div>

                <div class="filter-buttons">
                    <button onclick="setMemberFilter('all', this)" class="active">전체</button>
                    <button onclick="setMemberFilter('🍓', this)">🍓</button>
                    <button onclick="setMemberFilter('🌴', this)">🌴</button>
                    <button onclick="setMemberFilter('🎀', this)">🎀</button>
                    <button onclick="setMemberFilter('🧁', this)">🧁</button>
                    <button onclick="setMemberFilter('👾', this)">👾</button>
                    <button onclick="setMemberFilter('🌻', this)">🌻</button>
                    <button onclick="setMemberFilter('🫛', this)">🫛</button>
                    <button onclick="setMemberFilter('😊', this)">😊</button>
                </div>
            </div>

        </div>

        <div class="weekdays">
            <div>일</div>
            <div>월</div>
            <div>화</div>
            <div>수</div>
            <div>목</div>
            <div>금</div>
            <div>토</div>
        </div>

        <div class="calendar" id="calendar"></div>

        <div class="event-box" id="eventBox">날짜를 클릭하세요</div>

    </div>

    <div id="listView" style="display:none;"></div>
    <div id="highlightView" style="display:none;"></div>

</div>


<script>

/* ==========================================
   기본 상태
========================================== */

let date = new Date();

/*
   현재 화면에서 사용하는 연도의 데이터
*/
let data = {};

/*
   이미 불러온 연도 데이터를 저장
*/
let loadedYears = {};

/*
   일정 종류 필터
*/
let typeFilter = 'all';

/*
   멤버 필터
*/
let memberFilter = 'all';


/* ==========================================
   연도별 JSON 불러오기
========================================== */

function loadYear(year){

    if(loadedYears[year]){
        data = loadedYears[year];
        render();
        return;
    }

    fetch(`./schedule-${year}.json`)
        .then(res => {

            if(!res.ok){
                throw new Error(`schedule-${year}.json 로딩 실패`);
            }

            return res.json();
        })
        .then(json => {

            loadedYears[year] = json;
            data = json;

            render();
        })
        .catch(err => {

            console.error(err);

            loadedYears[year] = {};
            data = {};

            render();
        });
}


/* ==========================================
   최초 실행
========================================== */

loadYear(date.getFullYear());


/* ==========================================
   탭
========================================== */

function setTab(t, el){

    document.querySelectorAll('.tab')
        .forEach(b => b.classList.remove('active'));

    el.classList.add('active');

    document.getElementById('calendarView').style.display =
        (t === 'calendar') ? 'block' : 'none';

    document.getElementById('listView').style.display =
        (t === 'list') ? 'block' : 'none';

    document.getElementById('highlightView').style.display =
        (t === 'highlight') ? 'block' : 'none';

    render();
}


/* ==========================================
   일정 종류 필터
========================================== */

function setTypeFilter(f, btn){

    typeFilter = f;

    document.querySelectorAll('.filter-group:nth-child(1) button')
        .forEach(b => b.classList.remove('active'));

    btn.classList.add('active');

    render();
}


/* ==========================================
   멤버 필터
========================================== */

function setMemberFilter(f, btn){

    memberFilter = f;

    document.querySelectorAll('.filter-group:nth-child(2) button')
        .forEach(b => b.classList.remove('active'));

    btn.classList.add('active');

    render();
}


/* ==========================================
   필터 매칭
========================================== */

function matchesFilter(text){

    const typeMatch =
        typeFilter === 'all' ||
        text.includes(typeFilter);

    const memberMatch =
        memberFilter === 'all' ||
        text.includes(memberFilter);

    return typeMatch && memberMatch;
}


/* ==========================================
   현재 필터가 적용되어 있는지
========================================== */

function hasActiveFilter(){

    return typeFilter !== 'all' ||
           memberFilter !== 'all';
}


/* ==========================================
   캘린더 렌더링
========================================== */

function render(){

    const y = date.getFullYear();
    const m = date.getMonth();

    document.getElementById('month').innerText =
        `${y}년 ${m + 1}월`;

    const cal = document.getElementById('calendar');

    cal.innerHTML = '';

    const first =
        new Date(y, m, 1).getDay();

    const last =
        new Date(y, m + 1, 0).getDate();


    /* 오늘 날짜 */

    const today = new Date();

    const todayKey =
        `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;


    /* 첫 날짜 전 빈칸 */

    for(let i = 0; i < first; i++){
        cal.innerHTML += `<div></div>`;
    }


    /* 날짜 */

    for(let d = 1; d <= last; d++){

        const key =
            `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

        const text = data[key] || '';

        const has = text.length > 0;

        const isToday = key === todayKey;

        const match = matchesFilter();


        cal.innerHTML += `
            <div
                class="day ${isToday ? 'today' : ''} ${hasActiveFilter() && !match ? 'dim' : ''}"
                onclick="show('${key}')"
            >
                ${d}

                ${
                    isToday
                    ? '<div class="dot today-dot"></div>'
                    : (has ? '<div class="dot"></div>' : '')
                }
            </div>
        `;
    }


    renderList();
    renderHighlight();


    /*
       현재 달이 오늘이 포함된 달이라면
       오늘 일정을 자동으로 표시
    */

    if(
        today.getFullYear() === y &&
        today.getMonth() === m
    ){

        show(todayKey);
    }
}


/* ==========================================
   날짜 클릭
========================================== */

function show(key){

    const text =
        data[key] || "일정 없음";

    const lines =
        text.split('\n');


    const html = lines.map(line => {

        const typeMatch =
            typeFilter === 'all' ||
            line.includes(typeFilter);

        const memberMatch =
            memberFilter === 'all' ||
            line.includes(memberFilter);

        const match =
            typeMatch && memberMatch;


        if(!hasActiveFilter()){
            return `<div class="line">${line}</div>`;
        }

        if(match){
            return `<div class="line highlight">${line}</div>`;
        }

        return `<div class="line dim-line">${line}</div>`;

    }).join('');


    document.getElementById('eventBox').innerHTML =
        html;
}


/* ==========================================
   전체 일정
========================================== */

function renderList(){

    const el =
        document.getElementById('listView');


    const currentMonth =
        `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}`;


    let html = '';


    Object.keys(data).forEach(k => {

        if(!k.startsWith(currentMonth)){
            return;
        }

        html += `
            <div class="list">
                <b>${k}</b><br>
                ${data[k]}
            </div>
        `;
    });


    el.innerHTML = html;
}


/* ==========================================
   하이라이트
========================================== */

function renderHighlight(){

    const el =
        document.getElementById('highlightView');


    const currentMonth =
        `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}`;


    let html = '';


    Object.keys(data).forEach(k => {

        if(!k.startsWith(currentMonth)){
            return;
        }


        const lines =
            data[k].split('\n');


        const filtered =
            lines.filter(line =>

                line.includes('💿') ||
                line.includes('🎉') ||
                line.includes('🍓') ||
                line.includes('🌴') ||
                line.includes('🎀') ||
                line.includes('🧁') ||
                line.includes('👾') ||
                line.includes('🌻') ||
                line.includes('🫛') ||
                line.includes('😊')

            );


        if(filtered.length > 0){

            html += `
                <div class="list">
                    <b>${k}</b><br>
                    ${filtered.join('\n')}
                </div>
            `;
        }

    });


    el.innerHTML = html;
}


/* ==========================================
   이전 달
========================================== */

function prev(){

    date.setMonth(date.getMonth() - 1);

    const year =
        date.getFullYear();


    if(!loadedYears[year]){

        loadYear(year);

    }else{

        data = loadedYears[year];

        render();
    }
}


/* ==========================================
   다음 달
========================================== */

function next(){

    date.setMonth(date.getMonth() + 1);

    const year =
        date.getFullYear();


    if(!loadedYears[year]){

        loadYear(year);

    }else{

        data = loadedYears[year];

        render();
    }
}

</script>

</body>
</html>
