<style>
body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#f5f6f8;
    color:#222;
}

.container{
max-width:420px;
margin:0 auto;
padding:24px 16px 60px;
}

.header{
margin-bottom:24px;
}

/* ===== DDAY ===== */
#dday-container{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
overflow:hidden;
}

#dday-box{
flex:1;
text-align:center;
padding:6px 0;
touch-action:pan-y;
}

#dday-box.slide-out-left{
animation:ddaySlideOutLeft .4s ease forwards;
}

#dday-box.slide-out-right{
animation:ddaySlideOutRight .4s ease forwards;
}

#dday-box.slide-in-left{
animation:ddaySlideInLeft .4s ease forwards;
}

#dday-box.slide-in-right{
animation:ddaySlideInRight .4s ease forwards;
}

@keyframes ddaySlideOutLeft{
from{
opacity:1;
transform:translateX(0);
}
to{
opacity:0;
transform:translateX(-30px);
}
}

@keyframes ddaySlideOutRight{
from{
opacity:1;
transform:translateX(0);
}
to{
opacity:0;
transform:translateX(30px);
}
}

@keyframes ddaySlideInLeft{
from{
opacity:0;
transform:translateX(30px);
}
to{
opacity:1;
transform:translateX(0);
}
}

@keyframes ddaySlideInRight{
from{
opacity:0;
transform:translateX(-30px);
}
to{
opacity:1;
transform:translateX(0);
}
}

#dday-text{
font-size:1.1rem;
font-weight:800;
}

#dday-label{
font-size:1.6rem;
font-weight:900;
}

/* ===== DDAY INDICATOR ===== */
#dday-indicator{
display:flex;
justify-content:center;
align-items:center;
gap:5px;
margin-top:8px;
}

.dday-dot{
font-size:8px;
line-height:1;
color:#d5d5d5;
transition:color .25s ease, transform .25s ease;
}

.dday-dot.active{
color:#89CFF0;
transform:scale(1.15);
}


/* grid */
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.card{
background:white;
border:none;
border-radius:18px;
padding:22px 12px;
box-shadow:0 4px 12px rgba(0,0,0,.08);
font-size:1rem;
font-weight:600;
cursor:pointer;
}

.wide{
grid-column:1 / -1;
}

/* mission */
.todo-section{
margin:25px 0 25px;
}

.todo-box{
background:white;
border-radius:18px;
padding:18px;
box-shadow:0 4px 12px rgba(0,0,0,.08);
line-height:2;
}

.todo-header{
font-size:1rem;
font-weight:700;
margin-bottom:10px;
padding-bottom:10px;
border-bottom:1px solid #eee;
}

.mission-row{
display:flex;
gap:10px;
margin:8px 0;
}

.mission-btn{
background:#222;
color:#fff;
text-decoration:none;
padding:5px 12px;
border-radius:999px;
font-size:.8rem;
font-weight:600;
}

.copyright{
    margin-top:16px;
    font-size:0.75rem;
    line-height:1.6;
    color:#777;
    text-align:center;
}

/* ===== OFFICIAL ACCOUNTS ===== */
.sns-section{
margin-top:20px;
text-align:center;
}

.sns-icons{
display:flex;
justify-content:center;
gap:18px;
margin-top:14px;
}

.sns-icons a img{
width:34px;
height:34px;
display:block;
}

.mvSwiper{
    width:100%;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.mvSwiper iframe{
    width:100%;
    height:220px;
    border:0;
    display:block;
}

.swiper-pagination{
    position:relative;
    margin-top:10px;
}


/* =========================================================
   ===== KST SYNC MINI PLAYER =============================
   ========================================================= */

.kst-player{
    position:fixed;

    left:12px;
    top:18%;

    width:158px;
    min-height:48px;

    background:rgba(255,255,255,.96);

    border:1px solid rgba(137,207,240,.45);
    border-radius:14px;

    box-shadow:0 4px 14px rgba(0,0,0,.10);

    display:flex;
    align-items:center;

    padding:7px 9px;

    box-sizing:border-box;

    z-index:9999;

    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);

    transition:
        opacity .25s ease,
        transform .25s ease;
}


/* 스크롤 중 */

.kst-player.scrolling{
    opacity:.28;
    transform:translateX(-2px);
}


/* 곡 정보 */

.kst-player-info{
    min-width:0;
    width:100%;

    overflow:hidden;
}


/* 곡 제목 + 곡 번호 */

.kst-player-song{
    display:flex;
    align-items:center;
    gap:6px;

    min-width:0;
}

.kst-player-title{
    min-width:0;

    font-size:12px;
    font-weight:700;

    line-height:15px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;

    color:#222;
}

.kst-player-number{
    font-size:8px;
    font-weight:600;

    color:#89CFF0;

    white-space:nowrap;
    flex-shrink:0;
}


/* 시간 */

.kst-player-time{
    font-size:10px;

    color:#888;

    line-height:13px;
}


/* 진행바 */

.kst-player-progress{
    width:100%;
    height:2px;

    margin-top:2px;

    background:#e5e5e5;

    border-radius:999px;

    overflow:hidden;
}

.kst-player-progress-bar{
    width:0%;
    height:100%;

    background:#89CFF0;

    transition:width .5s linear;
}


/* 작은 화면 */

@media(max-width:360px){

    .kst-player{
        width:148px;
        left:8px;
    }

}
</style>

<script>

/* ===== MISSION ===== */

function toKSTDate(str){
return new Date(str + "T00:00:00+09:00");
}

const mission = document.getElementById("mission-list");

const schedules = [
{
start:"2026-09-14",
end:"2026-09-20",
items:[
{
text:"🗳멜론 주간인기상 투표하기",
link:"http://into.melon.com/weeklyaward"
}
]
},
];

const now = new Date();

let currentMission = [];

for (const s of schedules) {

  const start = toKSTDate(s.start);
  const end = toKSTDate(s.end);

  end.setHours(23,59,59,999);

  if (now >= start && now <= end) {
    currentMission.push(...s.items);
  }

}

mission.innerHTML = currentMission.length

  ? currentMission.map(item => {

      if (typeof item === "string") {
        return `<div>✅ ${item}</div>`;
      }

      return `
        <div class="mission-row">
          <span>✅ ${item.text}</span>
          <a class="mission-btn" href="${item.link}" target="_blank">바로가기</a>
        </div>
      `;

    }).join("")

  : "진행 중인 미션이 없습니다.";


/* ===== DDAY ===== */

const ddayList = [
{ name:"🫛 이안 생일", date:"2026-10-09T00:00:00+09:00", type:"dday" },
{ name:"👾 주은 생일", date:"2026-12-03T00:00:00+09:00", type:"dday" },
{ name:"🌻 에이나 생일", date:"2026-12-20T00:00:00+09:00", type:"dday" },
{ name:"🎉 데뷔", date:"2025-02-24T00:00:00+09:00", type:"debut" },
];

let ddayIndex = 0;

const ddayBox = document.getElementById("dday-box");
const ddayText = document.getElementById("dday-text");
const ddayLabel = document.getElementById("dday-label");
const ddayIndicator = document.getElementById("dday-indicator");


/* ===== DDAY INDICATOR ===== */

ddayIndicator.innerHTML =
    ddayList.map((item, index) => {

        return `
            <span
                class="dday-dot ${index === 0 ? "active" : ""}"
                data-index="${index}"
            >●</span>
        `;

    }).join("");


function updateDdayIndicator(){

    const dots =
        ddayIndicator.querySelectorAll(".dday-dot");

    dots.forEach((dot, index) => {

        dot.classList.toggle(
            "active",
            index === ddayIndex
        );

    });

}


function updateDday(){

const item = ddayList[ddayIndex];

const now = new Date();
const target = new Date(item.date);

ddayText.textContent = item.name;

const diff = target - now;

const day = Math.ceil(
    diff / (1000 * 60 * 60 * 24)
);

if(item.type === "debut"){

const start = new Date(2025, 1, 24);

const today = new Date(
now.getFullYear(),
now.getMonth(),
now.getDate()
);

const diffDays =
Math.floor(
    (today - start) /
    (1000*60*60*24)
) + 1;

ddayLabel.textContent =
`D+${diffDays}`;

updateDdayIndicator();

return;

}

if(diff > 0){

ddayLabel.textContent =
`D-${day}`;

}else{

ddayLabel.textContent =
"D-DAY";

}

updateDdayIndicator();

}


/* =========================================================
   DDAY SLIDE
   ========================================================= */

let ddayAnimating = false;
let ddayTimer;

function resetDdayTimer(){

    clearTimeout(ddayTimer);

    ddayTimer = setTimeout(function(){

        moveDday(1);

    },10000);

}


function moveDday(dir = 1){

    /*
       애니메이션 중에는
       중복 실행 방지
    */

    if(ddayAnimating){
        return;
    }

    ddayAnimating = true;


    /*
       자동/스와이프 후
       다음 자동 전환까지 10초
       다시 카운트
    */

    clearTimeout(ddayTimer);


    ddayBox.classList.remove(
        "slide-in-left",
        "slide-in-right",
        "slide-out-left",
        "slide-out-right"
    );


    if(dir > 0){

        ddayBox.classList.add(
            "slide-out-left"
        );

    }else{

        ddayBox.classList.add(
            "slide-out-right"
        );

    }


    setTimeout(function(){

        /*
           실제 인덱스 변경
        */

        ddayIndex += dir;


        if(ddayIndex < 0){

            ddayIndex =
                ddayList.length - 1;

        }


        if(ddayIndex >= ddayList.length){

            ddayIndex = 0;

        }


        updateDday();


        /*
           기존 퇴장 애니메이션 제거
        */

        ddayBox.classList.remove(
            "slide-out-left",
            "slide-out-right"
        );


        /*
           새로운 항목 등장
        */

        if(dir > 0){

            ddayBox.classList.add(
                "slide-in-left"
            );

        }else{

            ddayBox.classList.add(
                "slide-in-right"
            );

        }


        setTimeout(function(){

            ddayBox.classList.remove(
                "slide-in-left",
                "slide-in-right"
            );

            ddayAnimating = false;

            /*
               전환이 끝난 시점부터
               다시 10초 카운트
            */

            resetDdayTimer();

        },400);

    },400);

}


/* ===== 초기 표시 ===== */

updateDday();

resetDdayTimer();


/* =========================================================
   DDAY 좌우 스와이프
   ========================================================= */

let ddayTouchStartX = 0;
let ddayTouchStartY = 0;

ddayBox.addEventListener(
    "touchstart",
    function(e){

        ddayTouchStartX =
            e.touches[0].clientX;

        ddayTouchStartY =
            e.touches[0].clientY;

    },
    { passive:true }
);


ddayBox.addEventListener(
    "touchend",
    function(e){

        const ddayTouchEndX =
            e.changedTouches[0].clientX;

        const ddayTouchEndY =
            e.changedTouches[0].clientY;


        const swipeDistanceX =
            ddayTouchEndX -
            ddayTouchStartX;

        const swipeDistanceY =
            ddayTouchEndY -
            ddayTouchStartY;


        /*
           가로 이동이 세로 이동보다
           클 때만 스와이프로 처리
        */

        if(
            Math.abs(swipeDistanceX) >
            Math.abs(swipeDistanceY)
        ){

            /*
               오른쪽 스와이프
               → 이전 D-DAY
            */

            if(swipeDistanceX > 50){

                moveDday(-1);

            }


            /*
               왼쪽 스와이프
               → 다음 D-DAY
            */

            else if(swipeDistanceX < -50){

                moveDday(1);

            }

        }

    },
    { passive:true }
);


/* ===== MOONRIDE COUNTER ===== */

const startTime = new Date("2026-09-09T18:00:00+09:00");

const CYCLE = 3601;

// 스밍리스트에서 Moonride가 나오는 위치
// 02:43 = 163초
// 32:15 = 1935초
const moonrideTimes = [163, 1935];

function getElapsedSeconds(){

  return Math.floor(
    (Date.now() - startTime.getTime()) / 1000
  );

}

function getCycleInfo(){

  const elapsed = getElapsedSeconds();

  const cycleCount = Math.floor(elapsed / CYCLE);

  const cycleTime = elapsed % CYCLE;

  return {
    cycleCount,
    cycleTime
  };

}

function getMoonrideCount(){

  const {
    cycleCount,
    cycleTime
  } = getCycleInfo();

  let count = cycleCount * 2;

  for(const t of moonrideTimes){

    if(cycleTime >= t){
      count++;
    }

  }

  return count;

}

function updateMoonride(){

  const el = document.getElementById("moonride-count");

  if(el)
    el.textContent = getMoonrideCount();

}

setInterval(updateMoonride, 1000);

updateMoonride();


/* =========================================================
   ===== KST SYNC MINI PLAYER =============================
   ========================================================= */


/*
   기준 시각

   2026-09-09 18:00:00 KST

   이 시점에 스밍리스트 1번 곡
   Lemon Tang이 0:00부터 시작합니다.
*/

const kstStartTime =
    new Date("2026-09-09T18:00:00+09:00");


/* ===== 스밍리스트 ===== */

const kstPlaylist = [

    {
        title:"Lemon Tang",
        duration:163
    },

    {
        title:"Moonride",
        duration:177
    },

    {
        title:"RUDE!",
        duration:200
    },

    {
        title:"FOCUS",
        duration:177
    },

    {
        title:"15-Love",
        duration:155
    },

    {
        title:"Lemon Tang",
        duration:163
    },

    {
        title:"RUDE!",
        duration:200
    },

    {
        title:"ICONIC HEART",
        duration:189
    },

    {
        title:"FOCUS",
        duration:177
    },

    {
        title:"Secret Recipe",
        duration:171
    },

    {
        title:"Lemon Tang",
        duration:163
    },

    {
        title:"Moonride",
        duration:177
    },

    {
        title:"RUDE!",
        duration:200
    },

    {
        title:"FOCUS",
        duration:177
    },

    {
        title:"Heart emoji (♡)",
        duration:179
    },

    {
        title:"Lemon Tang",
        duration:163
    },

    {
        title:"RUDE!",
        duration:200
    },

    {
        title:"ICONIC HEART",
        duration:189
    },

    {
        title:"STYLE",
        duration:210
    },

    {
        title:"처음투성이 (Baby Steps)",
        duration:171
    }

];


/*
   전체 플레이리스트 길이

   3601초 = 60분 1초
*/

const kstTotalDuration =
    kstPlaylist.reduce(
        (total, song) => total + song.duration,
        0
    );


/* ===== 플레이어 요소 ===== */

const kstPlayerTitle =
    document.getElementById(
        "kst-player-title"
    );

const kstPlayerNumber =
    document.getElementById(
        "kst-player-number"
    );

const kstPlayerTime =
    document.getElementById(
        "kst-player-time"
    );

const kstPlayerProgress =
    document.getElementById(
        "kst-player-progress-bar"
    );


/* ===== 시간 표시 ===== */

function formatKstTime(seconds){

    seconds = Math.max(
        0,
        Math.floor(seconds)
    );

    const minutes =
        Math.floor(seconds / 60);

    const remaining =
        seconds % 60;

    return (
        minutes +
        ":" +
        String(remaining).padStart(2,"0")
    );

}


/* =========================================================
   현재 KST 기준 플레이리스트 위치 계산
   ========================================================= */

function getKstPlayerPosition(){

    const now =
        Date.now();

    const start =
        kstStartTime.getTime();


    /*
       기준 시간보다 이전이라면
       아직 플레이리스트가 시작되지 않은 상태.
    */

    if(now < start){

        return {
            index:0,
            position:0
        };

    }


    /*
       기준 시각부터 현재까지
       몇 초가 지났는지 계산
    */

    const elapsed =
        Math.floor(
            (now - start) / 1000
        );


    /*
       3601초마다 정확하게 반복.
    */

    const cyclePosition =
        elapsed % kstTotalDuration;


    /*
       현재 cyclePosition이
       몇 번째 곡에 해당하는지 찾습니다.
    */

    let accumulated = 0;

    for(
        let i = 0;
        i < kstPlaylist.length;
        i++
    ){

        const song =
            kstPlaylist[i];


        const songEnd =
            accumulated +
            song.duration;


        if(
            cyclePosition <
            songEnd
        ){

            return {

                index:i,

                position:
                    cyclePosition -
                    accumulated

            };

        }


        accumulated =
            songEnd;

    }


    /*
       예외 처리
    */

    return {

        index:kstPlaylist.length - 1,

        position:
            kstPlaylist[
                kstPlaylist.length - 1
            ].duration - 1

    };

}


/* =========================================================
   플레이어 업데이트
   ========================================================= */

function updateKstPlayer(){

    const current =
        getKstPlayerPosition();


    const song =
        kstPlaylist[
            current.index
        ];


    const position =
        current.position;


    /*
       곡 제목
    */

    kstPlayerTitle.textContent =
        song.title;


    /*
       곡 번호

       예:
       13 / 20
    */

    kstPlayerNumber.textContent =
        `${current.index + 1} / ${kstPlaylist.length}`;


    /*
       현재 시간 / 전체 시간
    */

    kstPlayerTime.textContent =
        formatKstTime(position) +
        " / " +
        formatKstTime(song.duration);


    /*
       진행률
    */

    const progress =
        (
            position /
            song.duration
        ) * 100;


    kstPlayerProgress.style.width =
        Math.min(
            100,
            Math.max(
                0,
                progress
            )
        ) + "%";

}


/* =========================================================
   1초마다 업데이트
   ========================================================= */

setInterval(
    updateKstPlayer,
    1000
);


/*
   페이지 처음 열었을 때
   바로 현재 KST 위치 표시
*/

updateKstPlayer();

</script>


<script>

/* ===== TODAY SCHEDULE ===== */

const todaySchedule =
document.getElementById("today-schedule");

const today = new Date();

const yyyy = today.getFullYear();

const mm = String(
today.getMonth() + 1
).padStart(2, "0");

const dd = String(
today.getDate()
).padStart(2, "0");

const todayKey =
`${yyyy}-${mm}-${dd}`;

/*
현재 연도에 맞는 schedule-YYYY.json을 자동으로 불러옴

예:
2026년 → schedule-2026.json
2027년 → schedule-2027.json
2028년 → schedule-2028.json
*/

const scheduleFile =
`./schedule-${yyyy}.json`;

fetch(scheduleFile)

  .then(res => {

    if (!res.ok)
      throw new Error(`${scheduleFile} 로드 실패`);

    return res.json();

  })

  .then(scheduleData => {

    if (
      scheduleData &&
      scheduleData[todayKey]
    ) {

      todaySchedule.innerHTML =
        scheduleData[todayKey]
        .replace(/\n/g, "<br>");

    } else {

      todaySchedule.innerHTML =
        "오늘 일정이 없습니다.";

    }

  })

  .catch(err => {

    console.error(err);

    todaySchedule.innerHTML =
      "일정 데이터를 불러오지 못했습니다.";

  });

</script>

<script>

/* =========================================================
   SCROLL FADE
   ========================================================= */

const kstPlayer =
    document.getElementById("kst-player");

let kstScrollTimer;

window.addEventListener(
    "scroll",
    function(){

        /*
           스크롤 중에는 플레이어를 흐리게 표시
        */

        kstPlayer.classList.add(
            "scrolling"
        );


        /*
           스크롤이 멈춘 뒤
           0.5초 후 다시 선명하게 표시
        */

        clearTimeout(
            kstScrollTimer
        );

        kstScrollTimer =
            setTimeout(
                function(){

                    kstPlayer.classList.remove(
                        "scrolling"
                    );

                },
                500
            );

    },
    { passive:true }
);

</script>
