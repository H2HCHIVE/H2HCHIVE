/* =========================================================
   ===== KST SYNC MINI PLAYER =============================
   ========================================================= */

.kst-player{
    position:fixed;

    right:12px;
    bottom:12px;

    width:158px;
    min-height:48px;

    background:rgba(255,255,255,.96);

    border:1px solid rgba(0,0,0,.06);
    border-radius:14px;

    box-shadow:0 4px 14px rgba(0,0,0,.12);

    display:flex;
    align-items:center;

    padding:7px 8px;

    box-sizing:border-box;

    z-index:9999;

    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
}


/* 곡 정보 */

.kst-player-info{
    min-width:0;
    flex:1;

    overflow:hidden;
}

.kst-player-title{
    font-size:12px;
    font-weight:700;

    white-space:nowrap;

    text-overflow:ellipsis;

.kst-player-time{

/* 진행바 */

.kst-player-progress{
    width:100%;
    height:2px;

    margin-top:2px;

    background:#e5e5e5;

    border-radius:999px;

    overflow:hidden;
}

.kst-player-progress-bar{
    width:0%;
    height:100%;

    background:#222;

    transition:width .5s linear;
}


/* 재생 버튼 */

    width:30px;
    height:30px;

    margin-left:7px;

    padding:0;

    border:none;
    border-radius:50%;

    background:#222;
    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:11px;

    cursor:pointer;

    flex-shrink:0;
}

.kst-player-button:active{
    transform:scale(.92);
}


/* 실제 음원 재생이 아니라는 표시 */

.kst-player-label{
    position:absolute;

    right:9px;
    bottom:-13px;

    font-size:7px;

    color:#aaa;

    white-space:nowrap;
}


/* 작은 화면 */

@media(max-width:360px){

    .kst-player{
        width:148px;
        right:8px;
        bottom:8px;
    }

}

<script>

/* ===== MISSION ===== */

function toKSTDate(str){
return new Date(str + "T00:00:00+09:00");
}

const mission = document.getElementById("mission-list");

const schedules = [
{
start:"2026-09-14",
end:"2026-09-20",
items:[
{
text:"🗳멜론 주간인기상 투표하기",
link:"http://into.melon.com/weeklyaward"
}
]
},
];

const now = new Date();

let currentMission = [];

for (const s of schedules) {

  const start = toKSTDate(s.start);
  const end = toKSTDate(s.end);

  end.setHours(23,59,59,999);

  if (now >= start && now <= end) {
    currentMission.push(...s.items);
  }

}

mission.innerHTML = currentMission.length

  ? currentMission.map(item => {

      if (typeof item === "string") {
        return `<div>✅ ${item}</div>`;
      }

      return `
        <div class="mission-row">
          <span>✅ ${item.text}</span>
          <a class="mission-btn" href="${item.link}" target="_blank">바로가기</a>
        </div>
      `;

    }).join("")

  : "진행 중인 미션이 없습니다.";


/* ===== DDAY ===== */

const ddayList = [
{ name:"🫛 이안 생일", date:"2026-10-09T00:00:00+09:00", type:"dday" },
{ name:"👾 주은 생일", date:"2026-12-03T00:00:00+09:00", type:"dday" },
{ name:"🌻 에이나 생일", date:"2026-12-20T00:00:00+09:00", type:"dday" },
{ name:"🎉 데뷔", 
date:"2025-02-24T00:00:00+09:00", type:"debut" },
];

let ddayIndex = 0;

const ddayText = document.getElementById("dday-text");
const ddayLabel = document.getElementById("dday-label");

function updateDday(){

const item = ddayList[ddayIndex];

const now = new Date();
const target = new Date(item.date);

ddayText.textContent = item.name;

const diff = target - now;

const day = Math.ceil(diff / (1000 * 60 * 60 * 24));

if(item.type === "debut"){

const start = new Date(2025, 1, 24);

const today = new Date(
now.getFullYear(),
now.getMonth(),
now.getDate()
);

const diffDays =
Math.floor((today - start) / (1000*60*60*24)) + 1;

ddayLabel.textContent = `D+${diffDays}`;

return;

}

if (diff > 0) {
  ddayLabel.textContent = `D-${day}`;
} else {
  ddayLabel.textContent = "D-DAY";
}

}

function moveDday(dir){

ddayIndex += dir;

if(ddayIndex < 0)
ddayIndex = ddayList.length - 1;

if(ddayIndex >= ddayList.length)
ddayIndex = 0;

updateDday();

}

updateDday();


/* ===== MOONRIDE COUNTER ===== */

const startTime = new Date("2026-09-09T18:00:00+09:00");

const CYCLE = 3601;

// 스밍리스트에서 Moonride가 나오는 위치
// 02:43 = 163초
// 32:15 = 1935초
const moonrideTimes = [163, 1935];

function getElapsedSeconds(){

  return Math.floor(
    (Date.now() - startTime.getTime()) / 1000
  );

}

function getCycleInfo(){

  const elapsed = getElapsedSeconds();

  const cycleCount = Math.floor(elapsed / CYCLE);

  const cycleTime = elapsed % CYCLE;

  return {
    cycleCount,
    cycleTime
  };

}

function getMoonrideCount(){

  const {
    cycleCount,
    cycleTime
  } = getCycleInfo();

  let count = cycleCount * 2;

  for(const t of moonrideTimes){

    if(cycleTime >= t){
      count++;
    }

  }

  return count;

}

function updateMoonride(){

  const el = document.getElementById("moonride-count");

  if(el)
    el.textContent = getMoonrideCount();

}

setInterval(updateMoonride, 1000);

updateMoonride();


/* =========================================================
   ===== KST SYNC MINI PLAYER =============================
   ========================================================= */


/*
   기준 시각

   2026-09-09 18:00:00 KST

   이 시점에 스밍리스트 1번 곡
   Lemon Tang이 0:00부터 시작합니다.
*/

const kstStartTime =
    new Date("2026-09-09T18:00:00+09:00");


/* ===== 스밍리스트 ===== */

const kstPlaylist = [

    {
        title:"Lemon Tang",
        duration:163
    },

    {
        title:"Moonride",
        duration:177
    },

    {
        title:"RUDE!",
        duration:200
    },

    {
        title:"FOCUS",
        duration:177
    },

    {
        title:"15-Love",
        duration:155
    },

    {
        title:"Lemon Tang",
        duration:163
    },

    {
        title:"RUDE!",
        duration:200
    },

    {
        title:"ICONIC HEART",
        duration:189
    },

    {
        title:"FOCUS",
        duration:177
    },

    {
        title:"Secret Recipe",
        duration:171
    },

    {
        title:"Lemon Tang",
        duration:163
    },

    {
        title:"Moonride",
        duration:177
    },

    {
        title:"RUDE!",
        duration:200
    },

    {
        title:"FOCUS",
        duration:177
    },

    {
        title:"Heart emoji (♡)",
        duration:179
    },

    {
        title:"Lemon Tang",
        duration:163
    },

    {
        title:"RUDE!",
        duration:200
    },

    {
        title:"ICONIC HEART",
        duration:189
    },

    {
        title:"STYLE",
        duration:210
    },

    {
        title:"처음투성이 (Baby Steps)",
        duration:171
    }

];


/*
   전체 플레이리스트 길이

   3601초 = 60분 1초
*/

const kstTotalDuration =
    kstPlaylist.reduce(
        (total, song) => total + song.duration,
        0
    );


/* ===== 플레이어 요소 ===== */

const kstPlayerTitle =
    document.getElementById(
        "kst-player-title"
    );

const kstPlayerTime =
    document.getElementById(
        "kst-player-time"
    );

const kstPlayerProgress =
    document.getElementById(
        "kst-player-progress-bar"
    );

const kstPlayerButton =
    document.getElementById(
        "kst-player-button"
    );


/* ===== 플레이어 상태 ===== */

let kstPlayerPlaying = true;


/* ===== 시간 표시 ===== */

function formatKstTime(seconds){

    seconds = Math.max(
        0,
        Math.floor(seconds)
    );

    const minutes =
        Math.floor(seconds / 60);

    const remaining =
        seconds % 60;

    return (
        minutes +
        ":" +
        String(remaining).padStart(2,"0")
    );

}


/* =========================================================
   현재 KST 기준 플레이리스트 위치 계산
   ========================================================= */

function getKstPlayerPosition(){

    const now =
        Date.now();

    const start =
        kstStartTime.getTime();


    /*
       기준 시간보다 이전이라면
       아직 플레이리스트가 시작되지 않은 상태.
    */

    if(now < start){

        return {
            index:0,
            position:0
        };

    }


    /*
       기준 시각부터 현재까지
       몇 초가 지났는지 계산
    */

    const elapsed =
        Math.floor(
            (now - start) / 1000
        );


    /*
       3601초마다 정확하게 반복.

       % 연산을 사용하기 때문에

       18:00:00 → 0
       19:00:01 → 0
       20:00:02 → 0

       식으로 자동 계산됩니다.
    */

    const cyclePosition =
        elapsed % kstTotalDuration;


    /*
       현재 cyclePosition이
       몇 번째 곡에 해당하는지 찾습니다.
    */

    let accumulated = 0;

    for(
        let i = 0;
        i < kstPlaylist.length;
        i++
    ){

        const song =
            kstPlaylist[i];


        const songEnd =
            accumulated +
            song.duration;


        if(
            cyclePosition <
            songEnd
        ){

            return {

                index:i,

                position:
                    cyclePosition -
                    accumulated

            };

        }


        accumulated =
            songEnd;

    }


    /*
       이론적으로 여기까지 올 일은 없지만
       예외 상황에서는 마지막 곡으로 처리합니다.
    */

    return {

        index:kstPlaylist.length - 1,

        position:
            kstPlaylist[
                kstPlaylist.length - 1
            ].duration - 1

    };

}


/* =========================================================
   플레이어 업데이트
   ========================================================= */

function updateKstPlayer(){

    /*
       일시정지 상태에서도
       화면의 곡 정보 자체는
       현재 KST 위치를 기준으로 유지합니다.
    */

    const current =
        getKstPlayerPosition();


    const song =
        kstPlaylist[
            current.index
        ];


    const position =
        current.position;


    /*
       곡 제목
    */

    kstPlayerTitle.textContent =
        song.title;


    /*
       현재 시간 / 전체 시간
    */

    kstPlayerTime.textContent =
        formatKstTime(position) +
        " / " +
        formatKstTime(song.duration);


    /*
       진행률
    */

    const progress =
        (
            position /
            song.duration
        ) * 100;


    kstPlayerProgress.style.width =
        Math.min(
            100,
            Math.max(
                0,
                progress
            )
        ) + "%";


    /*
       재생 버튼
    */

    if(kstPlayerPlaying){

        kstPlayerButton.textContent =
            "❚❚";

        kstPlayerButton.setAttribute(
            "aria-label",
            "일시정지"
        );

    }else{

        kstPlayerButton.textContent =
            "▶";

        kstPlayerButton.setAttribute(
            "aria-label",
            "현재 시간으로 재생"
        );

    }

}


/* =========================================================
   재생 / 일시정지 버튼
   ========================================================= */

kstPlayerButton.addEventListener(
    "click",
    function(){

        kstPlayerPlaying =
            !kstPlayerPlaying;


        /*
           중요한 부분.

           ▶을 다시 누르면
           멈췄던 위치에서 단순히 이어가는 게 아니라

           "현재 KST가 어디인지"

           다시 계산합니다.

           따라서 KST 기준 동기화가 계속 유지됩니다.
        */

        updateKstPlayer();

    }
);


/* =========================================================
   1초마다 업데이트
   ========================================================= */

setInterval(
    updateKstPlayer,
    1000
);


/*
   페이지 처음 열었을 때
   바로 현재 KST 위치 표시
*/

updateKstPlayer();

</script>


<script>

/* ===== TODAY SCHEDULE ===== */

const todaySchedule =
document.getElementById("today-schedule");

const today = new Date();

const yyyy = today.getFullYear();

const mm = String(
today.getMonth() + 1
).padStart(2, "0");

const dd = String(
today.getDate()
).padStart(2, "0");

const todayKey =
`${yyyy}-${mm}-${dd}`;

/*
현재 연도에 맞는 schedule-YYYY.json을 자동으로 불러옴

예:
2026년 → schedule-2026.json
2027년 → schedule-2027.json
2028년 → schedule-2028.json
*/

const scheduleFile =
`./schedule-${yyyy}.json`;

fetch(scheduleFile)

  .then(res => {

    if (!res.ok)
      throw new Error(`${scheduleFile} 로드 실패`);

    return res.json();

  })

  .then(scheduleData => {

    if (
      scheduleData &&
      scheduleData[todayKey]
    ) {

      todaySchedule.innerHTML =
        scheduleData[todayKey]
        .replace(/\n/g, "<br>");

    } else {

      todaySchedule.innerHTML =
        "오늘 일정이 없습니다.";

    }

  })

  .catch(err => {

    console.error(err);

    todaySchedule.innerHTML =
      "일정 데이터를 불러오지 못했습니다.";

  });

</script>
